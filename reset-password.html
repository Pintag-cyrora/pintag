<!-- CSP mirrors admin.html: supabase-js from jsDelivr, Supabase API for connect. -->
<title>Pintag — Set a new password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#1A2428;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.box{width:100%;max-width:22rem;text-align:center;color:#E8EDF0}
.logo{font-weight:800;font-size:1.5rem;color:#2D8C8C;letter-spacing:-.02em}
.sub{color:#9AA7B0;font-size:.85rem;margin:.15rem 0 1.25rem}
input{width:100%;box-sizing:border-box;padding:.7rem .8rem;margin:.3rem 0;
  border:1px solid rgba(232,237,240,.18);border-radius:8px;background:#0F1418;color:#E8EDF0;font-size:1rem}
button{width:100%;padding:.7rem;margin-top:.6rem;border:0;border-radius:8px;
  background:#2D8C8C;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#F2837B;font-size:.85rem;margin-top:.6rem;display:none}
.note{color:#9AA7B0;font-size:.85rem;margin-top:.6rem;line-height:1.5;display:none}
a{color:#2D8C8C;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Pintag</div>
  <div class="sub">Set a new administrator password</div>

  <div id="form-wrap" style="display:none">
    <input type="password" id="pw1" placeholder="New password" autocomplete="new-password">
    <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password">
    <button id="save-btn">Update password</button>
  </div>

  <div class="err"  id="err"></div>
  <div class="note" id="note"></div>
</div>

<script src="config.js?v=__ASSET_VERSION__"></script>
<script>
// ============================================================================
// reset-password.html — the password-recovery handler.
// ============================================================================
// Reached ONLY via a Supabase recovery email whose redirectTo was set
// explicitly by admin-auth.js (never the project Site URL). supabase-js
// (detectSessionInUrl, default on) parses the '#access_token=...&type=recovery'
// hash on load, establishes a short-lived recovery session, and fires
// onAuthStateChange('PASSWORD_RECOVERY'). We then let the holder set a new
// password via auth.updateUser and bounce them to admin.html to sign in the
// normal way — this page does NOT grant admin access (the AAL2 gate in
// admin-auth.js is unchanged); it only rotates the password.
// ============================================================================
(function () {
  'use strict';
  var client = supabase.createClient(window.PINTAG.supabaseUrl, window.PINTAG.anonKey, { auth: { storageKey: window.PINTAG.authStorageKey } });
  var _ready = false;

  function err(t)  { var e=document.getElementById('err'),  n=document.getElementById('note'); n.style.display='none'; e.textContent=t||''; e.style.display=t?'block':'none'; }
  function note(t) { var e=document.getElementById('err'),  n=document.getElementById('note'); e.style.display='none'; n.textContent=t||''; n.style.display=t?'block':'none'; }

  function showForm() {
    if (_ready) return;
    _ready = true;
    document.getElementById('form-wrap').style.display = 'block';
    note('You are setting a new password for your Pintag administrator account.');
  }

  // The recovery session may already be established by the time this runs, or it
  // may arrive via the event — handle both.
  client.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') showForm();
  });
  client.auth.getSession().then(function (r) {
    if (r.data && r.data.session) showForm();
    else setTimeout(function () {
      if (!_ready) err('This password reset link is invalid or has expired. Request a new one from the admin sign-in page.');
    }, 1500);
  });

  // Map a Supabase updateUser() error to a message that names the ACTUAL cause.
  // A password-policy rejection (HTTP 422 / weak_password) must NOT be reported
  // as an expired link — that misleading behaviour is what this replaces.
  function describeUpdateError(e) {
    var status = e && e.status;
    var code = (e && e.code) || '';
    var m = (e && e.message) || '';
    if (status === 422 || code === 'weak_password' || /password/i.test(m)) {
      if (/character of each/i.test(m)) {
        return 'That password does not meet the requirements. Include at least one lowercase ' +
               'letter, one uppercase letter, one number, and one symbol.';
      }
      if (m) return m;                    // e.g. "Password should be at least 8 characters."
      return 'That password does not meet the requirements. Please choose a stronger one.';
    }
    if (status === 401 || status === 403 || code === 'session_not_found' ||
        /session|token|expired|jwt/i.test(m)) {
      return 'Your reset link has expired or was already used. Request a new one from the admin sign-in page.';
    }
    return 'Could not update the password' + (m ? ' (' + m + ')' : '') + '. Please try again.';
  }

  async function save() {
    var btn = document.getElementById('save-btn');
    var p1 = document.getElementById('pw1').value;
    var p2 = document.getElementById('pw2').value;
    if (!p1 || p1.length < 8) { err('Password must be at least 8 characters.'); return; }
    if (p1 !== p2)            { err('The two passwords do not match.'); return; }
    if (!(/[a-z]/.test(p1) && /[A-Z]/.test(p1) && /[0-9]/.test(p1) && /[^A-Za-z0-9]/.test(p1))) {
      err('Password must include a lowercase letter, an uppercase letter, a number, and a symbol.');
      return;
    }
    btn.disabled = true; err('');
    try {
      var r = await client.auth.updateUser({ password: p1 });
      if (r.error) throw r.error;
    } catch (e) {
      btn.disabled = false;
      err(describeUpdateError(e));
      return;
    }
    // Rotate out of the recovery session; force a clean, full AAL2 sign-in.
    try { await client.auth.signOut(); } catch (_) {}
    document.getElementById('form-wrap').style.display = 'none';
    note('Password updated. Redirecting you to the admin sign-in…');
    setTimeout(function () { window.location.href = 'admin.html'; }, 1800);
  }
  document.getElementById('save-btn').addEventListener('click', save);
})();
</script>
</body>
</html>
