<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src https://*.supabase.co; frame-src 'none'; object-src 'none';">
<title>Marketing OS — Pintag</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1A2428;--teal:#2D8C8C;--teal-light:#38A8A8;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
.login-box{width:100%;max-width:360px;padding:48px 40px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-align:center;}
.login-logo{font-size:22px;font-weight:600;color:#fff;margin-bottom:6px;}
.login-sub{font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:32px;}
.login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;font-family:inherit;margin-bottom:12px;border-radius:3px;}
.login-input::placeholder{color:rgba(255,255,255,0.3);}
.login-btn{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;font-size:14px;font-weight:500;cursor:pointer;border-radius:3px;font-family:inherit;transition:background 0.2s;}
.login-btn:hover{background:var(--teal-light);}
.login-btn:disabled{opacity:0.6;cursor:default;}
.login-error{color:#e74c3c;font-size:13px;margin-top:8px;display:none;}
#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:rgba(255,255,255,0.5);font-size:14px;}
</style>
</head>
<body>

<!-- Shown while checking for an existing session, before we know whether to render the login screen or the brief. -->
<div id="loading-screen">Loading…</div>

<!-- Same visual pattern as admin.html's login screen (repo root) — a
     deliberately separate Supabase Auth session, against pintag-studio's
     own project, not the main site's. See SETUP.md, "Marketing OS Morning
     Brief" section, for why these two logins are kept independent. -->
<div id="login-screen" style="display:none;">
  <div class="login-box">
    <p class="login-logo">Marketing OS</p>
    <p class="login-sub">Founder Access</p>
    <input type="password" class="login-input" id="password-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" id="login-btn" onclick="login()">Sign In</button>
    <p class="login-error" id="login-error">Sign-in failed — check your password.</p>
  </div>
</div>

<script>
// Fill these in once the pintag-studio Supabase project's real values are
// known — see pintag-studio/SETUP.md, "Marketing OS Morning Brief" section.
// Deliberately a DIFFERENT project than admin.html's (which is the main
// site's) — this is the one thing that keeps Marketing OS's data/auth
// fully self-contained, so moving it to marketingos.ai later is a hosting
// change here, not a data migration.
const SUPABASE_URL = 'REPLACE_WITH_PINTAG_STUDIO_SUPABASE_URL';
const SUPABASE_ANON = 'REPLACE_WITH_PINTAG_STUDIO_SUPABASE_ANON_KEY';
// The one founder account provisioned in that project for this page — see
// SETUP.md for how to create it. Password is never stored here; only the
// email is fixed, same convention as admin.html's ADMIN_EMAIL.
const FOUNDER_EMAIL = 'admin@pintag.io';

const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function fetchAndShowBrief() {
  const { data, error } = await sbClient
    .from('morning_briefs')
    .select('rendered_html, generated_at')
    .eq('org_id', 'pintag')
    .single();

  if (error || !data) {
    document.getElementById('loading-screen').textContent =
      'No Morning Brief has been published yet — run `npm run daily-briefing` locally to generate and publish the first one.';
    return;
  }

  // shell.ts's bottom nav (Morning/Research/.../Teach) is meant for
  // founder-server.ts's own host — those links are meaningless here, so
  // hide it. renderMorningPage()'s own staleness-poll script already
  // fails silently (try/catch) when there's no /api/morning/status behind
  // it, exactly this case, by design (see renderers/web/render.ts).
  const html = data.rendered_html.replace('<head>', '<head>\n<style>.primary-nav{display:none}</style>');
  document.open();
  document.write(html);
  document.close();
}

async function login() {
  const pw = document.getElementById('password-input').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  const { error } = await sbClient.auth.signInWithPassword({ email: FOUNDER_EMAIL, password: pw });
  btn.disabled = false;
  btn.textContent = 'Sign In';
  if (error) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  await fetchAndShowBrief();
}

sbClient.auth.getSession().then(({ data: { session } }) => {
  document.getElementById('loading-screen').style.display = 'none';
  if (session) {
    fetchAndShowBrief();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
});
</script>
</body>
</html>
