<!DOCTYPE html>
<html lang="lo">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src https://*.supabase.co; frame-src 'none'; object-src 'none';">
<title>ເພີ່ມອະສັງຫາ · Pintag</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#F5F1EA;
  --card:#FFFFFF;
  --text:#172026;
  --muted:#7C8B92;
  --line:rgba(23,32,38,0.08);
  --teal:#2D8C8C;
  --danger:#B45B5B;
  --radius:22px;
}
<div class="delete-modal" id="deleteModal">

  <div class="delete-box">

    <h3>Delete Listing?</h3>

    <p>
      This action cannot be undone.
    </p>

    <div class="delete-actions">

      <button
        class="cancel-btn"
        onclick="closeDeleteModal()"
      >
        Cancel
      </button>

      <button
        class="confirm-btn"
        onclick="confirmDelete()"
      >
        Delete
      </button>

    </div>

  </div>

</div>
body{
  background:var(--bg);
  font-family:"Noto Sans Lao",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

.page{
  max-width:760px;
  margin:auto;
  padding:28px 18px 120px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.topbar h1{
  font-size:38px;
  line-height:1.05;
  letter-spacing:-0.03em;
}

.back{
  text-decoration:none;
  color:var(--teal);
  font-size:16px;
  font-weight:600;
}

.form-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:22px;
  border:1px solid var(--line);
}

.section{
  margin-bottom:28px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:18px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  margin-bottom:10px;
  font-size:15px;
  font-weight:600;
}

/* Rental Terms panel: reuses rental-terms.js's shared renderRentalTermsFields()
   DOM structure (form-field/rt-row/form-label/form-input/rt-*) rather than a
   second hand-rolled per-field renderer -- these rules only make that shared
   structure look native to this page (rounded .input/.select look, Noto Sans
   Lao), they don't change any behavior or duplicate field definitions. */
.rt-row{margin-bottom:14px;}
.rt-row .form-label{display:block;margin-bottom:10px;font-size:15px;font-weight:600;}
.rt-row select,.rt-row input[type=text],.rt-row input[type=number]{
  border:1px solid var(--line);background:#fff;border-radius:18px;
  padding:14px;font-size:15px;font-family:"Noto Sans Lao",sans-serif;outline:none;
}
.rt-field-money,.rt-field-utility{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rt-field-included-amount{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;}
.rt-period-hint{font-size:13px;color:var(--muted);white-space:nowrap;}
.rt-field-fees{display:flex;flex-direction:column;gap:8px;}
.rt-fee-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;}
.rt-fee-remove{border:none;background:#EFE7E4;color:var(--danger);border-radius:12px;padding:10px 12px;cursor:pointer;}
.rt-fee-add{border:1px dashed rgba(45,140,140,0.4);background:rgba(45,140,140,0.04);color:var(--teal);border-radius:14px;padding:10px;cursor:pointer;width:100%;}
.rt-field-checkboxes{display:flex;flex-wrap:wrap;gap:10px;}
.rt-checkbox-item{display:flex;align-items:center;gap:6px;background:#F8F5F1;border-radius:14px;padding:8px 12px;font-size:14px;}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  padding:16px;
  font-size:16px;
  font-family:"Noto Sans Lao",sans-serif;
  outline:none;
}

.textarea{
  min-height:140px;
  resize:none;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.upload-box{
  border:2px dashed rgba(45,140,140,0.25);
  border-radius:22px;
  background:rgba(45,140,140,0.04);
  padding:34px 20px;
  text-align:center;
}

.upload-text{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.feature{
  display:flex;
  align-items:center;
  gap:10px;
  background:#F8F5F1;
  border-radius:16px;
  padding:14px;
}

.actions{
  display:flex;
  gap:14px;
  margin-top:30px;
}

.btn{
  flex:1;
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:16px;
  font-family:"Noto Sans Lao",sans-serif;
  font-weight:700;
  cursor:pointer;
}

.btn-primary{
  background:var(--teal);
  color:#fff;
}

.btn-secondary{
  background:#EFE7E4;
  color:var(--danger);
}
.delete-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}

.delete-box{
  background:#fff;
  width:100%;
  max-width:380px;
  border-radius:24px;
  padding:26px;
}

.delete-box h3{
  font-size:24px;
  margin-bottom:10px;
}

.delete-box p{
  color:#7C8B92;
  line-height:1.6;
  margin-bottom:22px;
}

.delete-actions{
  display:flex;
  gap:12px;
}

.cancel-btn,
.confirm-btn{
  flex:1;
  border:none;
  border-radius:16px;
  padding:16px;
  font-weight:700;
  cursor:pointer;
}

.cancel-btn{
  background:#F3F1EE;
}

.confirm-btn{
  background:#B45B5B;
  color:#fff;
}
.status-text{
  margin-top:18px;
  font-size:14px;
  color:var(--muted);
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.preview-grid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
}

@media(max-width:640px){

  .topbar h1{
    font-size:30px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .features{
    grid-template-columns:1fr;
  }

  .preview-grid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <h1>ເພີ່ມອະສັງຫາ</h1>

    <a href="dashboard.html" class="back">
      ← ກັບຄືນ
    </a>
  </div>

  <div class="form-card">

    <!-- IMAGES -->

    <div class="section">

      <div class="section-title">
        ຮູບພາບ
      </div>

      <div class="upload-box">

     <div class="upload-text">
  ອັບໂຫລດຫຼາຍຮູບໄດ້<br>
  ຮູບທຳອິດຈະເປັນຮູບໜ້າປົກ
</div>

        <input
          type="file"
          id="images"
          multiple
          accept="image/*"
        >

      </div>

      <div class="preview-grid" id="previewGrid"></div>

    </div>

    <!-- BASIC -->

    <div class="section">

      <div class="section-title">
        ຂໍ້ມູນພື້ນຖານ
      </div>

      <div class="field">
        <label>ຫົວຂໍ້</label>

        <input
          type="text"
          class="input"
          id="title"
        >
      </div>

      <div class="grid">

        <div class="field">
          <label>ປະເພດ</label>

          <select class="select" id="propertyType" onchange="renderPropertyTypeFields(this.value)">
          </select>
        </div>

        <div class="field">
          <label>ຂາຍ / ເຊົ່າ</label>

          <select class="select" id="listingType" onchange="updateRentalTermsVisibility()">
            <option value="for_sale">ຂາຍ</option>
            <option value="for_rent">ເຊົ່າ</option>
            <option value="sale_or_rent">ຊື້ / ເຊົ່າ</option>
          </select>
        </div>

      </div>

      <!-- Structured pricing (20260731000000_structured_pricing.sql) --
           mirrors admin.html's single-price mode. This page has no dual
           sale+rent UI (never did, even before this migration -- the
           listingType select already offers "ຊື້ / ເຊົ່າ" but only ever
           had one price field), so sale_or_rent listings created here
           still capture one price only, written as the sale leg
           (price_frequency='one_time'), matching how the legacy single
           #price field already behaved for that case. -->
      <div class="field">
        <label>ລາຄາ</label>
        <div class="rt-field-money">
          <input type="number" min="0" class="input" id="priceAmount" placeholder="120000">
          <select class="select" id="priceCurrency"></select>
          <select class="select" id="priceFrequency"></select>
        </div>
      </div>

    </div>

    <!-- RENTAL TERMS (deposit, cleaning deposit, utilities, policies, fees)
         — the full set from RENTAL_TERMS_FIELDS (rental-terms.js), the same
         registry admin.html's Rental Terms section reads from. Gated on
         listing_type === rent via isRentalTransactionType(), not
         property_type -- these are rental contract terms, identical
         regardless of whether the property is an apartment, condo, house,
         villa, townhouse, shophouse, office, warehouse, or land lease.
         See updateRentalTermsVisibility(). -->
    <div class="section" id="rental-terms-section" style="display:none;">

      <div class="section-title">
        ເງື່ອນໄຂການເຊົ່າ
      </div>

      <div id="rental-terms-grid"></div>

    </div>

    <!-- LOCATION -->

    <div class="section">

      <div class="section-title">
        ສະຖານທີ່
      </div>

      <div class="grid">

        <div class="field">
          <label>ເມືອງ</label>

          <input
            type="text"
            class="input"
            id="district"
          >
        </div>

        <div class="field">
          <label>ບ້ານ</label>

          <input
            type="text"
            class="input"
            id="village"
          >
        </div>

      </div>

    </div>

    <!-- DETAILS -->

    <div class="section">

      <div class="section-title">
        ລາຍລະອຽດ
      </div>

      <!-- Rendered dynamically from PROPERTY_TYPE_FIELDS (terminology.js)
           based on the selected property type; see renderPropertyTypeFields()
           below. Land, for example, renders no fields here at all. -->
      <div class="grid" id="property-details-grid"></div>

      <div class="field">
        <label>ລາຍລະອຽດ</label>

        <textarea
          class="textarea"
          id="description"
        ></textarea>
      </div>

    </div>

    <!-- FEATURES -->

    <div class="section">

      <div class="section-title">
        ສິ່ງອຳນວຍຄວາມສະດວກ
      </div>

      <!-- Rendered dynamically from PROPERTY_TYPE_FIELDS's amenities
           checkbox_ref for the selected property type; see
           renderPropertyTypeFields() below. -->
      <div class="features" id="property-features-grid"></div>

    </div>

    <!-- BUYER CONTACT -->

    <div class="section">

      <div class="section-title">
        ຜູ້ຕິດຕໍ່ (Buyer Contact)
      </div>

      <div class="field">
        <label>ຊື່ຜູ້ຕິດຕໍ່</label>
        <input class="input" id="contactName" placeholder="ຄ່າເລີ່ມຕົ້ນ: ຊື່ຂອງທ່ານ">
      </div>

      <div class="field">
        <label>ເບີໂທ *</label>
        <input class="input" id="contactPhone" placeholder="020 XXXXXXXX">
      </div>

    </div>

    <!-- STATUS -->

<div class="section">

  <div class="section-title">
    ສະຖານະ
  </div>

  <select class="select" id="status">

    <option value="published">
      Published
    </option>

    <option value="draft">
      Draft
    </option>

    <option value="sold">
      Sold
    </option>

    <option value="rented">
      Rented
    </option>

  </select>

</div>

    <!-- BUTTONS -->

    <div class="actions">

      <button
        class="btn btn-primary"
        onclick="saveProperty()"
      >
        ບັນທຶກ
      </button>

      <button
        class="btn btn-secondary"
        onclick="window.location.href='dashboard.html'"
      >
        ຍົກເລີກ
      </button>

    </div>

    <div class="status-text" id="statusText"></div>

  </div>

</div>

<script src="config.js?v=__ASSET_VERSION__"></script>
<script src="dev-banner.js?v=__ASSET_VERSION__"></script>
<script src="terminology.js?v=__ASSET_VERSION__"></script>
<script src="amenities.js?v=__ASSET_VERSION__"></script>
<script src="currency.js?v=__ASSET_VERSION__"></script>
<script src="rental-terms.js?v=__ASSET_VERSION__"></script>
  <script src="contact-languages.js?v=__ASSET_VERSION__"></script>
<script>

const SUPABASE_URL = window.PINTAG.supabaseUrl;

const SUPABASE_KEY = window.PINTAG.anonKey;

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
let deleteId = null;

// Resolves the logged-in user's own party row — checks auth_user_id first
// (the decoupled model going forward), falling back to id (the legacy
// "agents.id == auth uid" convention preserved for pre-existing agents).
async function resolveMyPartyId(userId){
  const { data } = await supabaseClient
    .from('parties')
    .select('id,name_en,whatsapp')
    .or(`auth_user_id.eq.${userId},id.eq.${userId}`)
    .limit(1);
  return (data && data[0]) || null;
}

// Rental Terms: the full RENTAL_TERMS_FIELDS registry (rental-terms.js),
// the same one admin.html's Rental Terms section reads from -- not just
// Deposit. Rendered via the shared renderRentalTermsFields(container,
// values, onChange, fieldKeys, lang) with lang='lo' so it reads in Lao
// like the rest of this page; the CSS above (.rt-row etc.) is what makes
// that shared DOM structure look native here instead of admin.html's
// English styling. _rentalTermsFieldValues mirrors the same
// "local working object, mutated via onChange, read at save time" pattern
// admin.html's _buildingRentalTermsValues already uses.
let _rentalTermsFieldValues = {};

function renderRentalTermsPanel(){
  renderRentalTermsFields(
    document.getElementById('rental-terms-grid'),
    _rentalTermsFieldValues,
    function(key, value){ if (value == null) delete _rentalTermsFieldValues[key]; else _rentalTermsFieldValues[key] = value; },
    undefined,
    'lo'
  );
}
renderRentalTermsPanel();

// Rental Terms only applies once listing_type is a rental (for_rent or
// sale_or_rent) -- not property_type. isRentalTransactionType() is
// rental-terms.js's single source of truth for that check, shared with
// admin.html/edit-listing.html/listings.html's search filters.
function updateRentalTermsVisibility(){
  const tx = document.getElementById('listingType').value;
  const section = document.getElementById('rental-terms-section');
  if (section) section.style.display = isRentalTransactionType(tx) ? '' : 'none';
  // Single-mode frequency only means something for a rental cadence -- a
  // sale's frequency is always forced to 'one_time' at save time (see
  // buildPricePayload()), and the select never offers a 'one_time' option,
  // so it's hidden rather than shown-but-meaningless for a sale.
  const freqEl = document.getElementById('priceFrequency');
  if (freqEl) freqEl.style.display = isRentalTransactionType(tx) ? '' : 'none';
}
updateRentalTermsVisibility();

// Populates the currency/frequency <select>s once at page load -- their
// options never change. currency.js/PRICE_FREQUENCY_OPTIONS is the single
// source of truth (shared with admin.html/edit-listing.html).
(function populatePriceSelectors(){
  const curEl = document.getElementById('priceCurrency');
  curEl.innerHTML = Object.keys(CURRENCIES).map(function(code){
    return '<option value="' + code + '"' + (code === DEFAULT_CURRENCY ? ' selected' : '') + '>' + CURRENCIES[code].symbol + ' ' + code + '</option>';
  }).join('');
  const freqEl = document.getElementById('priceFrequency');
  freqEl.innerHTML = PRICE_FREQUENCY_OPTIONS.map(function(o){
    return '<option value="' + o.value + '"' + (o.value === 'monthly' ? ' selected' : '') + '>' + o.label + '</option>';
  }).join('');
})();

// Reads the Price fields and returns both the structured payload and its
// derived legacy price_display text (currency.js's deriveLegacyPriceFields())
// -- the one place "the price" is computed from, mirroring admin.html's
// computeStructuredPrice(). price_frequency is forced to 'one_time' for any
// non-rental listingType (including sale_or_rent, which has no separate
// rent leg on this simpler self-service form -- see the markup comment).
function buildPricePayload(){
  const listingType = document.getElementById('listingType').value;
  const isRental = isRentalTransactionType(listingType);
  const raw = document.getElementById('priceAmount').value.trim();
  const amount = raw === '' ? null : Number(raw);
  const currency = amount != null ? document.getElementById('priceCurrency').value : null;
  const frequency = amount == null ? null : (isRental ? document.getElementById('priceFrequency').value : 'one_time');
  return {
    price_amount: amount,
    price_currency: currency,
    price_frequency: frequency,
    price_display: deriveLegacyPriceFields(amount, currency, frequency)
  };
}

// Populate the Property Type dropdown from PROPERTY_TYPES (terminology.js)
// using Lao labels, since this page is Lao-only UI.
(function populatePropertyTypeOptions(){
  const sel = document.getElementById('propertyType');
  sel.innerHTML = Object.keys(PROPERTY_TYPES).map(function(key){
    return '<option value="' + key + '">' + PROPERTY_TYPES[key].lo + '</option>';
  }).join('');
})();

function getCheckedFeatureKeys(){
  return Array.from(document.querySelectorAll('#property-features-grid input:checked')).map(function(el){ return el.value; });
}

// Renders the Property Details fields and the Features checkboxes for the
// selected property type from PROPERTY_TYPE_FIELDS (terminology.js). Only
// the AMENITIES-registry checkbox_ref is used here (not FEATURES), since
// this page has a single combined features/amenities checkbox list mapped
// to the `amenities` column, unlike admin.html's two separate sections.
function getCheckedMultiKeys(gridId){
  const el = document.getElementById(gridId);
  return el ? Array.from(el.querySelectorAll('input:checked')).map(function(cb){ return cb.value; }) : [];
}

function renderPropertyTypeFields(typeKey){
  const detailsGrid = document.getElementById('property-details-grid');
  const featuresGrid = document.getElementById('property-features-grid');
  if(!detailsGrid || !featuresGrid) return;
  const fields = PROPERTY_TYPE_FIELDS[typeKey] || [];
  const prevChecked = getCheckedFeatureKeys();
  const multiFields = fields.filter(function(f){ return f.kind === 'multi_checkbox'; });
  const prevMulti = {};
  multiFields.forEach(function(f){ prevMulti[f.id] = getCheckedMultiKeys(f.id + '-grid'); });

  detailsGrid.innerHTML = fields.filter(function(f){ return f.kind !== 'checkbox_ref'; }).map(function(f){
    if(f.kind === 'select'){
      const opts = f.options.map(function(o){
        return '<option value="' + o.value + '">' + o.label.lo + '</option>';
      }).join('');
      return '<div class="field"><label>' + f.label.lo + '</label><select class="select" id="' + f.id + '">' + opts + '</select></div>';
    }
    if(f.kind === 'multi_checkbox'){
      const items = f.options.map(function(o){
        return '<label class="feature"><input type="checkbox" value="' + o.value + '">' + o.label.lo + '</label>';
      }).join('');
      return '<div class="field"><label>' + f.label.lo + '</label><div class="features" id="' + f.id + '-grid">' + items + '</div></div>';
    }
    return '<div class="field"><label>' + f.label.lo + '</label><input type="' + (f.kind === 'text' ? 'text' : 'number') + '" class="input" id="' + f.id + '"' +
      (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
      (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '') + '></div>';
  }).join('');

  multiFields.forEach(function(f){
    const container = document.getElementById(f.id + '-grid');
    if(!container) return;
    (prevMulti[f.id] || []).forEach(function(v){
      const cb = container.querySelector('input[value="' + v + '"]');
      if(cb) cb.checked = true;
    });
  });

  const amenityField = fields.find(function(f){ return f.kind === 'checkbox_ref' && f.registry === 'AMENITIES'; });
  const keys = amenityField ? amenityField.keys : [];
  featuresGrid.innerHTML = keys.map(function(key){
    const a = AMENITIES[key];
    if(!a) return '';
    return '<label class="feature"><input type="checkbox" value="' + key + '">' + a.lo + '</label>';
  }).join('');
  keys.forEach(function(key){
    if(prevChecked.indexOf(key) === -1) return;
    const input = featuresGrid.querySelector('input[value="' + key + '"]');
    if(input) input.checked = true;
  });
}

function populateTypedFields(typeKey, sourceRow){
  (PROPERTY_TYPE_FIELDS[typeKey] || []).forEach(function(f){
    if(!f.column) return;
    if(f.kind === 'multi_checkbox'){
      const container = document.getElementById(f.id + '-grid');
      if(!container) return;
      const values = Array.isArray(sourceRow && sourceRow[f.column]) ? sourceRow[f.column] : [];
      container.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        cb.checked = values.indexOf(cb.value) !== -1;
      });
      return;
    }
    const el = document.getElementById(f.id);
    if(!el) return;
    const v = sourceRow ? sourceRow[f.column] : null;
    el.value = (v != null ? v : '');
  });
}

function buildTypedFieldsPayload(typeKey){
  const activeIds = {};
  (PROPERTY_TYPE_FIELDS[typeKey] || []).forEach(function(f){ if(f.column) activeIds[f.id] = f; });
  const allColumns = {};
  Object.keys(PROPERTY_TYPE_FIELDS).forEach(function(key){
    PROPERTY_TYPE_FIELDS[key].forEach(function(f){ if(f.column) allColumns[f.column] = f; });
  });
  const out = {};
  Object.keys(allColumns).forEach(function(column){
    const f = allColumns[column];
    const active = activeIds[f.id];
    if(!active){ out[column] = null; return; }
    if(f.kind === 'multi_checkbox'){ out[column] = getCheckedMultiKeys(f.id + '-grid'); return; }
    const el = document.getElementById(f.id);
    if(!el){ out[column] = null; return; }
    out[column] = f.kind === 'number' ? (parseInt(el.value) || null) : (el.value.trim() || null);
  });
  return out;
}

const imageInput =
  document.getElementById('images');

const previewGrid =
  document.getElementById('previewGrid');

let selectedFiles = [];

imageInput.addEventListener('change',function(e){

  selectedFiles =
    Array.from(e.target.files);

  previewGrid.innerHTML = '';

  selectedFiles.forEach(file=>{

    const reader = new FileReader();

    reader.onload = function(event){

      const img =
        document.createElement('img');

      img.src = event.target.result;

      previewGrid.appendChild(img);

    };

    reader.readAsDataURL(file);

  });

});
async function compressImage(file){

  return new Promise((resolve)=>{

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = function(event){

      const img = new Image();

      img.src = event.target.result;

      img.onload = function(){

        const canvas =
          document.createElement('canvas');

        const MAX_WIDTH = 1600;

        let width = img.width;
        let height = img.height;

        if(width > MAX_WIDTH){

          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;

        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(

          (blob)=>{

            resolve(
              new File(
                [blob],
                file.name,
                {
                  type:'image/jpeg'
                }
              )
            );

          },

          'image/jpeg',
          0.78

        );

      };

    };

  });

}
async function uploadImages(){

  const uploadedUrls = [];

  for(let file of selectedFiles){

  file =
    await compressImage(file);

    const fileName =
      Date.now() + '-' + file.name;

    const { error } =
      await supabaseClient
        .storage
        .from('property-images')
        // P2: long cache (new uploads only). The SDK sets max-age; the `immutable`
        // directive is added on delivery by the image CDN Worker. Safe: names are
        // content-unique and never overwritten.
        .upload(fileName, file, { cacheControl: '31536000' });

    if(error){
      console.error(error);
      continue;
    }

    const { data } =
      supabaseClient
        .storage
        .from('property-images')
        .getPublicUrl(fileName);

    uploadedUrls.push(data.publicUrl);

  }

  return uploadedUrls;

}

function slugify(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');

}

async function saveProperty(){

  const statusText =
    document.getElementById('statusText');

  statusText.innerText =
    'ກຳລັງບັນທຶກ...';

  const {
    data:{ user }
  } = await supabaseClient.auth.getUser();

  if(!user){

    window.location.href =
      'agent-login.html';

    return;
  }

  const myParty = await resolveMyPartyId(user.id);

  if(!myParty){
    statusText.innerText =
      'ບັນຊີຕົວແທນຂອງທ່ານຍັງບໍ່ໄດ້ຕັ້ງຄ່າ. ກະລຸນາຕິດຕໍ່ Pintag staff.';
    return;
  }

  const contactPhone =
    document.getElementById('contactPhone').value.trim();

  if(!contactPhone){
    statusText.innerText =
      'ກະລຸນາປ້ອນເບີໂທຜູ້ຕິດຕໍ່.';
    return;
  }

  const { data: contactRows, error: contactError } =
    await supabaseClient
      .from('contacts')
      .insert({
        role: 'agent',
        name: document.getElementById('contactName').value.trim() || null,
        phone: contactPhone,
        whatsapp: contactPhone,
        party_id: myParty.id,
        created_by: user.id
      })
      .select('id');

  if(contactError){
    console.error(contactError);
    statusText.innerText =
      contactError.message;
    return;
  }

  const contactId = contactRows[0].id;

  const title =
    document.getElementById('title').value;

  const propertyType =
    document.getElementById('propertyType').value;

  const listingType =
    document.getElementById('listingType').value;

  const pricePayload =
    buildPricePayload();

  const district =
    document.getElementById('district').value;

  const village =
    document.getElementById('village').value;

  const description =
    document.getElementById('description').value;

  const status =
    document.getElementById('status').value;

  // properties.status is now derived server-side from workflow_status by
  // trg_properties_status_sync (20260729000000_listing_status_model.sql) --
  // it collapses to 'active' for any active listing regardless of
  // market_status, and to 'draft' when workflow_status='draft'. Sending
  // status:'published'/'sold'/'rented' directly, with no matching
  // workflow_status/market_status, would get silently overwritten to
  // 'active' by the trigger on INSERT (it always fires), which happened to
  // still work by accident for 'published' but would have permanently hid
  // this listing from every RLS-gated table (contacts/listing_events/
  // unit_types all key off status IN ('active','available')) had this
  // stayed 'sold'/'rented'/anything else unmapped. Map explicitly instead
  // of relying on that accident.
  const workflowStatus = status === 'draft' ? 'draft' : 'active';
  const marketStatus = (status === 'sold' || status === 'rented') ? status : 'available';

  const amenities =
    getCheckedFeatureKeys();

  const imageUrls =
    await uploadImages();

  const slug =
    slugify(title) +
    '-' +
    Date.now();

  const { data:insertedRows, error } =
    await supabaseClient
      .from('properties')
      .insert({

        title_en:title,
        title_lo:title,

        slug:slug,

        property_type:propertyType,

        transaction_type:listingType,

        price_amount:pricePayload.price_amount,
        price_currency:pricePayload.price_currency,
        price_frequency:pricePayload.price_frequency,
        price_display:pricePayload.price_display,

        district_en:district,
        district_lo:district,

        village_en:village,
        village_lo:village,

        description_en:description,
        description_lo:description,

        amenities:amenities,

        images:imageUrls,

        workflow_status:workflowStatus,
        market_status:marketStatus,

        managed_by_party_id:myParty.id,
        contact_id:contactId,

        rental_terms:buildRentalTermsPayload(isRentalTransactionType(listingType) ? _rentalTermsFieldValues : {}),

        ...buildTypedFieldsPayload(propertyType)

      })
      .select('id');

if(error){

  console.error(error);

  alert(JSON.stringify(error));

  statusText.innerText =
    error.message;

  return;
}

  // The listing's contact must also exist as its PRIMARY property_contacts
  // row. Before this, add-property wrote properties.contact_id and nothing
  // else, so a listing created here was invisible to the language router
  // until an admin happened to re-save it (see
  // 20260823000000_contact_primary_invariant.sql).
  //
  // Best-effort on purpose: the listing IS saved by this point, and the
  // database trigger from that migration writes the same row anyway. Failing
  // the whole save over the redundant half would turn a safety net into a new
  // way to lose a listing.
  try {
    const newId = Array.isArray(insertedRows) && insertedRows[0] ? insertedRows[0].id : null;
    if (newId && contactId && typeof ensurePrimaryContactLink === 'function') {
      await ensurePrimaryContactLink(
        supabaseJsContactLinkIO(supabaseClient), newId, contactId);
    }
  } catch (linkErr) {
    console.error('[contact-link]', linkErr);
  }

  statusText.innerText =
    'ບັນທຶກສຳເລັດ';

  setTimeout(function(){

    window.location.href =
      'dashboard.html';

  },1200);

}
