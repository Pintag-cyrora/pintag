# Local/manual deploy: wrangler deploy   (from inside cloudflare-worker/)
# CI deploy (every push to main): .github/workflows/deploy-prod.yml's
# deploy-worker job, via cloudflare/wrangler-action.
# See README.md for the full one-time setup (account id, route, secrets).

name = "pintag-og-listing-preview"
main = "og-listing-preview.js"
compatibility_date = "2024-09-23"

# account_id is intentionally NOT set in this file.
#
# IMPORTANT: an explicit `account_id` here takes PRECEDENCE over the
# CLOUDFLARE_ACCOUNT_ID env var — the opposite of what a previous comment
# claimed. A placeholder value therefore BREAKS CI: wrangler tries to deploy to
# the literal placeholder account and fails with Cloudflare API error 7003
# ("Could not route to /accounts/REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID/…").
#
# Leaving account_id unset makes wrangler read the account from
# CLOUDFLARE_ACCOUNT_ID: the GitHub Secret in CI (supplied by the deploy-worker
# job), or your `wrangler login` session / a CLOUDFLARE_ACCOUNT_ID env var for
# local/manual deploys.

# Runs this Worker in front of pintag.io for exactly the four routes it
# needs to touch (listing.html, listings.html, and the homepage via both
# "/" and "/index.html") — every other path/asset keeps being served by
# GitHub Pages with zero Worker involvement (see the pathname check at the
# top of fetch()).
# Zone name must match the zone that already proxies pintag.io in Cloudflare.
[[routes]]
pattern = "pintag.io/listing.html*"
zone_name = "pintag.io"

[[routes]]
pattern = "pintag.io/listings.html*"
zone_name = "pintag.io"

[[routes]]
pattern = "pintag.io/"
zone_name = "pintag.io"

[[routes]]
pattern = "pintag.io/index.html*"
zone_name = "pintag.io"

# Optional overrides — only needed if the Supabase project URL/anon key ever
# rotate without a matching code change. Safe to omit entirely; the script
# falls back to the same public values already committed in config.prod.js.
# Set via: wrangler secret put SUPABASE_URL / SUPABASE_ANON_KEY
# [vars]
# SUPABASE_URL = "https://eoladhcljbpbhnrmmpev.supabase.co"
# SUPABASE_ANON_KEY = "..."
