<title>Pintag Admin · Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Phetsarath -- self-hosted Lao display font (SIL OFL 1.1; copyright
   Ministry of Posts and Telecommunications, Laos; designer Danh Hong --
   see fonts/OFL.txt for the full license text and required notice).
   Inserted into the EXISTING DM Sans / Noto Sans Lao / Noto Sans SC
   stack below, never replacing it: CSS font-family fallback is per-glyph,
   so Latin/Chinese text keeps resolving to DM Sans/Noto Sans SC exactly
   as before -- only Lao codepoints (which DM Sans has no glyphs for) now
   fall through to this font before reaching Noto Sans Lao. */
@font-face{font-family:'Phetsarath';src:url('fonts/phetsarath-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Phetsarath';src:url('fonts/phetsarath-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#2D8C8C;--teal-light:#38A8A8;--teal-dim:rgba(45,140,140,0.08);--teal-border:rgba(45,140,140,0.22);
  --ink:#1A2428;--ink-soft:#3D5058;--ink-muted:#7A9098;
  --warm:#F7F3EC;--warm-deep:#EDE8E0;--white:#fff;
  --border:rgba(26,36,40,0.1);--border-mid:rgba(26,36,40,0.13);
  --red:#C0392B;--green:#1E6B45;--gold:#B8860B;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
}
body{font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;font-size:14px;background:var(--warm);color:var(--ink);line-height:1.6;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
.login-box{width:100%;max-width:360px;padding:48px 40px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-align:center;}
.login-logo{font-size:22px;font-weight:600;color:#fff;margin-bottom:6px;}
.login-sub{font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:32px;}
.login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;margin-bottom:12px;border-radius:3px;}
.login-input::placeholder{color:rgba(255,255,255,0.3);}
.login-btn{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;font-size:14px;font-weight:500;cursor:pointer;border-radius:3px;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;transition:background 0.2s;}
.login-btn:hover{background:var(--teal-light);}
.login-error{color:#e74c3c;font-size:13px;margin-top:8px;display:none;}
#an-screen{display:none;}

.admin-nav{background:var(--ink);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.admin-nav-logo{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;}
.admin-nav-logo span{color:var(--teal-light);}
.admin-nav-crumb{font-size:12px;color:rgba(255,255,255,0.4);}
.admin-nav-right{display:flex;align-items:center;gap:10px;}
.admin-nav-btn{font-size:12px;font-weight:500;padding:7px 14px;border-radius:3px;cursor:pointer;border:none;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;transition:all 0.2s;text-decoration:none;display:inline-block;}
.btn-back{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75);}
.btn-back:hover{background:rgba(255,255,255,0.15);}
.btn-logout{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}
.btn-logout:hover{background:rgba(255,255,255,0.15);}

.an-body{max-width:1180px;margin:0 auto;padding:20px 24px 80px;}

/* ── Live strip: always visible regardless of tab ─────────────────── */
.live-strip{display:flex;align-items:center;gap:18px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-bottom:16px;flex-wrap:wrap;font-size:12.5px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:live-pulse 1.6s ease-in-out infinite;flex-shrink:0;}
@keyframes live-pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.live-label{font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-size:10.5px;color:var(--ink-muted);}
.live-metric{display:flex;align-items:baseline;gap:5px;}
.live-metric b{font-size:15px;color:var(--ink);}
.live-metric span{color:var(--ink-muted);font-size:11px;}
.live-pages{color:var(--ink-muted);font-size:11.5px;}

/* ── Date range bar ────────────────────────────────────────────────── */
.range-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.range-preset{font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--border-mid);background:var(--white);color:var(--ink-soft);cursor:pointer;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;}
.range-preset.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.range-compare{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-left:auto;}
.range-label{font-size:11.5px;color:var(--ink-muted);margin-left:6px;}
.range-custom{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 20px;font-size:12px;color:var(--ink-soft);}
.range-custom.open{display:flex;}
.range-custom input[type=date]{font-size:12px;padding:5px 8px;border:1px solid var(--border-mid);border-radius:6px;background:var(--white);color:var(--ink);font-family:inherit;}
.range-msg{font-size:11.5px;color:var(--red);}
.range-note{font-size:11.5px;color:var(--ink-muted);margin:-12px 0 16px;}
.an-error{background:#fdf1ef;border:1px solid #e8b9b1;color:#7a2a20;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
.an-error .export-btn{margin-left:8px;}
.an-error-note{color:#8a5a54;font-size:11.5px;}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;overflow-x:auto;}
.tab{padding:10px 16px;font-size:12.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-muted);transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;white-space:nowrap;}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);}

.section-block{margin-bottom:32px;}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.section-header h2{font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-muted);}
.export-btn{font-size:11px;font-weight:500;padding:5px 11px;border-radius:4px;border:1px solid var(--border-mid);background:var(--white);color:var(--ink-soft);cursor:pointer;font-family:'DM Sans','Phetsarath','Noto Sans Lao','Noto Sans SC',sans-serif;}
.export-btn:hover{background:var(--warm-deep);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-label{font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:600;color:var(--ink);}
.stat-delta{font-size:11px;font-weight:600;margin-top:4px;}
.stat-delta.up{color:var(--green);}
.stat-delta.down{color:var(--red);}
.stat-delta.flat{color:var(--ink-muted);}

.chart-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.disclosure{font-size:11.5px;color:var(--ink-muted);background:var(--warm-deep);border-radius:6px;padding:8px 12px;margin-top:10px;line-height:1.5;}

.an-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.an-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);padding:6px 10px;border-bottom:1px solid var(--border-mid);}
.an-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
.an-table tr:last-child td{border-bottom:none;}
.an-empty{padding:24px;text-align:center;color:var(--ink-muted);font-size:12.5px;}
.an-table td.nowrap{white-space:nowrap;}
.an-table td.idcell{font-size:11px;line-height:1.5;}
.an-table code{font-size:10.5px;background:var(--warm-deep);padding:1px 4px;border-radius:3px;}
.an-table .muted,.muted{color:var(--ink-muted);}
.an-table .idline{margin-top:3px;font-size:11px;}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.02em;padding:2px 7px;border-radius:10px;margin-top:3px;white-space:nowrap;}
.badge-lead{background:#e3f1ee;color:#1f5d52;}
.badge-legacy{background:#f3ecd6;color:#7a5b12;}
.badge-unattr{background:#eceff1;color:#4a5a63;}
.badge-deleted{background:#f6e0dc;color:#8a2f22;}
.badge-unknown{background:#e9e3f3;color:#5a3d8a;}
.link-btn{background:none;border:none;padding:0;color:var(--teal);font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit;}
.la-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--ink-soft);}
.la-toolbar input[type=date]{font-size:12px;padding:4px 8px;border:1px solid var(--border-mid);border-radius:6px;font-family:inherit;}
.la-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warm-deep);border-radius:12px;padding:3px 10px;font-size:11.5px;}
.la-foot{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--ink-muted);}
.day-table button.day-btn{background:none;border:none;color:var(--teal);cursor:pointer;text-decoration:underline;font-family:inherit;font-size:12.5px;padding:0;}
.top-note{font-size:11.5px;color:var(--ink-muted);margin-top:8px;}

.insp-loading{padding:40px;text-align:center;color:var(--ink-muted);font-size:13px;}

@media (max-width:860px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .chart-row{grid-template-columns:1fr;}
  .an-body{padding:16px 14px 60px;}
}

/* ── Contact Intent funnel (top of the Leads tab) ───────────────────── */
.cif .cif-kpis{margin-bottom:12px;}
.cif .cif-sub{font-size:11px;color:var(--ink-muted);margin-top:3px;line-height:1.4;}
.cif .cif-caveat{font-size:12px;line-height:1.5;border-radius:8px;padding:9px 12px;margin-bottom:10px;border:1px solid var(--border);background:var(--white);color:var(--ink-soft);}
.cif .cif-caveat.cif-warn{background:#fff7e0;border-color:#e6c76a;color:#6b4e00;font-weight:500;}
.cif .cif-blocks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.cif .cif-h3{font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;}
.cif .cif-table td.cif-label{width:42%;}
.cif .cif-note{font-size:11px;color:var(--ink-muted);line-height:1.35;margin-top:2px;}
.cif .cif-count,.cif .cif-rate{white-space:nowrap;font-variant-numeric:tabular-nums;}
.cif .cif-pct{font-weight:600;}
.cif .cif-pct-off{color:var(--ink-muted);font-weight:500;}
.cif .cif-barcell{width:26%;}
.cif .cif-bar{height:8px;background:var(--warm-deep);border-radius:4px;overflow:hidden;}
.cif .cif-bar-fill{height:100%;border-radius:4px;}
.cif .cif-bar-fill.cif-self{background:var(--teal-light);}
.cif .cif-bar-fill.cif-hi{background:var(--green);}
.cif .cif-foot{font-size:11.5px;color:var(--ink-muted);margin-top:10px;line-height:1.5;}
.cif .cif-recon{margin-bottom:14px;font-size:12.5px;}
.cif .cif-diag{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.cif .cif-diag summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-soft);}
.cif .cif-diag-body{display:grid;gap:18px;margin-top:14px;overflow-x:auto;}
.cif .cif-list{margin:0 0 0 18px;font-size:12px;color:var(--ink-soft);}
.cif .cif-deleted{background:var(--warm-deep);color:var(--ink-muted);}
@media(max-width:760px){.cif .cif-blocks{grid-template-columns:1fr;}.cif .stat-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<!-- The administrator login screen is injected by admin-auth.js (the shared,
     single-source-of-truth auth module used by every privileged Pintag page):
     only cyrora.trading@gmail.com, email + password + TOTP 2FA, validated
     server-side on every load. It covers the page until access is confirmed,
     then reveals #an-screen. -->

<div id="an-screen">
  <nav class="admin-nav">
    <p class="admin-nav-logo">Pintag <span>Admin</span> <span class="admin-nav-crumb">/ 📊 Analytics</span></p>
    <div class="admin-nav-right">
      <a href="admin.html" class="admin-nav-btn btn-back">← Admin</a>
      <button class="admin-nav-btn btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="an-body">

    <div class="live-strip" id="live-strip">
      <span class="live-dot"></span>
      <span class="live-label">Live</span>
      <div class="live-metric"><b id="live-visitors">—</b><span>active now</span></div>
      <div class="live-metric"><b id="live-searches">—</b><span>searches (5m)</span></div>
      <div class="live-metric"><b id="live-views">—</b><span>listing views (5m)</span></div>
      <span class="live-pages" id="live-pages"></span>
    </div>

    <div class="range-bar" id="range-bar">
      <button class="range-preset" data-range="today" onclick="setRange('today')">Today</button>
      <button class="range-preset active" data-range="7d" onclick="setRange('7d')">7 days</button>
      <button class="range-preset" data-range="30d" onclick="setRange('30d')">30 days</button>
      <button class="range-preset" data-range="90d" onclick="setRange('90d')">90 days</button>
      <button class="range-preset" data-range="all" onclick="setRange('all')">All time</button>
      <button class="range-preset" data-range="custom" onclick="toggleCustomRange()" aria-expanded="false" aria-controls="range-custom">Custom</button>
      <span class="range-label" id="range-label"></span>
      <label class="range-compare"><input type="checkbox" id="compare-toggle" onchange="onCompareToggle()"> <span id="compare-label">Compare to previous period</span></label>
    </div>
    <div class="range-custom" id="range-custom">
      <label>From <input type="date" id="custom-from" aria-label="Custom range start date"></label>
      <label>To (inclusive) <input type="date" id="custom-to" aria-label="Custom range end date"></label>
      <button type="button" class="export-btn" id="custom-apply" onclick="applyCustomRange()">Apply</button>
      <span class="range-msg" id="custom-msg" role="alert"></span>
    </div>
    <div class="range-note" id="range-note">Days are Laos calendar days (Asia/Vientiane, UTC+7).</div>
    <div id="range-error"></div>

    <div class="tabs" id="an-tabs">
      <button class="tab active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="tab" data-tab="traffic" onclick="switchTab('traffic')">Traffic</button>
      <button class="tab" data-tab="listings" onclick="switchTab('listings')">Listings</button>
      <button class="tab" data-tab="search" onclick="switchTab('search')">Search</button>
      <button class="tab" data-tab="behavior" onclick="switchTab('behavior')">Behavior</button>
      <button class="tab" data-tab="leads" onclick="switchTab('leads')">Leads</button>
      <button class="tab" data-tab="location" onclick="switchTab('location')">Location</button>
      <button class="tab" data-tab="admin" onclick="switchTab('admin')">Admin Insights</button>
    </div>

    <div id="view-overview"></div>
    <div id="view-traffic" style="display:none;"></div>
    <div id="view-listings" style="display:none;"></div>
    <div id="view-search" style="display:none;"></div>
    <div id="view-behavior" style="display:none;"></div>
    <div id="view-leads" style="display:none;"></div>
    <div id="view-location" style="display:none;"></div>
    <div id="view-admin" style="display:none;"></div>

  </div>
</div>

<script src="config.js?v=__ASSET_VERSION__"></script>
<script src="dev-banner.js?v=__ASSET_VERSION__"></script>
<script src="charts.js?v=__ASSET_VERSION__"></script>
<script src="laos-date.js?v=__ASSET_VERSION__"></script>
<script src="analytics-core.js?v=__ASSET_VERSION__"></script>
<script src="contact-intent-funnel.js?v=__ASSET_VERSION__"></script>
<script src="admin-auth.js?v=__ASSET_VERSION__"></script>
<script src="analytics.js?v=__ASSET_VERSION__"></script>
</body>
</html>
