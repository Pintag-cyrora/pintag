name: Apply DB Migration (production)

# Applies EXISTING, already-committed Supabase migrations to the PRODUCTION
# Pintag database — and nothing else. This is intentionally NOT a general
# deployment workflow: it does not deploy functions, website, or workers, it
# never edits/creates/deletes/reorders migration files, and it never runs a
# destructive command.
#
# Manual only: the sole trigger is workflow_dispatch. There is no push or
# schedule trigger, so it can never fire on its own.
#
# Safety model:
#   * PRODUCTION project only. The ref is read from config.prod.js (the same
#     single-source-of-truth deploy-functions.yml uses) and is checked to not
#     be the dev project ref before anything connects.
#   * Requires you to type "APPLY" at dispatch time (guards against a stray click).
#   * Runs `supabase db push --dry-run` FIRST and prints the full plan to the log.
#   * SAFETY GATE (named allowlist): refuses to push unless every pending
#     migration is individually named in EXPECTED_MIGRATIONS below. If the
#     remote is behind on any other migration, it ABORTS without applying, so
#     it can never silently apply unrelated migrations. Unchanged since this
#     workflow's first version — still the check that runs immediately before
#     `db push`.
#   * SAFETY GATE (version boundary — 2026-09-25): EXPECTED_MIGRATION_BOUNDARY
#     names the highest migration version this run may ever apply. The
#     "Build boundary-filtered Supabase work directory" step below copies
#     supabase/config.toml plus ONLY the migration files whose version is <=
#     the boundary into a fresh directory under $RUNNER_TEMP, and every
#     `supabase` command from that point on runs against that directory via
#     `--workdir` — never against this checkout, which is never modified.
#     A migration file committed with a version above the boundary (e.g. a
#     future feature migration merged to main before this security fix is
#     dispatched) is therefore never visible to `supabase db push` at all,
#     regardless of the allowlist — the CLI has no "apply up to version X"
#     flag (checked directly against `supabase db push --help` /
#     `supabase migration up --help`; neither has one), so this workflow
#     enforces the boundary itself by controlling what the CLI can see.
#     Assertions fail the run closed before anything is touched: (1) the
#     boundary must equal the highest entry in EXPECTED_MIGRATIONS, (2) the
#     filtered work directory itself must contain nothing above the
#     boundary. (Fixed 2026-09-25, PR #113 follow-up: an earlier version also
#     required every FILE ON DISK at or below the boundary to be individually
#     named in EXPECTED_MIGRATIONS — wrong, because supabase/migrations/
#     contains 56 migrations from before this workflow's named-allowlist
#     convention existed, already applied to production, never pending, and
#     never needing a name here. That check refused every real dispatch. The
#     correct population is PENDING migrations at or below the boundary, and
#     pending-ness can only be known from the remote — see below.) A third,
#     independent check runs AFTER the push: it re-queries the remote's own
#     migration history (not just the pre-push dry-run plan) and fails if
#     anything above the boundary is now applied.
#   * "Every migration at or below the boundary that is actually PENDING must
#     be individually named in EXPECTED_MIGRATIONS" is enforced in "Dry run +
#     safety gate", against the real dry-run's pending list — which
#     `supabase db push --dry-run` derives from the linked production
#     project's own migration-history table, so an already-applied migration
#     never appears there regardless of whether its file is old or new. That
#     list is also structurally bounded to <= the boundary (the filtered work
#     directory contains nothing above it for the dry-run to even consider),
#     and an explicit assertion re-checks this directly rather than merely
#     assuming it. The named allowlist and the boundary are two independent
#     mechanisms protecting the same property — either one failing to fire is
#     still caught by the other.
#   * Applies with `supabase db push` (additive migration only).
#   * NEVER `db reset`, NEVER `--include-seed`, NEVER any destructive flag.
#   * Verifies afterward with read-only `supabase migration list` + a second
#     dry-run that must report the target migration as no longer pending, AND
#     an independent remote-history check that no migration above the
#     boundary was applied.
#
# One-time setup — two repository secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#   * SUPABASE_ACCESS_TOKEN — already present (used by deploy-functions.yml).
#   * SUPABASE_DB_PASSWORD  — the PRODUCTION database password. `db push` opens
#     a direct Postgres connection that the access token cannot authenticate on
#     its own. Get it from Supabase Dashboard → Project Settings → Database →
#     Database password (reset/copy). If this secret is missing the workflow
#     fails fast at the pre-flight check, before touching anything.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm applying migrations to PRODUCTION'
        required: true
        default: ''

# Only ever one migration run at a time; never cancel one in progress.
concurrency:
  group: apply-db-migration-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The migrations this workflow is authorized to apply — an EXPLICIT, REVIEWED
  # allowlist, one version per line. The safety property is "only what is named
  # here", never "however many are pending", so listing two reviewed migrations
  # is exactly as safe as listing one. Anything pending that is NOT on this list
  # aborts the run before a single statement is applied.
  #
  # Currently authorized: the two migrations from the 2026-08-17 security audit.
  # Both are additive, idempotent and touch NO row of data — they redefine one
  # view's execution mode and a handful of function authorization gates.
  # See docs/SECURITY_AUDIT_2026-08-17.md and docs/SECURITY_VERIFICATION_2026-08-17.md.
  #
  # SEQUENCING — RESOLVED 2026-08-18, and here is the evidence.
  # Run 32142751692 dispatched with APPLY, and the gate REFUSED before applying
  # anything. Its dry-run is the authoritative answer to "is 20260813000000
  # pending?":
  #
  #   Would push these migrations:
  #    • 20260813000000_property_images_registry.sql
  #    • 20260817000000_security_audit_hardening.sql
  #    • 20260817010000_authz_identity_and_abuse_bounds.sql
  #    • 20260818000000_revoke_public_execute.sql
  #   Refusing to push. Pending migration(s) NOT on the authorized list: 20260813000000
  #
  # So 20260813000000 is GENUINELY pending — not applied-but-unrecorded. It is
  # now authorized after review:
  #   * Every write it performs targets ONLY property_images, the table it
  #     creates. No pre-existing table's data is modified (checked statement by
  #     statement: 1 INSERT and 4 UPDATEs, all against property_images).
  #   * The one object it attaches to `properties` is an AFTER trigger that
  #     writes only to property_images and is wrapped in an exception handler,
  #     so a registry failure can never roll back a listing save.
  #   * Its backfill derives registry rows from data already in the database;
  #     it is idempotent (upsert-based) and additive.
  #   * It must go FIRST: 20260817000000 and 20260818000000 both reference
  #     rebuild_images_from_registry / property_images. `supabase db push`
  #     applies in timestamp order, so this ordering is automatic.
  #   * backup.yml and image-integrity.yml have referenced property_images
  #     since 2026-08-13 and have been degraded without it.
  # 20260818020000_daily_rate_and_unit_lease_pricing.sql — reviewed and
  # authorized deliberately (this file's gate refuses anything not listed here).
  # Why it is safe to apply:
  #   * Purely additive: five ADD COLUMN IF NOT EXISTS on unit_types, one on
  #     properties, plus one CHECK constraint. No column is dropped, no
  #     column's type changes, no data is rewritten, and there is no backfill.
  #   * Every new column is nullable with no default, so every existing row is
  #     untouched and every existing reader keeps working.
  #   * The one constraint (unit_types_lease_price_basis_check) is added to a
  #     column that has no pre-existing values, so it cannot fail validation.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path always sends them (as nulls when
  #     unset), and PostgREST rejects an unknown column with PGRST204, which
  #     would break saving ANY listing. See this commit's notes.
  # 20260820000000_multi_phone_contacts.sql — reviewed and authorized
  # deliberately. UNLIKE 20260818020000 above, this one DOES write rows and DOES
  # change a policy, so it gets its own review rather than that one's reasoning:
  #   * Schema is additive: one nullable column (contacts.languages text[]), one
  #     NEW table (property_contacts), two indexes and one partial unique index.
  #     No column is dropped, no column's type changes, nothing is renamed.
  #   * It DOES backfill, and the writes are confined to the NEW table: one
  #     INSERT ... SELECT that gives every listing with a contact_id a link row
  #     (ON CONFLICT DO NOTHING, so re-running is a no-op), and one UPDATE that
  #     promotes a primary only for a property that has none. Checked statement
  #     by statement: NO pre-existing row in properties, contacts, leads or
  #     lead_events is read-modified-written. properties.contact_id is not
  #     touched, so leads.contact_id / lead_events.contact_id keep resolving.
  #   * It WIDENS one RLS policy: "Public read contacts of active properties"
  #     gains a second arm so a listing's ADDITIONAL numbers are readable by
  #     anon. The original contact_id arm is kept verbatim, and exposure does
  #     not broaden — a contact is still reachable only through a listing that
  #     is already status IN ('active','available'). Without this arm the
  #     feature is invisible in production rather than merely degraded.
  #   * Validated against a throwaway PostgreSQL 16 cluster seeded with the real
  #     production shape (ONE shared contacts row across THREE listings, plus a
  #     draft listing and a contactless listing): applies cleanly, is idempotent
  #     across two consecutive runs, backfills exactly one link per listing that
  #     had a contact, leaves the contactless listing alone, exposes a second
  #     number to anon, and still HIDES a number reachable only from a draft
  #     listing. Reverting to the old policy made the second number vanish,
  #     confirming the widening is load-bearing rather than cosmetic.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path sends contacts.languages and writes
  #     property_contacts (including is_primary), and PostgREST rejects an
  #     unknown column with PGRST204, which would break saving ANY listing.
  # 20260822000000_province_coverage.sql — reviewed and authorized deliberately.
  # It expands listings from Vientiane-only to all 17 Laos provinces plus
  # Vientiane Capital. Reviewed on its own terms because, unlike 20260820000000
  # above, this one DOES write to a pre-existing table:
  #   * Schema is additive: three nullable columns on properties (province_en,
  #     province_lo, province_zh), one CHECK, one index. No column is dropped,
  #     no type changes, nothing is renamed. properties had NO province concept
  #     before this, so nothing is being reinterpreted.
  #   * It UPDATEs properties — the core listings table. Read statement by
  #     statement, that UPDATE writes ONLY the three NEW columns, and only
  #     `WHERE province_en IS NULL`, so it can neither overwrite a value that
  #     already existed nor change any pre-existing column. Re-running is a
  #     no-op. No other table is written at all.
  #   * The backfill is a statement of fact, not a guess: it fires only for the
  #     7 Vientiane Capital districts (Sisattanak, Saysettha, Chanthabouly,
  #     Sikhottabong, Xaythany, Hadxaifong, Naxaithong), which are every value
  #     admin's DISTRICT_MAP has ever offered. A row with an unrecognised
  #     district is deliberately LEFT NULL — an unknown location must not
  #     become a wrong one.
  #   * The CHECK names exactly the 18 keys in provinces.js LAO_PROVINCES; a
  #     test asserts the two lists are identical, so a typo or a duplicated
  #     province cannot enter through any client. It is added AFTER the
  #     backfill, when every province_en is either NULL or 'Vientiane Capital',
  #     so validation of existing rows cannot fail.
  #   * Vientiane Capital and Vientiane Province are separate keys. Conflating
  #     them is the classic Laos data error and the CHECK makes it impossible.
  #   * NOT YET VERIFIED AGAINST A THROWAWAY CLUSTER, unlike 20260820000000 —
  #     the reviewer should treat the dry-run output as the first execution
  #     evidence. The gate prints the full plan before applying.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path sends province_en/_lo/_zh, and
  #     PostgREST rejects an unknown column with PGRST204, which would break
  #     saving ANY listing.
  # 20260901000000_protect_pending_contact_sentinel.sql — reviewed and
  # authorized deliberately. Why it is safe:
  #   * Adds one BEFORE UPDATE trigger on contacts (plain plpgsql, not
  #     SECURITY DEFINER) that rejects any UPDATE targeting the shared
  #     PENDING sentinel contact row. It does not touch INSERT or DELETE, so
  #     the seed (ON CONFLICT DO NOTHING) and admin.html's self-heal keep
  #     working unchanged. No table, column, view, policy, or grant is
  #     created or altered.
  #   * No production data is written by this migration — it only ever
  #     REJECTS a future UPDATE statement; it performs none itself.
  #   * Validated against a scratch database:
  #     tests/db/pending-contact-sentinel.test.sql (7 assertions — sentinel
  #     insertable, repeated seed is a no-op, a direct UPDATE of the
  #     sentinel is rejected, a single-column UPDATE is rejected, the
  #     sentinel's content is unchanged after the rejected writes, an
  #     ORDINARY contact stays fully editable, and a bulk UPDATE that would
  #     have swept the sentinel in is rejected as a whole statement).
  #   * This is a defense-in-depth backstop underneath an already-shipped
  #     application-level fix in admin.html's saveListing() — applying it
  #     closes the DB-layer gap the 2026-09-01 data-integrity audit found.
  # 20260905000000_intelligence_customer_intent.sql — reviewed and
  # authorized deliberately. Why it is safe:
  #   * CREATE OR REPLACE on two EXISTING, already anon-reachable functions —
  #     point_in_time_supply_snapshot() (adds an active_inventory.by_segment
  #     breakdown) and intelligence_daily_metrics() (adds
  #     customer_intent_segments and journey_join to its output). No new
  #     table or column; no RLS policy or grant is touched. CREATE OR
  #     REPLACE FUNCTION does not reset a function's existing privileges, so
  #     this migration cannot change who can call either function — only
  #     what they compute when called.
  #   * Both functions are LANGUAGE sql STABLE — pure read/aggregation
  #     queries. Zero INSERT/UPDATE/DELETE anywhere in the file.
  #   * MUST be applied for the already-deployed generate-intelligence-report
  #     edge function to work correctly — demand-supply-detector.js and
  #     listing-performance-detector.js already read customer_intent_segments
  #     / journey_join off daily_metrics_snapshot.metrics (shipped in
  #     "feat: add customer intent intelligence v2"), so until this is
  #     applied that already-live code is reading fields production does not
  #     yet compute.
  #   * MUST be applied BEFORE 20260912000000 below — see that entry.
  # 20260912000000_intelligence_bedroom_intent.sql — reviewed and authorized
  # deliberately. Why it is safe:
  #   * CREATE OR REPLACE on the SAME intelligence_daily_metrics() function
  #     again, adding top_bedroom_count / bedroom_sample_size per customer-
  #     intent segment. Reads search_events.bedrooms, a column that already
  #     exists (added by 20260715010000_behavioral_events.sql, long before
  #     this migration) and is already populated by listings.html's Bedroom
  #     Count filter. No new table/column/policy/grant; same LANGUAGE sql
  #     STABLE, zero-write shape as 20260905000000.
  #   * TIMESTAMP ORDER MUST BE PRESERVED: this file's body is the complete,
  #     self-contained function definition (a superset of 20260905000000's),
  #     but it is described as extending "customer_intent_segments (added by
  #     20260905000000)" and both are pending together in this same batch.
  #     `supabase db push` applies migrations in timestamp order, so
  #     20260905000000 MUST be applied first (901 → 905 → 912) — do not
  #     reorder EXPECTED_MIGRATIONS or apply these out of sequence.
  #   * Same "already-deployed code depends on this" situation as
  #     20260905000000 — the same edge function already reads
  #     top_bedroom_count/bedroom_sample_size (shipped in "feat: add bedroom
  #     intent to intelligence report").
  # 20260915000000_revoke_anon_execute_ops_alert_and_image_sync.sql — reviewed
  # and authorized deliberately (PR #92). Privileges only, no schema/data change:
  #   * Revokes the implicit default-to-PUBLIC EXECUTE grant (same root cause
  #     20260818000000 fixed for five other functions) from two functions
  #     confirmed reachable by anon in production: _ops_raise_alert() and
  #     pintag_sync_property_images(). Grants authenticated back explicitly, so
  #     that role's access is unchanged. No function body, RLS policy, or any
  #     other function's grants are touched.
  #   * Neither function has an internal identity check by design — both are
  #     meant to be called only from inside their own SECURITY DEFINER trigger
  #     functions, never directly by a client. A repository-wide search of
  #     every .rpc() call site found zero legitimate direct callers.
  #   * REVOKE/GRANT are idempotent by construction (a privilege that is
  #     already absent/held stays that way), and each statement is wrapped in
  #     DO ... EXCEPTION WHEN undefined_function, so a database missing either
  #     function (e.g. dev) is skipped rather than aborting.
  #   * Validated against a throwaway PostgreSQL 16 cluster seeded with both
  #     functions' real pre-fix bodies plus all three real trigger functions
  #     that call them (tests/security/regression/run-ops-alert-and-image-
  #     sync-pg.sh): anon denied direct EXECUTE on both (17 assertions, all
  #     pass), authenticated confirmed preserved, and — the point of the
  #     validation — all three trigger chains (mass-delete guard, mass-
  #     soft-delete alert, image-registry sync) still fire correctly under a
  #     non-owner role afterward, because a SECURITY DEFINER function's
  #     internal calls run as its OWNER, unaffected by a revoke naming a
  #     different role. Migration applies cleanly twice (idempotency).
  # 20260918000000_intelligence_vientiane_calendar.sql — reviewed and
  # authorized deliberately (PR #96). Calendar-interpretation only, no
  # schema/data change:
  #   * CREATE OR REPLACE on intelligence_daily_metrics()/
  #     ensure_daily_metrics_snapshot() only. Every calendar-day-bucketing
  #     cast (created_at/updated_at/removed_at/status_changed_at::date,
  #     CURRENT_DATE) is replaced with the explicit
  #     `(<col> AT TIME ZONE 'Asia/Vientiane')::date` idiom. Pure
  #     instant/duration expressions (EXTRACT(day FROM a - b), instant
  #     ordering, generate_series over already-`date` params) are untouched.
  #   * Does not change the database's own TimeZone GUC, any table schema,
  #     any RLS policy, or any function's privileges — only how these two
  #     functions interpret existing timestamptz columns for reporting.
  #   * Does not modify, delete, or backfill existing daily_metrics_snapshot
  #     rows (still INSERT ... ON CONFLICT DO NOTHING, unchanged).
  #   * Validated against a throwaway PostgreSQL 16 cluster (tests/security/
  #     regression/run-intelligence-vientiane-calendar-pg.sh): 20 assertions
  #     covering the exact UTC/Vientiane boundary, a month boundary, a
  #     leap-year boundary, and the finalization cutoff, all pass; migration
  #     applies cleanly twice (idempotent).
  # 20260920000000_intelligence_demand_supply_gap.sql — reviewed and
  # authorized deliberately (2026-09-24/25 production DB migration audit).
  # Why it is safe:
  #   * CREATE OR REPLACE on the EXISTING point_in_time_supply_snapshot()
  #     only, adding two new keys (available_by_segment,
  #     available_by_bedroom_segment) inside its existing active_inventory
  #     object. Every existing key is untouched byte-for-byte. No table,
  #     column, policy, or grant is created or altered.
  #   * LANGUAGE sql STABLE — a pure read/aggregation query. Zero
  #     INSERT/UPDATE/DELETE anywhere in the file.
  #   * Already-deployed edge-function code (demand-supply-gap.js,
  #     report-composer.js) reads these two keys, but is defensively coded
  #     and tested for their total absence (report-composer.test.js:
  #     "demandSupplyBlock never fabricates a gap when active_inventory/
  #     available_by_segment is entirely absent") — so leaving it unapplied
  #     degrades a report section gracefully rather than erroring. Not urgent
  #     on its own; authorized here because it must apply before
  #     20260921000000/20260921010000/20260922000000 in timestamp order
  #     regardless.
  # 20260921000000_lead_unit_attribution.sql — reviewed and authorized
  # deliberately, and URGENTLY: this migration fixes a live production
  # incident, not merely a pending feature.
  #   * Adds nullable unit_type_id (FK to unit_types, ON DELETE SET NULL) and
  #     unit_id (uuid, no FK yet) columns to lead_events and leads, plus two
  #     indexes, plus a CREATE OR REPLACE of the create_lead_from_event()
  #     trigger function to copy both columns through. Purely additive DDL —
  #     no DROP, no data-rewriting UPDATE/DELETE, no backfill, no type change.
  #   * PRODUCTION CODE ALREADY DEPENDS ON THIS, RIGHT NOW: commit b0a3572
  #     (merged via PR #104, deployed by Deploy Production run #294 on
  #     2026-09-21T06:19:51Z, and live in every deploy since) has
  #     components.js's ptContactClick() sending unit_type_id/unit_id in
  #     every lead_events POST. PostgREST rejects an INSERT body naming a
  #     column that doesn't exist yet with PGRST204, failing the ENTIRE
  #     insert — and the call site's fire-and-forget `.catch(function(){})`
  #     only swallows network-level failures, not HTTP error responses, so
  #     this has been failing completely silently. Confirmed during the
  #     2026-09-24/25 audit: since this migration has never been applied
  #     (last apply-migration.yml run was #12 on 2026-09-17, before this
  #     migration existed), every WhatsApp/Call contact click in production
  #     has almost certainly failed to create a lead_events row since
  #     2026-09-21 — meaning create_lead_from_event() never fires and no new
  #     leads CRM rows have been created either. ui_events tracking (a
  #     separate POST) is unaffected. Applying this migration is the fix.
  # 20260921010000_revoke_public_execute_analytics_and_ownership_rpcs.sql —
  # reviewed and authorized deliberately (2026-09-24 read-only production DB
  # investigation, following up on the 2026-09-21 Verify Production Security
  # finding). Privileges only, no schema/data change:
  #   * Revokes the implicit default-to-PUBLIC EXECUTE grant (same root cause
  #     20260818000000 and 20260915000000 fixed for six other functions) from
  #     owned_party_ids(uuid), intelligence_daily_metrics(date,date),
  #     point_in_time_supply_snapshot(), ensure_daily_metrics_snapshot(date,date)
  #     — the four functions from the "no UNEXPECTED ungated SECURITY DEFINER
  #     function is callable by anon" control that DO have a repository
  #     source. owned_party_ids keeps its existing, unmodified GRANT to
  #     authenticated (20260705000000); the three intelligence functions get
  #     no anon/authenticated grant at all, since their only real caller
  #     (generate-intelligence-report) already authenticates with the
  #     service-role key, which bypasses grants entirely.
  #   * A repository-wide audit of every `.rpc(...)` call site in every client
  #     HTML/JS file and every edge function (recorded in the migration file
  #     itself, and independently reconstructed during the 2026-09-24
  #     investigation by grepping every call site and every CREATE/GRANT/
  #     REVOKE statement across `supabase/migrations/*.sql` history) found no
  #     direct client caller for any of the four: owned_party_ids is called
  #     only as owned_party_ids(auth.uid()) inside ~20 RLS policy bodies, and
  #     the three intelligence functions are called only by the service-role
  #     edge function.
  #   * REVOKE/GRANT are idempotent by construction, and each statement is
  #     wrapped in DO ... EXCEPTION WHEN undefined_function, so a database
  #     missing one of these (e.g. dev) is skipped rather than aborting.
  #   * Deliberately NOT part of this authorization: is_admin and
  #     rls_auto_enable, also flagged by the same control but with no
  #     CREATE FUNCTION statement anywhere in this repository's migration
  #     history (confirmed again during the 2026-09-24 investigation) — their
  #     production definition and real caller(s) are unknown from static
  #     inspection, so they are left for a human to inspect
  #     (pg_get_functiondef) directly against production before any decision.
  #     Deliberately NOT part of this authorization: 20260922000000
  #     (intelligence_unit_type_demand) — a separate feature migration, and
  #     structurally blocked anyway (its CREATE OR REPLACE FUNCTION
  #     intelligence_daily_metrics() body references lead_events.unit_type_id/
  #     leads.unit_type_id directly, so it cannot even be created until
  #     20260921000000 has applied). EXPECTED_MIGRATION_BOUNDARY below is set
  #     to 20260921010000 specifically so this workflow can never reach
  #     20260922000000, independent of whether it is ever added here by
  #     mistake — see the boundary mechanism described above.
  EXPECTED_MIGRATIONS: |
    20260813000000
    20260817000000
    20260817010000
    20260818000000
    20260818010000
    20260818020000
    20260820000000
    20260822000000
    20260823000000
    20260901000000
    20260905000000
    20260912000000
    20260915000000
    20260918000000
    20260920000000
    20260921000000
    20260921010000
  EXPECTED_MIGRATION_FILE: '20260813000000_property_images_registry.sql + the 2026-08-17/18 security migrations + 20260818010000_restore_views_week_column.sql + 20260818020000_daily_rate_and_unit_lease_pricing.sql + 20260820000000_multi_phone_contacts.sql + 20260822000000_province_coverage.sql + 20260823000000_contact_primary_invariant.sql + 20260901000000_protect_pending_contact_sentinel.sql + 20260905000000_intelligence_customer_intent.sql (must precede 20260912000000) + 20260912000000_intelligence_bedroom_intent.sql + 20260915000000_revoke_anon_execute_ops_alert_and_image_sync.sql + 20260918000000_intelligence_vientiane_calendar.sql + 20260920000000_intelligence_demand_supply_gap.sql + 20260921000000_lead_unit_attribution.sql (fixes a live production incident — see review note above) + 20260921010000_revoke_public_execute_analytics_and_ownership_rpcs.sql'
  # The highest migration version this run may ever apply. Must equal the
  # highest entry in EXPECTED_MIGRATIONS above — asserted by the "Build
  # boundary-filtered Supabase work directory" step, which fails closed if
  # they disagree. See the boundary mechanism described in this file's header.
  EXPECTED_MIGRATION_BOUNDARY: '20260921010000'
  # Tripwire: the dev project ref must never be the target.
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require explicit APPLY confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::Confirmation not given. Re-run the workflow and type APPLY in the confirm box."
            exit 1
          fi
          echo "Confirmation received."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (production database password — db push needs a direct Postgres connection). Add it under Settings → Secrets and variables → Actions. See this file's header."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "Required secrets present."

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve the production project ref from config.prod.js (expected a https://<ref>.supabase.co URL)."
            exit 1
          fi
          if [ "$REF" = "${DEV_REF}" ]; then
            echo "::error::Resolved ref ($REF) is the DEV project. Refusing to run against dev."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target project::Applying migrations to PRODUCTION project ref: $REF"
          {
            echo "## Apply DB migration — target"
            echo ""
            echo "- Project ref: \`$REF\` (production)"
            echo "- Authorized migration: \`${EXPECTED_MIGRATION_FILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      - name: Build boundary-filtered Supabase work directory
        id: workdir
        run: |
          set -euo pipefail

          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"

          # Invariant 1 — the boundary must equal the highest authorized
          # version. Fail closed if they have drifted apart.
          HIGHEST_AUTHORIZED="$(echo "$AUTHORIZED" | tail -1)"
          if [ "$HIGHEST_AUTHORIZED" != "$EXPECTED_MIGRATION_BOUNDARY" ]; then
            echo "::error::EXPECTED_MIGRATION_BOUNDARY ($EXPECTED_MIGRATION_BOUNDARY) does not match the highest entry in EXPECTED_MIGRATIONS ($HIGHEST_AUTHORIZED). Fix one or the other before dispatching — refusing to build a work directory."
            exit 1
          fi

          WORKDIR="$RUNNER_TEMP/supabase-boundary-workdir"
          mkdir -p "$WORKDIR/supabase/migrations"
          cp supabase/config.toml "$WORKDIR/supabase/config.toml"

          # Copy only migration files at or below the boundary. The original
          # checkout (supabase/migrations/ in $GITHUB_WORKSPACE) is never
          # written to — every command from here on runs against $WORKDIR via
          # --workdir instead.
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | grep -oE '^[0-9]{14}')"
            [ -n "$v" ] || continue
            if [[ "$v" > "$EXPECTED_MIGRATION_BOUNDARY" ]]; then
              echo "Excluding $(basename "$f") — version $v is above the boundary ($EXPECTED_MIGRATION_BOUNDARY)"
              continue
            fi
            cp "$f" "$WORKDIR/supabase/migrations/"
          done

          # NOTE — deliberately NOT checked here: "every migration file at or
          # below the boundary must be individually named in
          # EXPECTED_MIGRATIONS." An earlier version of this step enforced
          # exactly that and it was wrong — supabase/migrations/ contains 56
          # migrations (20260622000000 through 20260812000000) that were
          # applied to production long before this workflow's named-allowlist
          # convention existed. They are not pending, so they were never
          # named here and never needed to be — but a static scan of every
          # FILE ON DISK at or below the boundary cannot tell "already
          # applied, harmless" apart from "pending, unreviewed", and refused
          # every real dispatch (run #13, 2026-09-25) even though nothing
          # unauthorized was actually about to be pushed. The invariant this
          # workflow actually needs — every PENDING migration at or below the
          # boundary must be individually named — can only be checked once
          # the remote's migration history is known, which requires a DB
          # connection this step does not have. That check runs in "Dry run
          # + safety gate" below, against the real dry-run's pending list
          # (which is already boundary-bounded, since the work directory
          # built here contains nothing above the boundary to report as
          # pending in the first place) — see that step for where the actual
          # per-migration authorization is enforced.

          # Invariant 2, verified directly against what was actually copied —
          # not merely inferred from the filter above.
          ABOVE_BOUNDARY="$(for f in "$WORKDIR"/supabase/migrations/*.sql; do basename "$f" | grep -oE '^[0-9]{14}'; done | awk -v b="$EXPECTED_MIGRATION_BOUNDARY" '$1>b')"
          if [ -n "$ABOVE_BOUNDARY" ]; then
            echo "::error::Internal error — a migration above the boundary ($EXPECTED_MIGRATION_BOUNDARY) ended up in the filtered work directory: $ABOVE_BOUNDARY"
            exit 1
          fi

          COUNT="$(ls "$WORKDIR"/supabase/migrations/*.sql | wc -l)"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "::notice::Boundary-filtered work directory built at $WORKDIR — $COUNT migration file(s) at or below $EXPECTED_MIGRATION_BOUNDARY. Original checkout is unmodified."
          {
            echo ""
            echo "### Migration boundary"
            echo ""
            echo "- Boundary: \`$EXPECTED_MIGRATION_BOUNDARY\`"
            echo "- Migration files visible to this run: $COUNT (everything above the boundary is excluded from the work directory entirely)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Linking to production ref ${{ steps.ref.outputs.ref }} (boundary-filtered work directory) …"
          supabase link --workdir "${{ steps.workdir.outputs.workdir }}" --project-ref "${{ steps.ref.outputs.ref }}"

      - name: Migration history (before) — read only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (before)"
          supabase migration list --workdir "${{ steps.workdir.outputs.workdir }}"
          echo "::endgroup::"

      - name: Dry run + safety gate
        id: plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase db push --dry-run (boundary-filtered work directory)"
          supabase db push --workdir "${{ steps.workdir.outputs.workdir }}" --dry-run 2>&1 | tee dryrun.txt
          echo "::endgroup::"

          {
            echo ""
            echo "### Dry-run plan"
            echo ""
            echo '```'
            cat dryrun.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Migration versions the dry-run reports as pending (14-digit prefixes).
          # This is the ACTUAL remote-derived pending set — supabase db push
          # --dry-run queries the linked production project's own migration
          # history table and reports only what is not yet recorded there, so
          # an already-applied historical migration (e.g. anything from the
          # 20260622000000-20260812000000 range, applied long before this
          # workflow existed) never appears here even though its file is
          # present in the boundary-filtered work directory. Also bounded to
          # <= EXPECTED_MIGRATION_BOUNDARY by construction, since that work
          # directory contains nothing above the boundary for db push to even
          # consider.
          PENDING="$(grep -oE '[0-9]{14}' dryrun.txt | sort -u || true)"
          echo "Pending versions detected: ${PENDING:-<none>}"

          # Explicit self-check of the boundary invariant, stated in terms of
          # what is actually pending (the correct population) rather than
          # merely inferred from how the work directory was built. Should be
          # unreachable — the work directory cannot contain a file above the
          # boundary, so the dry-run cannot report one as pending — but this
          # makes that guarantee an assertion instead of an assumption.
          PENDING_ABOVE_BOUNDARY="$(echo "$PENDING" | awk -v b="$EXPECTED_MIGRATION_BOUNDARY" '$1>b')"
          if [ -n "$PENDING_ABOVE_BOUNDARY" ]; then
            echo "::error::Internal error — a migration above the boundary ($EXPECTED_MIGRATION_BOUNDARY) is reported pending: $(echo $PENDING_ABOVE_BOUNDARY | tr '\n' ' '). This should be structurally impossible — investigate immediately."
            exit 1
          fi

          if [ -z "$PENDING" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending migrations — production is already up to date. Nothing to apply."
            exit 0
          fi

          # Refuse if ANYTHING outside the authorized allowlist is pending.
          # THIS is where "every migration at or below the boundary must be
          # individually named in EXPECTED_MIGRATIONS" is actually enforced —
          # correctly scoped to PENDING migrations only (see the note in
          # "Build boundary-filtered Supabase work directory" for why a
          # static, all-repository-files version of this check was wrong and
          # has been removed). Unchanged in its own logic from this
          # workflow's original gate — kept as an independent check alongside
          # the boundary, not replaced by it.
          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          echo "Authorized versions: $(echo $AUTHORIZED | tr '\n' ' ')"
          UNEXPECTED="$(comm -23 <(echo "$PENDING" | sort -u) <(echo "$AUTHORIZED"))"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Refusing to push. Pending migration(s) NOT on the authorized list: $(echo $UNEXPECTED | tr '\n' ' '). This workflow only applies ${EXPECTED_MIGRATION_FILE}. Investigate the divergence — and if the extra migration is legitimate, review it and add its version to EXPECTED_MIGRATIONS deliberately."
            exit 1
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"
          echo "Safety gate passed: every pending migration is on the authorized list."

      - name: Apply migration (supabase db push)
        if: steps.plan.outputs.already_applied == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Applying to PRODUCTION ref ${{ steps.ref.outputs.ref }} (boundary-filtered work directory) …"
          echo "::group::supabase db push"
          supabase db push --workdir "${{ steps.workdir.outputs.workdir }}"
          echo "::endgroup::"
          echo "- ✅ applied \`${EXPECTED_MIGRATION_FILE}\` to production (\`${{ steps.ref.outputs.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (read-only) — target migration no longer pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (after)"
          supabase migration list --workdir "${{ steps.workdir.outputs.workdir }}"
          echo "::endgroup::"

          echo "::group::supabase db push --dry-run (post-apply check, boundary-filtered work directory)"
          supabase db push --workdir "${{ steps.workdir.outputs.workdir }}" --dry-run 2>&1 | tee dryrun_after.txt
          echo "::endgroup::"

          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          STILL_PENDING="$(grep -oE '[0-9]{14}' dryrun_after.txt | sort -u | comm -12 - <(echo "$AUTHORIZED") || true)"
          if [ -n "$STILL_PENDING" ]; then
            echo "::error::Verification failed — $(echo $STILL_PENDING | tr '\n' ' ') still reported as pending after push."
            exit 1
          fi
          echo "Verified: every authorized migration is applied (no longer pending on production)."
          echo "- ✅ verified applied on production" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify migration boundary was not exceeded (independent remote check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Independent of the dry-run-based checks above: re-query the
          # remote's OWN migration history directly and fail if anything
          # above the boundary is recorded as applied. This is the last line
          # of defense — it does not trust what this run intended to do, only
          # what the remote now actually reports.
          echo "::group::supabase migration list (remote history, boundary check)"
          supabase migration list --workdir "${{ steps.workdir.outputs.workdir }}" 2>&1 | tee migration_list_boundary_check.txt
          echo "::endgroup::"

          ABOVE_BOUNDARY="$(grep -oE '[0-9]{14}' migration_list_boundary_check.txt | sort -u | awk -v b="$EXPECTED_MIGRATION_BOUNDARY" '$1>b')"
          if [ -n "$ABOVE_BOUNDARY" ]; then
            echo "::error::Migration(s) above the approved boundary ($EXPECTED_MIGRATION_BOUNDARY) are visible in the remote migration history: $(echo $ABOVE_BOUNDARY | tr '\n' ' '). This should be structurally impossible — investigate immediately."
            exit 1
          fi
          echo "Verified: no migration above the boundary ($EXPECTED_MIGRATION_BOUNDARY) is present in the remote's migration history."
          echo "- ✅ boundary check passed — nothing above \`$EXPECTED_MIGRATION_BOUNDARY\` applied" >> "$GITHUB_STEP_SUMMARY"
