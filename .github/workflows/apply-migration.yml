name: Apply DB Migration (production)

# Applies EXISTING, already-committed Supabase migrations to the PRODUCTION
# Pintag database — and nothing else. This is intentionally NOT a general
# deployment workflow: it does not deploy functions, website, or workers, it
# never edits/creates/deletes/reorders migration files, and it never runs a
# destructive command.
#
# Manual only: the sole trigger is workflow_dispatch. There is no push or
# schedule trigger, so it can never fire on its own.
#
# Safety model:
#   * PRODUCTION project only. The ref is read from config.prod.js (the same
#     single-source-of-truth deploy-functions.yml uses) and is checked to not
#     be the dev project ref before anything connects.
#   * Requires you to type "APPLY" at dispatch time (guards against a stray click).
#   * Runs `supabase db push --dry-run` FIRST and prints the full plan to the log.
#   * SAFETY GATE: refuses to push unless the ONLY pending migration is the one
#     this workflow is authorized to apply (EXPECTED_MIGRATIONS below). If the
#     remote is behind on any other migration, it ABORTS without applying, so
#     it can never silently apply unrelated migrations.
#   * Applies with `supabase db push` (additive migration only).
#   * NEVER `db reset`, NEVER `--include-seed`, NEVER any destructive flag.
#   * Verifies afterward with read-only `supabase migration list` + a second
#     dry-run that must report the target migration as no longer pending.
#
# One-time setup — two repository secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#   * SUPABASE_ACCESS_TOKEN — already present (used by deploy-functions.yml).
#   * SUPABASE_DB_PASSWORD  — the PRODUCTION database password. `db push` opens
#     a direct Postgres connection that the access token cannot authenticate on
#     its own. Get it from Supabase Dashboard → Project Settings → Database →
#     Database password (reset/copy). If this secret is missing the workflow
#     fails fast at the pre-flight check, before touching anything.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm applying migrations to PRODUCTION'
        required: true
        default: ''

# Only ever one migration run at a time; never cancel one in progress.
concurrency:
  group: apply-db-migration-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The migrations this workflow is authorized to apply — an EXPLICIT, REVIEWED
  # allowlist, one version per line. The safety property is "only what is named
  # here", never "however many are pending", so listing two reviewed migrations
  # is exactly as safe as listing one. Anything pending that is NOT on this list
  # aborts the run before a single statement is applied.
  #
  # Currently authorized: the two migrations from the 2026-08-17 security audit.
  # Both are additive, idempotent and touch NO row of data — they redefine one
  # view's execution mode and a handful of function authorization gates.
  # See docs/SECURITY_AUDIT_2026-08-17.md and docs/SECURITY_VERIFICATION_2026-08-17.md.
  #
  # SEQUENCING — RESOLVED 2026-08-18, and here is the evidence.
  # Run 32142751692 dispatched with APPLY, and the gate REFUSED before applying
  # anything. Its dry-run is the authoritative answer to "is 20260813000000
  # pending?":
  #
  #   Would push these migrations:
  #    • 20260813000000_property_images_registry.sql
  #    • 20260817000000_security_audit_hardening.sql
  #    • 20260817010000_authz_identity_and_abuse_bounds.sql
  #    • 20260818000000_revoke_public_execute.sql
  #   Refusing to push. Pending migration(s) NOT on the authorized list: 20260813000000
  #
  # So 20260813000000 is GENUINELY pending — not applied-but-unrecorded. It is
  # now authorized after review:
  #   * Every write it performs targets ONLY property_images, the table it
  #     creates. No pre-existing table's data is modified (checked statement by
  #     statement: 1 INSERT and 4 UPDATEs, all against property_images).
  #   * The one object it attaches to `properties` is an AFTER trigger that
  #     writes only to property_images and is wrapped in an exception handler,
  #     so a registry failure can never roll back a listing save.
  #   * Its backfill derives registry rows from data already in the database;
  #     it is idempotent (upsert-based) and additive.
  #   * It must go FIRST: 20260817000000 and 20260818000000 both reference
  #     rebuild_images_from_registry / property_images. `supabase db push`
  #     applies in timestamp order, so this ordering is automatic.
  #   * backup.yml and image-integrity.yml have referenced property_images
  #     since 2026-08-13 and have been degraded without it.
  # 20260818020000_daily_rate_and_unit_lease_pricing.sql — reviewed and
  # authorized deliberately (this file's gate refuses anything not listed here).
  # Why it is safe to apply:
  #   * Purely additive: five ADD COLUMN IF NOT EXISTS on unit_types, one on
  #     properties, plus one CHECK constraint. No column is dropped, no
  #     column's type changes, no data is rewritten, and there is no backfill.
  #   * Every new column is nullable with no default, so every existing row is
  #     untouched and every existing reader keeps working.
  #   * The one constraint (unit_types_lease_price_basis_check) is added to a
  #     column that has no pre-existing values, so it cannot fail validation.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path always sends them (as nulls when
  #     unset), and PostgREST rejects an unknown column with PGRST204, which
  #     would break saving ANY listing. See this commit's notes.
  # 20260820000000_multi_phone_contacts.sql — reviewed and authorized
  # deliberately. UNLIKE 20260818020000 above, this one DOES write rows and DOES
  # change a policy, so it gets its own review rather than that one's reasoning:
  #   * Schema is additive: one nullable column (contacts.languages text[]), one
  #     NEW table (property_contacts), two indexes and one partial unique index.
  #     No column is dropped, no column's type changes, nothing is renamed.
  #   * It DOES backfill, and the writes are confined to the NEW table: one
  #     INSERT ... SELECT that gives every listing with a contact_id a link row
  #     (ON CONFLICT DO NOTHING, so re-running is a no-op), and one UPDATE that
  #     promotes a primary only for a property that has none. Checked statement
  #     by statement: NO pre-existing row in properties, contacts, leads or
  #     lead_events is read-modified-written. properties.contact_id is not
  #     touched, so leads.contact_id / lead_events.contact_id keep resolving.
  #   * It WIDENS one RLS policy: "Public read contacts of active properties"
  #     gains a second arm so a listing's ADDITIONAL numbers are readable by
  #     anon. The original contact_id arm is kept verbatim, and exposure does
  #     not broaden — a contact is still reachable only through a listing that
  #     is already status IN ('active','available'). Without this arm the
  #     feature is invisible in production rather than merely degraded.
  #   * Validated against a throwaway PostgreSQL 16 cluster seeded with the real
  #     production shape (ONE shared contacts row across THREE listings, plus a
  #     draft listing and a contactless listing): applies cleanly, is idempotent
  #     across two consecutive runs, backfills exactly one link per listing that
  #     had a contact, leaves the contactless listing alone, exposes a second
  #     number to anon, and still HIDES a number reachable only from a draft
  #     listing. Reverting to the old policy made the second number vanish,
  #     confirming the widening is load-bearing rather than cosmetic.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path sends contacts.languages and writes
  #     property_contacts (including is_primary), and PostgREST rejects an
  #     unknown column with PGRST204, which would break saving ANY listing.
  # 20260822000000_province_coverage.sql — reviewed and authorized deliberately.
  # It expands listings from Vientiane-only to all 17 Laos provinces plus
  # Vientiane Capital. Reviewed on its own terms because, unlike 20260820000000
  # above, this one DOES write to a pre-existing table:
  #   * Schema is additive: three nullable columns on properties (province_en,
  #     province_lo, province_zh), one CHECK, one index. No column is dropped,
  #     no type changes, nothing is renamed. properties had NO province concept
  #     before this, so nothing is being reinterpreted.
  #   * It UPDATEs properties — the core listings table. Read statement by
  #     statement, that UPDATE writes ONLY the three NEW columns, and only
  #     `WHERE province_en IS NULL`, so it can neither overwrite a value that
  #     already existed nor change any pre-existing column. Re-running is a
  #     no-op. No other table is written at all.
  #   * The backfill is a statement of fact, not a guess: it fires only for the
  #     7 Vientiane Capital districts (Sisattanak, Saysettha, Chanthabouly,
  #     Sikhottabong, Xaythany, Hadxaifong, Naxaithong), which are every value
  #     admin's DISTRICT_MAP has ever offered. A row with an unrecognised
  #     district is deliberately LEFT NULL — an unknown location must not
  #     become a wrong one.
  #   * The CHECK names exactly the 18 keys in provinces.js LAO_PROVINCES; a
  #     test asserts the two lists are identical, so a typo or a duplicated
  #     province cannot enter through any client. It is added AFTER the
  #     backfill, when every province_en is either NULL or 'Vientiane Capital',
  #     so validation of existing rows cannot fail.
  #   * Vientiane Capital and Vientiane Province are separate keys. Conflating
  #     them is the classic Laos data error and the CHECK makes it impossible.
  #   * NOT YET VERIFIED AGAINST A THROWAWAY CLUSTER, unlike 20260820000000 —
  #     the reviewer should treat the dry-run output as the first execution
  #     evidence. The gate prints the full plan before applying.
  #   * MUST be applied BEFORE the frontend that writes these columns reaches
  #     production — admin.html's save path sends province_en/_lo/_zh, and
  #     PostgREST rejects an unknown column with PGRST204, which would break
  #     saving ANY listing.
  EXPECTED_MIGRATIONS: |
    20260813000000
    20260817000000
    20260817010000
    20260818000000
    20260818010000
    20260818020000
    20260820000000
    20260822000000
    20260823000000
  EXPECTED_MIGRATION_FILE: '20260813000000_property_images_registry.sql + the 2026-08-17/18 security migrations + 20260818010000_restore_views_week_column.sql + 20260818020000_daily_rate_and_unit_lease_pricing.sql + 20260820000000_multi_phone_contacts.sql + 20260822000000_province_coverage.sql + 20260823000000_contact_primary_invariant.sql'
  # Tripwire: the dev project ref must never be the target.
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require explicit APPLY confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::Confirmation not given. Re-run the workflow and type APPLY in the confirm box."
            exit 1
          fi
          echo "Confirmation received."

      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (production database password — db push needs a direct Postgres connection). Add it under Settings → Secrets and variables → Actions. See this file's header."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "Required secrets present."

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve the production project ref from config.prod.js (expected a https://<ref>.supabase.co URL)."
            exit 1
          fi
          if [ "$REF" = "${DEV_REF}" ]; then
            echo "::error::Resolved ref ($REF) is the DEV project. Refusing to run against dev."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target project::Applying migrations to PRODUCTION project ref: $REF"
          {
            echo "## Apply DB migration — target"
            echo ""
            echo "- Project ref: \`$REF\` (production)"
            echo "- Authorized migration: \`${EXPECTED_MIGRATION_FILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Linking to production ref ${{ steps.ref.outputs.ref }} …"
          supabase link --project-ref "${{ steps.ref.outputs.ref }}"

      - name: Migration history (before) — read only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (before)"
          supabase migration list
          echo "::endgroup::"

      - name: Dry run + safety gate
        id: plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase db push --dry-run"
          supabase db push --dry-run 2>&1 | tee dryrun.txt
          echo "::endgroup::"

          {
            echo ""
            echo "### Dry-run plan"
            echo ""
            echo '```'
            cat dryrun.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Migration versions the dry-run reports as pending (14-digit prefixes).
          PENDING="$(grep -oE '[0-9]{14}' dryrun.txt | sort -u || true)"
          echo "Pending versions detected: ${PENDING:-<none>}"

          if [ -z "$PENDING" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending migrations — production is already up to date. Nothing to apply."
            exit 0
          fi

          # Refuse if ANYTHING outside the authorized allowlist is pending.
          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          echo "Authorized versions: $(echo $AUTHORIZED | tr '\n' ' ')"
          UNEXPECTED="$(comm -23 <(echo "$PENDING" | sort -u) <(echo "$AUTHORIZED"))"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Refusing to push. Pending migration(s) NOT on the authorized list: $(echo $UNEXPECTED | tr '\n' ' '). This workflow only applies ${EXPECTED_MIGRATION_FILE}. Investigate the divergence — and if the extra migration is legitimate, review it and add its version to EXPECTED_MIGRATIONS deliberately."
            exit 1
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"
          echo "Safety gate passed: every pending migration is on the authorized list."

      - name: Apply migration (supabase db push)
        if: steps.plan.outputs.already_applied == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Applying to PRODUCTION ref ${{ steps.ref.outputs.ref }} …"
          echo "::group::supabase db push"
          supabase db push
          echo "::endgroup::"
          echo "- ✅ applied \`${EXPECTED_MIGRATION_FILE}\` to production (\`${{ steps.ref.outputs.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (read-only) — target migration no longer pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (after)"
          supabase migration list
          echo "::endgroup::"

          echo "::group::supabase db push --dry-run (post-apply check)"
          supabase db push --dry-run 2>&1 | tee dryrun_after.txt
          echo "::endgroup::"

          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          STILL_PENDING="$(grep -oE '[0-9]{14}' dryrun_after.txt | sort -u | comm -12 - <(echo "$AUTHORIZED") || true)"
          if [ -n "$STILL_PENDING" ]; then
            echo "::error::Verification failed — $(echo $STILL_PENDING | tr '\n' ' ') still reported as pending after push."
            exit 1
          fi
          echo "Verified: every authorized migration is applied (no longer pending on production)."
          echo "- ✅ verified applied on production" >> "$GITHUB_STEP_SUMMARY"
