name: Apply DB Migration (production)

# Applies EXISTING, already-committed Supabase migrations to the PRODUCTION
# Pintag database — and nothing else. This is intentionally NOT a general
# deployment workflow: it does not deploy functions, website, or workers, it
# never edits/creates/deletes/reorders migration files, and it never runs a
# destructive command.
#
# Manual only: the sole trigger is workflow_dispatch. There is no push or
# schedule trigger, so it can never fire on its own.
#
# Safety model:
#   * PRODUCTION project only. The ref is read from config.prod.js (the same
#     single-source-of-truth deploy-functions.yml uses) and is checked to not
#     be the dev project ref before anything connects.
#   * Requires you to type "APPLY" at dispatch time (guards against a stray click).
#   * Runs `supabase db push --dry-run` FIRST and prints the full plan to the log.
#   * SAFETY GATE: refuses to push unless the ONLY pending migration is the one
#     this workflow is authorized to apply (EXPECTED_MIGRATIONS below). If the
#     remote is behind on any other migration, it ABORTS without applying, so
#     it can never silently apply unrelated migrations.
#   * Applies with `supabase db push` (additive migration only).
#   * NEVER `db reset`, NEVER `--include-seed`, NEVER any destructive flag.
#   * Verifies afterward with read-only `supabase migration list` + a second
#     dry-run that must report the target migration as no longer pending.
#
# One-time setup — two repository secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#   * SUPABASE_ACCESS_TOKEN — already present (used by deploy-functions.yml).
#   * SUPABASE_DB_PASSWORD  — the PRODUCTION database password. `db push` opens
#     a direct Postgres connection that the access token cannot authenticate on
#     its own. Get it from Supabase Dashboard → Project Settings → Database →
#     Database password (reset/copy). If this secret is missing the workflow
#     fails fast at the pre-flight check, before touching anything.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm applying migrations to PRODUCTION'
        required: true
        default: ''

# Only ever one migration run at a time; never cancel one in progress.
concurrency:
  group: apply-db-migration-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The migrations this workflow is authorized to apply — an EXPLICIT, REVIEWED
  # allowlist, one version per line. The safety property is "only what is named
  # here", never "however many are pending", so listing two reviewed migrations
  # is exactly as safe as listing one. Anything pending that is NOT on this list
  # aborts the run before a single statement is applied.
  #
  # Currently authorized: the two migrations from the 2026-08-17 security audit.
  # Both are additive, idempotent and touch NO row of data — they redefine one
  # view's execution mode and a handful of function authorization gates.
  # See docs/SECURITY_AUDIT_2026-08-17.md and docs/SECURITY_VERIFICATION_2026-08-17.md.
  #
  # ⚠ KNOWN SEQUENCING ISSUE — read before running.
  # The apply-migration run of 2026-08-13 recorded production at 20260812000000,
  # and this workflow has not run since. 20260813000000_property_images_registry
  # was authored AFTER that run, so it is probably ALSO pending — and it is not
  # on this list, which means this workflow will (correctly) REFUSE until you
  # decide about it. That refusal is the gate working, not a bug.
  # Run "Verify Production Security" first: it reports whether 20260813000000 is
  # in the production migration ledger. Then either add it to this list once
  # reviewed, or apply it separately.
  EXPECTED_MIGRATIONS: |
    20260817000000
    20260817010000
  EXPECTED_MIGRATION_FILE: '20260817000000_security_audit_hardening.sql + 20260817010000_authz_identity_and_abuse_bounds.sql'
  # Tripwire: the dev project ref must never be the target.
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require explicit APPLY confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::Confirmation not given. Re-run the workflow and type APPLY in the confirm box."
            exit 1
          fi
          echo "Confirmation received."

      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (production database password — db push needs a direct Postgres connection). Add it under Settings → Secrets and variables → Actions. See this file's header."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "Required secrets present."

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve the production project ref from config.prod.js (expected a https://<ref>.supabase.co URL)."
            exit 1
          fi
          if [ "$REF" = "${DEV_REF}" ]; then
            echo "::error::Resolved ref ($REF) is the DEV project. Refusing to run against dev."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target project::Applying migrations to PRODUCTION project ref: $REF"
          {
            echo "## Apply DB migration — target"
            echo ""
            echo "- Project ref: \`$REF\` (production)"
            echo "- Authorized migration: \`${EXPECTED_MIGRATION_FILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Linking to production ref ${{ steps.ref.outputs.ref }} …"
          supabase link --project-ref "${{ steps.ref.outputs.ref }}"

      - name: Migration history (before) — read only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (before)"
          supabase migration list
          echo "::endgroup::"

      - name: Dry run + safety gate
        id: plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase db push --dry-run"
          supabase db push --dry-run 2>&1 | tee dryrun.txt
          echo "::endgroup::"

          {
            echo ""
            echo "### Dry-run plan"
            echo ""
            echo '```'
            cat dryrun.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Migration versions the dry-run reports as pending (14-digit prefixes).
          PENDING="$(grep -oE '[0-9]{14}' dryrun.txt | sort -u || true)"
          echo "Pending versions detected: ${PENDING:-<none>}"

          if [ -z "$PENDING" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending migrations — production is already up to date. Nothing to apply."
            exit 0
          fi

          # Refuse if ANYTHING outside the authorized allowlist is pending.
          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          echo "Authorized versions: $(echo $AUTHORIZED | tr '\n' ' ')"
          UNEXPECTED="$(comm -23 <(echo "$PENDING" | sort -u) <(echo "$AUTHORIZED"))"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Refusing to push. Pending migration(s) NOT on the authorized list: $(echo $UNEXPECTED | tr '\n' ' '). This workflow only applies ${EXPECTED_MIGRATION_FILE}. Investigate the divergence — and if the extra migration is legitimate, review it and add its version to EXPECTED_MIGRATIONS deliberately."
            exit 1
          fi

          echo "already_applied=false" >> "$GITHUB_OUTPUT"
          echo "Safety gate passed: every pending migration is on the authorized list."

      - name: Apply migration (supabase db push)
        if: steps.plan.outputs.already_applied == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Applying to PRODUCTION ref ${{ steps.ref.outputs.ref }} …"
          echo "::group::supabase db push"
          supabase db push
          echo "::endgroup::"
          echo "- ✅ applied \`${EXPECTED_MIGRATION_FILE}\` to production (\`${{ steps.ref.outputs.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (read-only) — target migration no longer pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::supabase migration list (after)"
          supabase migration list
          echo "::endgroup::"

          echo "::group::supabase db push --dry-run (post-apply check)"
          supabase db push --dry-run 2>&1 | tee dryrun_after.txt
          echo "::endgroup::"

          AUTHORIZED="$(echo "${EXPECTED_MIGRATIONS}" | tr -d ' ' | grep -E '^[0-9]{14}$' | sort -u)"
          STILL_PENDING="$(grep -oE '[0-9]{14}' dryrun_after.txt | sort -u | comm -12 - <(echo "$AUTHORIZED") || true)"
          if [ -n "$STILL_PENDING" ]; then
            echo "::error::Verification failed — $(echo $STILL_PENDING | tr '\n' ' ') still reported as pending after push."
            exit 1
          fi
          echo "Verified: every authorized migration is applied (no longer pending on production)."
          echo "- ✅ verified applied on production" >> "$GITHUB_STEP_SUMMARY"
