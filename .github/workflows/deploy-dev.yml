name: Deploy Dev (mirror to pintag-dev)

# Mirrors the dev branch's content into the separate Pintag-cyrora/pintag-dev
# repo, whose own GitHub Pages site is the permanent development website.
# Requires a PINTAG_DEV_DEPLOY_TOKEN repo secret: a fine-grained PAT scoped
# to pintag-dev with Contents: Read and write. See PREVIEW.md for setup.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same allowlisted build as deploy-prod.yml (site-manifest.txt, scripts/build-site.mjs), with the DEVELOPMENT configuration (config.dev.js -> config.js) and
      # without the production-only CNAME (pintag-dev has no custom domain). Only the clean _site/ directory is published. This mirror is a PUBLIC repository
      # with its own Pages site, so publishing the repository root (docs, SQL migrations, scripts, tests, runbooks) would expose all of it. The asset-version
      # stamp is applied by the same build, so a stale-cache mismatch can't happen here either.
      # NOTE: this workflow runs from the `dev` branch. That branch must contain scripts/build-site.mjs and site-manifest.txt (merge main into dev) or this
      # step fails closed with "Cannot find module".
      - name: Build the allowlisted development site (_site)
        run: node scripts/build-site.mjs --out _site --env dev --version "${GITHUB_SHA::8}"

      - name: Publish to pintag-dev
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.PINTAG_DEV_DEPLOY_TOKEN }}
          external_repository: Pintag-cyrora/pintag-dev
          publish_branch: main
          publish_dir: _site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy pintag@${{ github.sha }}'
