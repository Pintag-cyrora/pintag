name: "DIAGNOSTIC: Production security drift (is_admin / rls_auto_enable)"

# TEMPORARY, READ-ONLY diagnostic workflow. Created to close the
# 2026-09-21 / 2026-09-24 unresolved finding in
# scripts/verify-production-security.sql's "no UNEXPECTED ungated
# SECURITY DEFINER function is callable by anon" check: is_admin and
# rls_auto_enable have no CREATE FUNCTION anywhere in this repository's
# migration history (confirmed by two independent full-repo audits -- see
# supabase/migrations/20260921010000_revoke_public_execute_analytics_and_ownership_rpcs.sql
# and this repo's apply-migration.yml, both of which explain the same gap
# and deliberately leave both functions untouched pending exactly this
# kind of live-catalog inspection). This workflow inspects their LIVE
# definitions so a human can decide REVOKE / ALLOWLIST / INVESTIGATE
# FURTHER with real evidence instead of guessing.
#
# SAFETY (all of these are load-bearing, not decorative):
#   - SELECT / catalog inspection only. No CREATE/ALTER/DROP/GRANT/REVOKE/
#     INSERT/UPDATE/DELETE/TRUNCATE/COPY/CALL/DO anywhere in the SQL this
#     workflow runs -- enforced twice: (1) the SQL is embedded directly
#     below, readable in this diff; (2) a shell-level grep gate aborts the
#     job if the SQL file ever contains a write/DDL keyword, BEFORE psql
#     is ever invoked against production.
#   - The DB session is put into READ ONLY mode (BEGIN READ ONLY) before
#     any catalog query runs, and a separate step independently confirms
#     current_setting('transaction_read_only') actually reports 'on'
#     before the main diagnostic proceeds -- it fails closed if the
#     connection cannot be made read-only, rather than silently
#     continuing.
#   - Reuses the EXISTING production-backup environment and its EXISTING
#     PINTAG_PROD_DB_URL secret (the same one verify-production-security.yml
#     and image-integrity.yml already use) -- no new credential is created.
#   - Never echoes the connection string, a password, or any other secret.
#     No step touching PINTAG_PROD_DB_URL uses `set -x`. GitHub Actions'
#     own secret redaction is an additional backstop on top of that.
#   - Does NOT modify verify-production-security.yml, any migration file,
#     or any production object. Read-only by construction, not by promise.
#
# TRIGGERS: this branch is explicitly NOT to be merged into main yet, and
# workflow_dispatch only becomes invokable via the GitHub UI/API once a
# workflow file is registered on the default branch -- so this also runs
# on a push to this exact branch, which needs no such registration and
# fires the one run this diagnostic exists for. workflow_dispatch is kept
# too, for any later re-run once this is merged. Never scheduled.
#
#
# PHASE 2 (2026-09-29): SQL replaced with a second set of read-only catalog queries, run at the
# user's explicit request, to verify the ensure_rls event trigger and the is_admin() search_path
# question before any remediation is proposed. Same guarantees as above: SELECT-only, READ ONLY
# transaction, shell safety gate, no writes, no secrets printed.
#
# This workflow is intentionally temporary: delete it once the findings
# below have been acted on (REVOKE, ALLOWLIST, or otherwise resolved).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/diagnose-is-admin-rls-auto-enable

permissions:
  contents: read

concurrency:
  group: diagnose-production-security-drift
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect is_admin / rls_auto_enable (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup
    env:
      PINTAG_PROD_DB_URL: ${{ secrets.PINTAG_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify DB URL secret is present
        run: |
          if [ -z "${PINTAG_PROD_DB_URL:-}" ]; then
            echo "::error::Missing secret PINTAG_PROD_DB_URL in the production-backup environment."
            exit 1
          fi

      - name: Write the diagnostic SQL (SELECT / catalog inspection only)
        run: |
          cat > diagnose.sql <<'SQL_EOF'
          \pset border 2
          \pset pager off
          \set ON_ERROR_STOP on

          BEGIN READ ONLY;

          \echo '=== P2-0: SESSION - connected role, server version, read-only confirmation ==='
          SELECT current_user AS connected_role, current_setting('server_version') AS server_version, current_setting('transaction_read_only') AS transaction_read_only;

          \echo '=== P2-0b: ROLE FLAGS ==='
          SELECT rolname, rolsuper, rolinherit, rolbypassrls, rolcanlogin
          FROM pg_roles
          WHERE rolname IN ('postgres','supabase_admin','anon','authenticated','service_role','authenticator','backup_ro')
          ORDER BY rolname;

          \echo '=== P2-0c: ROLE MEMBERSHIP - the roles that anon, authenticated, service_role and backup_ro are members of ==='
          SELECT pg_get_userbyid(m.member) AS member_role, pg_get_userbyid(m.roleid) AS belongs_to, m.admin_option
          FROM pg_auth_members m
          WHERE m.member IN (SELECT oid FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','backup_ro'))
          ORDER BY 1, 2;

          \echo '=== P2-1: EVENT TRIGGERS (all) - exact catalog definition, enabled state, function binding, owner ==='
          SELECT
            e.oid::text                              AS evt_oid,
            e.evtname                                AS name,
            e.evtevent                               AS fires_on,
            e.evttags                                AS only_for_tags,
            e.evtenabled                             AS enabled_code,
            CASE e.evtenabled
              WHEN 'O' THEN 'ENABLED (fires in origin/local sessions)'
              WHEN 'R' THEN 'ENABLED (replica sessions only)'
              WHEN 'A' THEN 'ENABLED (always)'
              WHEN 'D' THEN 'DISABLED'
              ELSE 'unknown' END                     AS enabled_meaning,
            pg_get_userbyid(e.evtowner)              AS evt_owner,
            r.rolsuper                               AS owner_is_superuser,
            e.evtfoid::text                          AS function_oid,
            e.evtfoid::regprocedure::text            AS function_signature,
            obj_description(e.oid, 'pg_event_trigger') AS comment
          FROM pg_event_trigger e
          JOIN pg_roles r ON r.oid = e.evtowner
          ORDER BY e.evtname;

          \echo '=== P2-1b: BINDING PROOF - is the event trigger bound to the SAME oid as public.rls_auto_enable ==='
          SELECT
            e.evtname                          AS event_trigger,
            e.evtfoid::text                    AS bound_function_oid,
            p.oid::text                        AS rls_auto_enable_oid,
            (e.evtfoid = p.oid)                AS bound_to_rls_auto_enable,
            pg_get_userbyid(p.proowner)        AS function_owner,
            p.prosecdef                        AS security_definer,
            p.proconfig                        AS function_config,
            p.prorettype::regtype::text        AS returns,
            p.proacl::text                     AS raw_acl_now
          FROM pg_event_trigger e
          JOIN pg_proc p ON p.oid = e.evtfoid
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE p.proname = 'rls_auto_enable' AND n.nspname = 'public';

          \echo '=== P2-1c: pg_depend rows recorded FOR event triggers ==='
          SELECT pg_describe_object(d.classid, d.objid, d.objsubid) AS dependent_object, d.deptype,
                 pg_describe_object(d.refclassid, d.refobjid, d.refobjsubid) AS depends_on
          FROM pg_depend d
          WHERE d.classid = 'pg_event_trigger'::regclass
          ORDER BY 1;

          \echo '=== P2-1d: ACL ENTRIES WITH GRANTOR for both functions (who granted, so who can remove) ==='
          SELECT
            p.proname, p.oid::text AS oid, p.proacl::text AS raw_acl, pg_get_userbyid(p.proowner) AS owner,
            CASE WHEN a.grantee = 0 THEN 'PUBLIC' ELSE a.grantee::regrole::text END AS grantee,
            a.grantor::regrole::text AS grantor, a.privilege_type, a.is_grantable
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          CROSS JOIN LATERAL aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
          WHERE n.nspname = 'public' AND p.proname IN ('is_admin','rls_auto_enable')
          ORDER BY p.proname, 5;

          \echo '=== P2-2: DEFAULT PRIVILEGES (why newly added functions get broad EXECUTE) ==='
          SELECT pg_get_userbyid(defaclrole) AS for_role, defaclnamespace::regnamespace::text AS in_schema,
                 defaclobjtype AS objtype, defaclacl::text AS acl
          FROM pg_default_acl
          ORDER BY 1, 2, 3;

          \echo '=== P2-3: VERIFIER CHECK 10 PREDICATE, EXACTLY AS WRITTEN, RUN LIVE (read-only) ==='
          SELECT
            p.oid::regprocedure::text AS function,
            p.prorettype::regtype::text AS returns,
            has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_can_execute_now,
            EXISTS (
              SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) x
              WHERE x.privilege_type = 'EXECUTE'
                AND x.grantee <> (SELECT oid FROM pg_roles WHERE rolname = 'anon')
                AND CASE WHEN x.grantee = 0 THEN false ELSE pg_has_role('anon', x.grantee, 'USAGE') END
            ) AS anon_keeps_access_via_role_membership
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public' AND p.prosecdef
            AND p.prorettype <> 'trigger'::regtype
            AND has_function_privilege('anon', p.oid, 'EXECUTE')
            AND pg_get_functiondef(p.oid) NOT LIKE '%is_pintag_admin%'
            AND p.proname NOT IN (
              'public_listing_stats','increment_listing_view','market_transition_stats',
              'is_pintag_admin','is_pintag_staff',
              'check_lead_rate_limit','check_listing_event_dedup','check_event_target_ceiling',
              'check_search_event_rate_limit','check_ui_event_rate_limit',
              'check_page_view_rate_limit','check_listing_event_burst_limit')
          ORDER BY 1;

          \echo '=== P2-3b: SAME PREDICATE with is_admin and rls_auto_enable excluded - must be 0 rows (no third offender) ==='
          SELECT p.oid::regprocedure::text AS function
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public' AND p.prosecdef
            AND p.prorettype <> 'trigger'::regtype
            AND has_function_privilege('anon', p.oid, 'EXECUTE')
            AND pg_get_functiondef(p.oid) NOT LIKE '%is_pintag_admin%'
            AND p.proname NOT IN (
              'is_admin','rls_auto_enable',
              'public_listing_stats','increment_listing_view','market_transition_stats',
              'is_pintag_admin','is_pintag_staff',
              'check_lead_rate_limit','check_listing_event_dedup','check_event_target_ceiling',
              'check_search_event_rate_limit','check_ui_event_rate_limit',
              'check_page_view_rate_limit','check_listing_event_burst_limit')
          ORDER BY 1;

          \echo '=== P2-4: every relation named profiles in ANY schema (what is_admin resolves, and shadowing exposure) ==='
          SELECT n.nspname AS schema, c.relname, c.relkind, pg_get_userbyid(c.relowner) AS owner,
                 c.relrowsecurity AS rls_enabled, c.relforcerowsecurity AS rls_forced
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relname = 'profiles'
          ORDER BY 1;

          \echo '=== P2-4b: the id and role columns of profiles ==='
          SELECT n.nspname AS schema, c.relname, a.attname, format_type(a.atttypid, a.atttypmod) AS type, a.attnotnull AS not_null
          FROM pg_attribute a
          JOIN pg_class c ON c.oid = a.attrelid
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relname = 'profiles' AND a.attnum > 0 AND NOT a.attisdropped AND a.attname IN ('id','role')
          ORDER BY 1, 3;

          \echo '=== P2-4c: RLS policies on profiles ==='
          SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check
          FROM pg_policies
          WHERE tablename = 'profiles'
          ORDER BY 1, 2, 3;

          \echo '=== P2-5: auth.uid() - definition, owner, config ==='
          SELECT n.nspname AS schema, p.proname, pg_get_function_result(p.oid) AS returns, pg_get_userbyid(p.proowner) AS owner,
                 p.prosecdef, p.proconfig, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec,
                 pg_get_functiondef(p.oid) AS definition
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'auth' AND p.proname = 'uid';

          \echo '=== P2-6: who holds which privilege on schemas public and auth (search_path hijack preconditions) ==='
          SELECT n.nspname AS schema, pg_get_userbyid(n.nspowner) AS owner,
                 CASE WHEN a.grantee = 0 THEN 'PUBLIC' ELSE a.grantee::regrole::text END AS grantee, a.privilege_type
          FROM pg_namespace n
          CROSS JOIN LATERAL aclexplode(coalesce(n.nspacl, acldefault('n', n.nspowner))) a
          WHERE n.nspname IN ('public','auth')
          ORDER BY 1, 3, 4;

          \echo '=== P2-6b: temporary-table privilege on this database ==='
          SELECT r AS role, has_database_privilege(r, current_database(), 'TEMP') AS can_make_temp_tables
          FROM unnest(ARRAY['anon','authenticated','service_role']) AS r;

          \echo '=== P2-7: the CURRENT admin boundary - is_pintag_admin / is_pintag_staff ==='
          SELECT p.oid::regprocedure::text AS function, p.prosecdef, p.proconfig,
                 has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec,
                 has_function_privilege('authenticated', p.oid, 'EXECUTE') AS authenticated_exec
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public' AND p.proname IN ('is_pintag_admin','is_pintag_staff')
          ORDER BY 1;

          SELECT count(*) AS policies_referencing_is_pintag_admin
          FROM pg_policies
          WHERE qual ILIKE '%is\_pintag\_admin%' OR with_check ILIKE '%is\_pintag\_admin%';

          \echo '=== P2-8: search_path convention across ALL SECURITY DEFINER functions in public (what this codebase already uses) ==='
          SELECT coalesce(p.proconfig::text, '(unpinned)') AS proconfig, count(*) AS n,
                 string_agg(p.proname, ', ' ORDER BY p.proname) AS functions
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public' AND p.prosecdef AND p.prokind = 'f'
          GROUP BY 1
          ORDER BY 2 DESC;

          \echo '=== P2-9: EXHAUSTIVE reference scan. Rows for label is_admin = a reference exists; the control label must show hits in every kind that can hold one ==='
          WITH pats(pat, label) AS (
            VALUES ('%is\_admin%', 'is_admin'), ('%is\_pintag\_admin%', 'CONTROL is_pintag_admin')
          ),
          hits AS (
            SELECT pt.label, 'column default' AS kind, adrelid::regclass::text AS object
              FROM pg_attrdef, pats pt WHERE pg_get_expr(adbin, adrelid) ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'constraint', conname
              FROM pg_constraint, pats pt WHERE pg_get_constraintdef(oid) ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'index', indexrelid::regclass::text
              FROM pg_index, pats pt WHERE pg_get_indexdef(indexrelid) ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'trigger definition', tgname
              FROM pg_trigger, pats pt WHERE NOT tgisinternal AND pg_get_triggerdef(oid) ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'rule or view', ev_class::regclass::text
              FROM pg_rewrite, pats pt WHERE pg_get_ruledef(oid) ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'policy', schemaname || '.' || tablename || '.' || policyname
              FROM pg_policies, pats pt WHERE coalesce(qual,'') ILIKE pt.pat OR coalesce(with_check,'') ILIKE pt.pat
            UNION ALL
            SELECT pt.label, 'function or procedure source (all schemas, all kinds)', n.nspname || '.' || p.proname
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace, pats pt
              WHERE p.prosrc ILIKE pt.pat AND p.proname NOT IN ('is_admin','is_pintag_admin')
            UNION ALL
            SELECT pt.label, 'sql-standard function body (prosqlbody)', n.nspname || '.' || p.proname
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace, pats pt
              WHERE p.prosqlbody IS NOT NULL AND p.prosqlbody::text ILIKE pt.pat AND p.proname NOT IN ('is_admin','is_pintag_admin')
          )
          SELECT label, kind, count(*) AS hits
          FROM hits
          GROUP BY label, kind
          ORDER BY label DESC, kind;

          \echo '=== P2-9b: scheduled jobs (pg_cron) mentioning is_admin ==='
          SELECT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'cron') AS pg_cron_schema_present,
                 EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                         WHERE n.nspname = 'cron' AND c.relname = 'job'
                           AND has_schema_privilege(current_user, n.oid, 'USAGE')
                           AND has_table_privilege(current_user, c.oid, 'SELECT')) AS cron_job_readable_by_connected_role \gset
          \echo 'pg_cron schema present:' :pg_cron_schema_present '- cron.job readable by the connected role:' :cron_job_readable_by_connected_role
          \if :cron_job_readable_by_connected_role
            SELECT jobid, jobname, left(command, 160) AS command_start FROM cron.job WHERE command ILIKE '%is\_admin%';
          \else
            \echo 'cron.job cannot be read by the connected role: scheduled-job text NOT verified from this connection'
          \endif

          \echo '=== P2-10: MIGRATION STATE - applied versions from 20260901000000 onward ==='
          SELECT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                         WHERE n.nspname = 'supabase_migrations' AND c.relname = 'schema_migrations'
                           AND has_schema_privilege(current_user, n.oid, 'USAGE')
                           AND has_table_privilege(current_user, c.oid, 'SELECT')) AS mig_readable \gset
          \if :mig_readable
            SELECT version FROM supabase_migrations.schema_migrations WHERE version >= '20260901000000' ORDER BY version;
          \else
            \echo 'supabase_migrations.schema_migrations is absent or not readable by the connected role: skipped'
          \endif

          \echo '=== P2-11: RUNTIME USAGE EVIDENCE - does anything actually execute is_admin / rls_auto_enable ==='
          SELECT current_setting('track_functions') AS track_functions,
                 pg_has_role(current_user, 'pg_read_all_stats', 'USAGE') AS can_read_all_stats,
                 EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements') AS pg_stat_statements_installed;
          SELECT funcname, calls, total_time FROM pg_stat_user_functions WHERE funcname IN ('is_admin','rls_auto_enable') ORDER BY funcname;
          SELECT (SELECT n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'pg_stat_statements') AS pgss_schema,
                 EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements')
                   AND pg_has_role(current_user, 'pg_read_all_stats', 'USAGE') AS pgss_readable \gset
          \if :pgss_readable
            SELECT count(*) AS statements_mentioning_is_admin, coalesce(sum(calls), 0) AS total_calls
            FROM :"pgss_schema".pg_stat_statements WHERE query ILIKE '%is\_admin%';
          \else
            \echo 'pg_stat_statements absent or the connected role lacks pg_read_all_stats: statement text NOT verified'
          \endif

          \echo '=== P2-4d: counts only (no identities) - rows in public.profiles and how many carry role admin ==='
          SELECT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                         WHERE n.nspname = 'public' AND c.relname = 'profiles' AND c.relkind = 'r'
                           AND has_schema_privilege(current_user, n.oid, 'USAGE')
                           AND has_table_privilege(current_user, c.oid, 'SELECT')) AS profiles_readable \gset
          \if :profiles_readable
            SELECT count(*) AS profile_rows, count(*) FILTER (WHERE role = 'admin') AS rows_with_role_admin FROM public.profiles;
          \else
            \echo 'public.profiles is absent or not readable by the connected role: count skipped'
          \endif

          ROLLBACK;
          SQL_EOF
          echo "diagnose.sql written ($(wc -l < diagnose.sql) lines)."

      - name: "Safety gate: refuse to run if the SQL contains any write/DDL keyword"
        run: |
          set -euo pipefail
          echo "================================================================"
          echo " SAFETY GATE -- scanning diagnose.sql for write operations"
          echo " before it is ever sent to production."
          echo "================================================================"
          if grep -inE '\b(CREATE|ALTER|DROP|GRANT|REVOKE|INSERT|UPDATE|DELETE|TRUNCATE|COPY|CALL|DO)\b' diagnose.sql; then
            echo "::error::diagnose.sql contains a write/DDL keyword (matched above). Refusing to run -- this workflow is READ-ONLY by design."
            exit 1
          fi
          echo "OK: no write/DDL keywords found. Proceeding with SELECT/catalog inspection only."

      - name: "Fail closed unless the connection can actually be made READ ONLY"
        run: |
          set -euo pipefail
          # psql -tA still emits the BEGIN/ROLLBACK command-completion tags
          # alongside the SELECT tuple when they're batched into one -c string
          # (tuples-only suppresses headers/footers, not command tags), so pick
          # out the exact 'on'/'.off' line rather than assuming the whole output
          # is the value. If no such line is found, RO is empty and the check
          # still fails closed below.
          RO=$(psql "$PINTAG_PROD_DB_URL" -X -tA -c "BEGIN READ ONLY; SELECT current_setting('transaction_read_only'); ROLLBACK;" | grep -E '^(on|off)$' | head -n1)
          echo "transaction_read_only reports: '$RO'"
          if [ "$RO" != "on" ]; then
            echo "::error::Could not confirm a READ ONLY transaction against production (got '$RO'). Refusing to proceed."
            exit 1
          fi
          echo "OK: connection confirmed read-only."

      - name: Run diagnostic (SELECT / catalog inspection only)
        run: |
          set -euo pipefail
          echo "================================================================"
          echo " READ-ONLY DIAGNOSTIC -- catalog inspection of is_admin and"
          echo " rls_auto_enable only. No writes. No production changes."
          echo "================================================================"
          psql "$PINTAG_PROD_DB_URL" -v ON_ERROR_STOP=1 -f diagnose.sql 2>&1 | tee diagnostic-report.txt

      - name: Publish findings to the job summary
        if: always()
        run: |
          {
            echo "# Production security drift diagnostic: is_admin / rls_auto_enable"
            echo ""
            echo "Read-only catalog inspection. No writes were made to production."
            echo ""
            echo '```'
            cat diagnostic-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: is-admin-rls-auto-enable-diagnostic
          path: diagnostic-report.txt
          retention-days: 90
