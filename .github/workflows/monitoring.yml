name: Production Monitoring

# L1 baseline monitoring (audit 2026-08-06: no monitoring of any kind existed).
# Two layers:
#   1. The in-database tripwires (20260806030000_mass_delete_alerting.sql)
#      alert within SECONDS via webhook when a hard delete / mass delete
#      happens. That is the primary "alert within minutes" path.
#   2. This workflow is the scheduled BACKSTOP: uptime, listing-count floor,
#      unseen critical alerts, and admin-activity anomalies. A failed run
#      notifies the repo owner (GitHub Actions failure email) and, when
#      ALERT_WEBHOOK_URL is set, POSTs to the same webhook channel.
#
# Secrets used (all optional except none — steps skip gracefully):
#   PINTAG_PROD_DB_URL   read-only DB checks (same secret backup.yml uses)
#   ALERT_WEBHOOK_URL    optional webhook for failure notifications
# Repo variable:
#   MIN_EXPECTED_LISTINGS  listing-count floor (defaults to 1)

on:
  schedule:
    - cron: '*/30 * * * *'        # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PINTAG_PROD_DB_URL is scoped to the production-backup Environment (that is
    # where backup.yml and image-integrity.yml already read it from). Without
    # this line the secret resolves to an EMPTY STRING here rather than failing,
    # and the DB checks below silently skip on their `if: env.PINTAG_PROD_DB_URL
    # != ''` guard — a monitor that reports nothing while looking healthy.
    # Declaring the environment is what makes the secret visible; the
    # alternative was promoting it to a repository-wide secret, which would
    # widen its blast radius to every workflow.
    #
    # Repository-level secrets and vars (ALERT_WEBHOOK_URL,
    # MIN_EXPECTED_LISTINGS) are unaffected: an environment layers on top of
    # them, it does not hide them.
    environment: production-backup
    env:
      PINTAG_PROD_DB_URL: ${{ secrets.PINTAG_PROD_DB_URL }}
      ALERT_WEBHOOK_URL:  ${{ secrets.ALERT_WEBHOOK_URL }}
      MIN_EXPECTED_LISTINGS: ${{ vars.MIN_EXPECTED_LISTINGS || 1 }}
    steps:
      - name: Uptime — public site
        run: |
          # pintag.io is fronted by a Cloudflare Worker (cloudflare-worker/
          # og-listing-preview.js). While MAINTENANCE_MODE is on, the public
          # browsing pages ("/", /index.html, /listings.html, /listing.html) are
          # served an "Under Maintenance" page as HTTP 503 + Retry-After — an
          # INTENTIONAL, healthy state (so crawlers treat the downtime as
          # temporary and never index the placeholder). admin.html and every
          # asset pass through untouched. Classify accordingly:
          #   2xx/3xx                         → live
          #   503 + Pintag maintenance page   → intentional maintenance, NOT an incident
          #   503 WITHOUT the maintenance page, or any other 4xx/5xx → genuine failure
          # Logic mirrored by tests/monitoring/uptime-classify.test.sh (kept in
          # sync by hand — this workflow has no checkout to share a script).
          resp=$(curl -s --max-time 20 -w '\n%{http_code}' https://pintag.io/)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "pintag.io → $code"
          case "$code" in
            2*|3*)
              echo "Public site is live." ;;
            503)
              if printf '%s' "$body" | grep -qi 'maintenance'; then
                echo "Public site is in INTENTIONAL maintenance (503 + maintenance page). Not an incident."
              else
                echo "::error::Public site returned 503 without the maintenance page — unexpected outage"; exit 1
              fi ;;
            *)
              echo "::error::Public site returned $code"; exit 1 ;;
          esac

      - name: Uptime — admin surface
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://pintag.io/admin.html)
          echo "admin.html → $code"
          case "$code" in 2*|3*) ;; *) echo "::error::Admin surface returned $code"; exit 1;; esac

      - name: Storage audit — READ ONLY (manual dispatch only)
        # Supabase warns the database is near the Free-plan 500 MB limit. This
        # answers WHAT is consuming the space before anyone proposes deleting
        # anything. Every statement is a SELECT against the catalogs and
        # pg_stat_user_tables; the session is additionally pinned read-only so a
        # write would error rather than succeed.
        #
        # `github.event_name == 'workflow_dispatch'` on purpose: this is an
        # investigation, not a 30-minute health check, and it must never add
        # load to the scheduled monitor.
        if: github.event_name == 'workflow_dispatch' && env.PINTAG_PROD_DB_URL != ''
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-client >/dev/null
          q() { psql "$PINTAG_PROD_DB_URL" -X -A -F ' | ' -v ON_ERROR_STOP=1 \
                  -c "SET default_transaction_read_only=on; $1"; }

          echo "=== A. DATABASE SIZE (this is the Free-plan metric) ==========="
          q "SELECT current_database() AS db,
                    pg_size_pretty(pg_database_size(current_database())) AS db_size,
                    pg_database_size(current_database())                 AS db_bytes,
                    round(100.0*pg_database_size(current_database())/(500*1024*1024),1) AS pct_of_500mb;"

          echo ""
          echo "  size by schema (user data vs Supabase internals):"
          q "SELECT n.nspname AS schema,
                    pg_size_pretty(sum(pg_total_relation_size(c.oid))) AS total,
                    sum(pg_total_relation_size(c.oid))                 AS bytes,
                    count(*) FILTER (WHERE c.relkind='r')              AS tables
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind IN ('r','m','t','i')
             GROUP BY 1 ORDER BY 3 DESC LIMIT 15;"

          echo ""
          echo "=== B. EVERY USER TABLE: data / indexes / total ================"
          q "SELECT c.relname AS table_name,
                    pg_size_pretty(pg_table_size(c.oid))          AS data_incl_toast,
                    pg_size_pretty(pg_indexes_size(c.oid))        AS indexes,
                    pg_size_pretty(pg_total_relation_size(c.oid)) AS total,
                    pg_total_relation_size(c.oid)                 AS total_bytes,
                    round(100.0*pg_total_relation_size(c.oid)/nullif(pg_database_size(current_database()),0),2) AS pct_of_db,
                    c.reltuples::bigint                           AS est_rows
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind='r' AND n.nspname='public'
             ORDER BY pg_total_relation_size(c.oid) DESC;"

          echo ""
          echo "=== C. TOP 20 INDEXES =========================================="
          q "SELECT i.relname AS index_name, t.relname AS on_table,
                    pg_size_pretty(pg_relation_size(i.oid)) AS size,
                    pg_relation_size(i.oid)                 AS bytes,
                    idx.idx_scan                            AS scans
             FROM pg_class i
             JOIN pg_index ix ON ix.indexrelid=i.oid
             JOIN pg_class t  ON t.oid=ix.indrelid
             JOIN pg_namespace n ON n.oid=i.relnamespace
             LEFT JOIN pg_stat_user_indexes idx ON idx.indexrelid=i.oid
             WHERE i.relkind='i' AND n.nspname='public'
             ORDER BY pg_relation_size(i.oid) DESC LIMIT 20;"

          echo ""
          echo "=== D. DEAD TUPLES / BLOAT ====================================="
          q "SELECT relname AS table_name, n_live_tup AS live_rows, n_dead_tup AS dead_rows,
                    CASE WHEN n_live_tup+n_dead_tup>0
                         THEN round(100.0*n_dead_tup/(n_live_tup+n_dead_tup),1) ELSE 0 END AS dead_pct,
                    pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
                    last_autovacuum, last_autoanalyze
             FROM pg_stat_user_tables
             WHERE n_dead_tup > 0
             ORDER BY n_dead_tup DESC LIMIT 25;"

          echo ""
          echo "=== E. TOAST (large JSON/text payloads) ========================"
          q "SELECT c.relname AS table_name,
                    pg_size_pretty(pg_total_relation_size(c.reltoastrelid)) AS toast_size,
                    pg_total_relation_size(c.reltoastrelid)                 AS toast_bytes,
                    pg_size_pretty(pg_relation_size(c.oid))                 AS heap_size
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind='r' AND c.reltoastrelid<>0
               AND pg_total_relation_size(c.reltoastrelid) > 0
             ORDER BY pg_total_relation_size(c.reltoastrelid) DESC LIMIT 20;"

          echo ""
          echo "  widest jsonb/text columns (avg + max bytes per value):"
          q "SELECT table_name, column_name, data_type
             FROM information_schema.columns
             WHERE table_schema='public' AND data_type IN ('jsonb','json','text','ARRAY')
               AND table_name IN (
                 SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                 WHERE n.nspname='public' AND c.relkind='r' AND c.reltoastrelid<>0
                 ORDER BY pg_total_relation_size(c.reltoastrelid) DESC LIMIT 6)
             ORDER BY table_name, column_name;"

          echo ""
          echo "=== F. ROW COUNTS for history/event/log tables ================="
          q "SELECT relname AS table_name, n_live_tup AS live_rows,
                    pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
                    n_tup_ins AS inserts_since_stats_reset
             FROM pg_stat_user_tables
             ORDER BY n_live_tup DESC LIMIT 30;"

          echo ""
          echo "=== G. DUPLICATE / REDUNDANT INDEXES =========================="
          q "SELECT indrelid::regclass AS on_table, count(*) AS copies,
                    string_agg(indexrelid::regclass::text, ', ') AS indexes,
                    pg_size_pretty(sum(pg_relation_size(indexrelid))) AS combined
             FROM pg_index i
             JOIN pg_class c ON c.oid=i.indexrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
             GROUP BY indrelid, indkey, indclass, indexprs::text, indpred::text
             HAVING count(*) > 1;"

          echo ""
          echo "  never-scanned indexes (candidates, NOT a delete list):"
          q "SELECT s.relname AS on_table, s.indexrelname AS index_name,
                    pg_size_pretty(pg_relation_size(s.indexrelid)) AS size, s.idx_scan AS scans
             FROM pg_stat_user_indexes s
             JOIN pg_index i ON i.indexrelid=s.indexrelid
             WHERE s.idx_scan = 0 AND NOT i.indisunique AND NOT i.indisprimary
             ORDER BY pg_relation_size(s.indexrelid) DESC LIMIT 20;"

          echo ""
          echo "=== H. WAL / non-database usage (for the size distinction) ====="
          q "SELECT pg_size_pretty(sum(size)) AS wal_on_disk, count(*) AS wal_segments
             FROM pg_ls_waldir();" || echo "  (pg_ls_waldir not permitted for this role)"

      - name: Database checks (listing floor, critical alerts, admin-activity anomaly)
        if: env.PINTAG_PROD_DB_URL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          fail=0

          # 1. Listing-count floor — a sudden drop below the floor is exactly
          #    how the 2026-08-03 incident would have surfaced in minutes.
          n=$(psql "$PINTAG_PROD_DB_URL" -Atqc \
            "select count(*) from properties where coalesce(deleted_at, null) is null" 2>/dev/null \
            || psql "$PINTAG_PROD_DB_URL" -Atqc "select count(*) from properties")
          echo "listings (not soft-deleted): $n (floor: $MIN_EXPECTED_LISTINGS)"
          if [ "$n" -lt "$MIN_EXPECTED_LISTINGS" ]; then
            echo "::error::Listing count $n fell below floor $MIN_EXPECTED_LISTINGS"; fail=1
          fi

          # 2. Unseen critical/high ops alerts in the last 24h (belt for the
          #    webhook braces — fires even if no webhook is configured).
          a=$(psql "$PINTAG_PROD_DB_URL" -Atqc \
            "select count(*) from ops_alerts where created_at > now() - interval '24 hours' and severity in ('high','critical')" 2>/dev/null || echo 0)
          echo "high/critical ops_alerts in last 24h: $a"
          if [ "$a" -gt 0 ]; then
            psql "$PINTAG_PROD_DB_URL" -c \
              "select created_at, kind, severity, message from ops_alerts where created_at > now() - interval '24 hours' and severity in ('high','critical') order by created_at desc limit 20" || true
            echo "::error::$a high/critical ops alert(s) in the last 24h — review ops_alerts"; fail=1
          fi

          # 3. Abnormal admin activity: privileged write volume (provenance
          #    events) far above the working norm suggests a compromised or
          #    runaway session. Threshold is deliberately generous.
          p=$(psql "$PINTAG_PROD_DB_URL" -Atqc \
            "select count(*) from listing_provenance where created_at > now() - interval '24 hours'" 2>/dev/null || echo 0)
          echo "provenance events in last 24h: $p"
          if [ "$p" -gt 2000 ]; then
            echo "::error::Abnormal admin write volume: $p provenance events in 24h"; fail=1
          fi

          exit $fail

      - name: Webhook notification on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"source\":\"pintag-monitoring\",\"severity\":\"critical\",\"message\":\"Monitoring run failed\",\"run\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
