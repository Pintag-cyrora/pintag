name: Deploy Production (Pages + Worker)

# Builds and deploys pintag.io from main via GitHub Actions, replacing the
# previous "Pages serves main's raw branch content" mechanism. There is no
# bundler: the "build" copies the allowlisted files (site-manifest.txt) into
# _site/, generates config.js from config.prod.js and stamps asset versions.
#
# Also deploys the Cloudflare Worker (cloudflare-worker/) that generates
# language-aware OG preview tags for listing.html/listings.html/index.html —
# see deploy-worker below and cloudflare-worker/README.md. Both jobs are
# triggered by the exact same push event, so both deploy the exact same
# commit (GITHUB_SHA) every time; there is no separate "worker build" step
# that could drift from what Pages just published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared across both jobs (not job-scoped) so a Pages deploy and a Worker
# deploy from two different pushes can never interleave out of order —
# whichever push's workflow run starts first finishes first, keeping both
# targets on a consistent commit relative to each other.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # DENY BY DEFAULT. The site is built into a clean `_site/` directory from the reviewed allowlist `site-manifest.txt`
      # (scripts/build-site.mjs), and ONLY `_site/` is uploaded. Previously the whole repository root was uploaded, which
      # published docs, SQL migrations, scripts, tests and runbooks on the production domain. The build:
      #   * copies exactly the files listed with "+" in site-manifest.txt (public pages, admin tools, scripts, styles, images, fonts, CNAME);
      #   * generates config.js from config.prod.js;
      #   * stamps every first-party <script src="X.js?v=__ASSET_VERSION__">/<link href="X.css?v=__ASSET_VERSION__"> with this commit's
      #     short SHA, so every static asset URL changes on every deploy (no cache can serve files from two deploys together; see the
      #     2026-08 postmortem: a stale currency.js next to a fresh admin.html);
      #   * fails if an unlisted web file appears, an excluded file is still referenced, or the output differs from the manifest.
      # Surfaces that are not part of the single-administrator production model (legacy agent portal, marketing-os.html, one-off and
      # generator tools) are "-" entries in the manifest with a recorded reason; all files remain in the repository.
      - name: Build the allowlisted site (_site)
        run: node scripts/build-site.mjs --out _site --version "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # path: _site uploads ONLY the allowlisted build output. CNAME (pintag.io) is a "+" entry in
      # site-manifest.txt — required for the custom domain to keep working under an Actions-based Pages deploy.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Deploys cloudflare-worker/og-listing-preview.js to Cloudflare, replacing
  # the previously-manual `wrangler deploy` step. Independent of the Pages
  # jobs above (different infra, no functional dependency between them) but
  # triggered by the same push, so it always deploys the same commit that
  # Pages just published — see the workflow-level comment at the top.
  #
  # ⚠️ REQUIRES A ONE-TIME MANUAL SAFETY CHECK BEFORE THIS JOB CAN RUN AT ALL:
  # this job stays inert (no CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID
  # secrets → wrangler-action fails fast with a clear auth error, it does not
  # silently no-op) until those two secrets are added to the repo. Cloudflare
  # routes can only be owned by one Worker at a time, and production may
  # already have a *different*, undocumented Worker bound to these same 4
  # routes (see cloudflare-worker/README.md's "Before enabling automatic
  # deployment" section and the DISCLOSURE comment at the top of
  # og-listing-preview.js — this was
  # never resolved from this development environment, which has no
  # Cloudflare dashboard/API access to check). Adding those secrets is what
  # activates automatic deployment, and the very first automatic deploy will
  # silently reassign those routes to this Worker if something else still
  # owns them. Do the manual route-ownership check in README.md BEFORE
  # adding the secrets, not after.
  deploy-worker:
    name: Deploy Cloudflare Worker (OG preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          # Pin Wrangler CLI to v3 to preserve the exact deploy behavior that
          # wrangler-action@v3 used (v3 installed Wrangler v3 by default;
          # wrangler-action@v4 would otherwise default to Wrangler v4). The
          # action bump to v4 is only to move the action's own runtime off the
          # deprecated Node 20 onto Node 24 — it is not a Wrangler CLI upgrade.
          wranglerVersion: '3'
          # No `continue-on-error` anywhere in this job: a failed Wrangler
          # deploy fails this job, which fails the workflow run, which shows
          # red in the Actions tab and (if branch protection/notifications
          # are configured) surfaces exactly like any other CI failure —
          # nothing here swallows a deploy failure.
