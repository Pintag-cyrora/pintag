name: Deploy Production (Pages)

# Builds and deploys pintag.io from main via GitHub Actions, replacing the
# previous "Pages serves main's raw branch content" mechanism. The only
# "build" step is generating config.js from config.prod.js — there is no
# bundler; every other file is served as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every first-party <script src="X.js?v=__ASSET_VERSION__">/<link
      # href="X.css?v=__ASSET_VERSION__"> tag gets its placeholder replaced
      # with this commit's short SHA, so every static asset URL changes on
      # every deploy. This is what actually prevents a cache (browser,
      # GitHub Pages' own CDN, or Cloudflare in front of pintag.io) from
      # ever serving two files from two different deploys together — no
      # cache purge is required, because a stale cache simply has no entry
      # for the new URL and must fetch it fresh. See the 2026-08 postmortem
      # for the incident this fixes (a stale currency.js served alongside a
      # fresh admin.html produced "Can't find variable: parseLegacyPriceAmount").
      - name: Stamp asset version into all first-party script/link tags
        run: sed -i "s/__ASSET_VERSION__/${GITHUB_SHA::8}/g" *.html

      - name: Generate config.js (production)
        run: cp config.prod.js config.js

      - uses: actions/configure-pages@v5

      # path: . uploads the whole repo root, so the existing CNAME file
      # (pintag.io) is included automatically — required for the custom
      # domain to keep working under an Actions-based Pages deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
