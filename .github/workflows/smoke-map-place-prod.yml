name: "DIAG (temporary): inspect one listing's title fields (read-only, anon)"

# TEMPORARY, READ-ONLY. NOT to be merged. No secrets, no environment, no database connection, no writes.
# One anonymous GET of the public listing row (the same read any visitor's browser performs).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/smoke-map-place-prod

permissions:
  contents: read

concurrency:
  group: smoke-map-place-prod
  cancel-in-progress: false

jobs:
  diag:
    name: Inspect one listing's title fields (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read the row
        run: |
          set -uo pipefail
          cat > q.js <<'JS_EOF'
          const fs = require('fs');
          const cfg = fs.readFileSync('config.prod.js', 'utf8');
          const pick = (k) => (cfg.match(new RegExp(k + ":\\s*'([^']+)'")) || [])[1];
          const SUPA = pick('supabaseUrl'), ANON = pick('anonKey');
          const SLUG = 'modern-3-bedroom-house-with-carport-and-contemporary-design-252656';
          const LAO = /[\u0E80-\u0EFF]/g;
          (async () => {
            const r = await fetch(SUPA + '/rest/v1/properties?slug=eq.' + encodeURIComponent(SLUG) + '&select=id,slug,status,market_status,title_en,title_lo,title_zh,description_en,property_highlight_en,property_highlight', { headers: { apikey: ANON, authorization: 'Bearer ' + ANON } });
            const rows = await r.json();
            console.log('HTTP ' + r.status + '; rows: ' + (Array.isArray(rows) ? rows.length : JSON.stringify(rows).slice(0, 200)));
            const row = Array.isArray(rows) && rows[0]; if (!row) return;
            console.log('id=' + row.id + ' status=' + row.status + ' market_status=' + row.market_status);
            for (const f of ['title_en', 'title_lo', 'title_zh', 'description_en', 'property_highlight_en', 'property_highlight']) {
              const v = row[f]; const lao = v ? (v.match(LAO) || []).length : 0;
              console.log('\n' + f + ': length=' + (v ? v.length : 0) + ', Lao-script chars=' + lao);
              if (f.startsWith('title_')) console.log('  VALUE: ' + JSON.stringify(v));
              else if (lao) console.log('  (contains Lao) VALUE: ' + JSON.stringify(v));
            }
            const te = row.title_en || '';
            const m = te.match(/[\u0E80-\u0EFF][\u0E80-\u0EFF\s]*[\u0E80-\u0EFF]|[\u0E80-\u0EFF]/g) || [];
            console.log('\nLao run(s) inside title_en: ' + JSON.stringify(m) + ' at index ' + JSON.stringify(m.map((x) => te.indexOf(x))));
            console.log('title_en === title_lo ? ' + (row.title_en === row.title_lo));
          })().catch((e) => { console.error('ERROR ' + e); process.exit(0); });
          JS_EOF
          node q.js 2>&1 | tee q-report.txt
