name: "DIAG (temporary): public listing count vs original audit (read-only, anon)"

# TEMPORARY, READ-ONLY. NOT to be merged. No secrets, no environment, no database connection.
# Only public anonymous GETs of the same listings any visitor can read (anon key from config.prod.js).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/smoke-map-place-prod

permissions:
  contents: read

concurrency:
  group: smoke-map-place-prod
  cancel-in-progress: false

jobs:
  diag:
    name: Public listing count vs audit (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Compare anon public set with the 2026-10-01 audit
        run: |
          set -uo pipefail
          cat > diag.js <<'JS_EOF'
          const fs = require('fs');
          const cfg = fs.readFileSync('config.prod.js', 'utf8');
          const pick = (k) => (cfg.match(new RegExp(k + ":\\s*'([^']+)'")) || [])[1];
          const SUPA = pick('supabaseUrl'), ANON = pick('anonKey');
          const AUDIT_NOW = '2026-10-01T06:30:03Z';
          const H = { apikey: ANON, authorization: 'Bearer ' + ANON };
          const NO_PIN = new Set(fs.readFileSync('nopin.txt', 'utf8').split(/\s+/).filter(Boolean));
          (async () => {
            const r = await fetch(SUPA + '/rest/v1/properties?select=*&limit=1000', { headers: H });
            const rows = await r.json();
            console.log('HTTP ' + r.status + '; anon-visible rows: ' + (Array.isArray(rows) ? rows.length : JSON.stringify(rows).slice(0, 200)));
            if (!Array.isArray(rows)) process.exit(1);
            const keys = Object.keys(rows[0] || {});
            const timeKeys = keys.filter((k) => /(_at|_date|date|time|publish|verified|created|updated)/i.test(k));
            console.log('time-like columns visible to anon: ' + timeKeys.join(', '));
            for (const k of timeKeys) console.log('  ' + k + ': non-null in ' + rows.filter((x) => x[k] != null).length + ' of ' + rows.length);
            const statusCount = {}; rows.forEach((x) => { const s = x.status + '/deleted=' + (x.deleted_at != null); statusCount[s] = (statusCount[s] || 0) + 1; });
            console.log('status/deleted breakdown (anon): ' + JSON.stringify(statusCount));
            console.log('rows violating the public rule (status in active|available, deleted_at null): ' + rows.filter((x) => !(['active', 'available'].includes(x.status) && x.deleted_at == null)).length);
            const ids = new Set(rows.map((x) => x.id));
            console.log('unique ids: ' + ids.size + ' of ' + rows.length);
            const missing = [...NO_PIN].filter((id) => !ids.has(id));
            console.log('audited no-pin ids (44) missing from anon set: ' + missing.length);
            const outside = rows.filter((x) => !NO_PIN.has(x.id));
            console.log('anon rows outside the 44 no-pin ids (audit: 56 exact): ' + outside.length);
            const fmt = (x) => ({ id: x.id, slug: x.slug, status: x.status, market_status: x.market_status, deleted_at: x.deleted_at, ...Object.fromEntries(timeKeys.map((k) => [k, x[k]])) });
            const after = rows.filter((x) => timeKeys.some((k) => x[k] && String(x[k]) > AUDIT_NOW));
            console.log('\nrows with ANY time-like value later than the audit (' + AUDIT_NOW + '): ' + after.length);
            after.forEach((x) => console.log('  ' + JSON.stringify(fmt(x))));
            for (const k of ['status_changed_at', 'created_at', 'updated_at']) {
              if (!timeKeys.includes(k)) continue;
              const top = rows.filter((x) => x[k]).sort((a, b) => String(b[k]).localeCompare(String(a[k]))).slice(0, 4);
              console.log('\nlatest by ' + k + ':'); top.forEach((x) => console.log('  ' + JSON.stringify(fmt(x))));
            }
          })().catch((e) => { console.error('DIAG ERROR: ' + (e && e.stack || e)); process.exit(2); });
          JS_EOF
          cat > nopin.txt <<'IDS_EOF'
          c627c509-e246-420a-a3da-c5f440816f70
          e7080606-e0cc-4bce-b0e6-fb26ca1840f8
