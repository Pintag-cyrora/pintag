name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly even without code changes to catch environment drift
  schedule:
    - cron: '0 2 * * 1'   # Mondays at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

# Least privilege: neither job writes to the repository. Without this block a
# workflow inherits the repository's DEFAULT token permissions, which on older
# repositories is read/write for every scope — an unnecessarily powerful token
# to hand to a job that only reads code and runs tests. (Audit 2026-08-17.)
permissions:
  contents: read

jobs:
  # ── Credential-free suite — safe to run on ANY event, including a PR ───────
  # These tests need no Supabase project, no admin account and no secrets, so
  # they can gate every pull request without exposing anything. They cover the
  # findings that are provable from code alone: the inline-handler XSS escaping
  # and the data-layer RLS/authorization boundaries (run against a throwaway
  # local PostgreSQL, never production).
  local:
    name: Local security regressions (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: XSS / inline-handler escaping regressions
        run: node --test xss-inline-handlers.test.js

      # The api.pintag.io proxy (docs/API_PROXY.md). Each of these guards a
      # change that fails SILENTLY rather than loudly: a Worker allowlist that
      # widens into an open proxy, a createClient() that derives a different
      # auth storage key and signs everyone out, a CSP missing the proxy host,
      # or a stored image URL that follows the API host into the database.
      - name: API proxy Worker — allowlist, traversal, header/body forwarding
        run: node --test cloudflare-worker/api-proxy-worker.test.js

      - name: API proxy Worker — local integration over real HTTP
        run: node --test cloudflare-worker/api-proxy-integration.test.js

      - name: Supabase origin / auth-storage-key invariants
        run: node --test supabase-origins.test.js

      - name: Image CDN rewrite (pre- and post-cutover)
        run: node --test image-cdn.test.js

      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql

      - name: Data-layer RLS / authorization regressions
        run: bash tests/security/regression/run-local-pg.sh

      - name: CSP is stamped on every published page and is current
        run: node scripts/apply-csp.mjs --check

      - name: CSP is enforced in a real browser with no violations
        run: |
          cd tests/csp
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

  # ── Live suite — probes a real Supabase project, so it needs credentials ───
  # Deliberately NOT run on `pull_request`. This job puts ADMIN_EMAIL/
  # ADMIN_PASSWORD and the project keys into the environment of a step that
  # executes `tests/security/run.sh` FROM THE CHECKED-OUT TREE. On a
  # pull_request from a branch in this repository, secrets ARE available, so
  # anyone able to open such a PR could edit that script to print or exfiltrate
  # the administrator's credentials. Restricting the job to push/schedule/
  # dispatch means the script that runs with the credentials is always one that
  # is already on main. (Audit 2026-08-17.)
  #
  # Coverage is not lost: PRs still run the `local` job above, and this suite
  # runs on every push to main, weekly, and on demand.
  security:
    name: Security Regression Suite (live project)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV:            staging
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
      ADMIN_EMAIL:        ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD:     ${{ secrets.ADMIN_PASSWORD }}
      TEST_USER_EMAIL:    ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      SITE_URL:           ${{ secrets.SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "$SUPABASE_URL" ]]      && missing+=(SUPABASE_URL)
          [[ -z "$SUPABASE_ANON_KEY" ]] && missing+=(SUPABASE_ANON_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required secrets not set: ${missing[*]}"
            echo "Go to Settings → Secrets and variables → Actions and add them."
            exit 1
          fi
          echo "Required secrets present."

      - name: Install dependencies (curl + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      - name: Run security suite
        run: bash tests/security/run.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: tests/security/output/reports/
          retention-days: 30
