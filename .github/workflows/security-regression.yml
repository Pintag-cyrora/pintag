name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly even without code changes to catch environment drift
  schedule:
    - cron: '0 2 * * 1'   # Mondays at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

# Least privilege: neither job writes to the repository. Without this block a
# workflow inherits the repository's DEFAULT token permissions, which on older
# repositories is read/write for every scope — an unnecessarily powerful token
# to hand to a job that only reads code and runs tests. (Audit 2026-08-17.)
permissions:
  contents: read

jobs:
  # ── Credential-free suite — safe to run on ANY event, including a PR ───────
  # These tests need no Supabase project, no admin account and no secrets, so
  # they can gate every pull request without exposing anything. They cover the
  # findings that are provable from code alone: the inline-handler XSS escaping
  # and the data-layer RLS/authorization boundaries (run against a throwaway
  # local PostgreSQL, never production).
  local:
    name: Local security regressions (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24: request-deadline.test.mjs imports a temp .mts extracted
          # from index.ts and relies on the runtime's TypeScript type-stripping.
          # Node 20 has no type-stripping and no .mts loader, so that import
          # throws ERR_UNKNOWN_FILE_EXTENSION. Type-stripping is on by default
          # from Node 24. (setup-node itself already runs on Node 24.)
          node-version: '24'

      - name: XSS / inline-handler escaping regressions
        run: node --test xss-inline-handlers.test.js

      # The production guard of the live suite: target classification, credential refusal, and a dry run of the whole suite against a recording curl.
      - name: Live-suite production safety (target guard, GET-only dry run) and the local replacements for the removed production probes
        run: node --test security-target-guard.test.js edge-function-auth-gates.test.js resolve-map-url-validation.test.js

      - name: Request-wide deadline (smart-listing-importer)
        run: node --test tests/smart-import-vision/request-deadline.test.mjs

      # "Generation failed: Load failed" — an unbounded Gemini call outliving the
      # Edge Function wall clock, killed by the platform before it could emit its
      # CORS headers. Guards the time budget and the failure classifier.
      - name: AI generation failure handling (bounded Gemini call)
        run: node --test ai-generation-failure.test.js

      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql

      - name: Data-layer RLS / authorization regressions
        run: bash tests/security/regression/run-local-pg.sh

      - name: CSP is stamped on every published page and is current
        run: node scripts/apply-csp.mjs --check

      - name: CSP is enforced in a real browser with no violations
        run: |
          cd tests/csp
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

  # ── Live suite — probes the real Supabase project ANONYMOUSLY and READ-ONLY ─
  # It runs on every push to `main` and weekly. It deliberately receives ONLY the project URL, the public anon key and the site URL:
  # no administrator or test-user credential is placed in this job's environment, so a credentialed (and potentially mutating) test cannot run
  # against production even by mistake. tests/security/lib/target-guard.sh enforces the same rule a second time inside the suite: it classifies
  # the target from the project reference in SUPABASE_URL (not from a label), refuses credentials if the target is production, and allows ONLY plain
  # GET/HEAD requests to the project's /rest/v1/ and the site (no body, no RPC, no Edge Function, no Storage, no auth endpoint, no other host).
  # Behaviour that needs a SUCCESSFUL insert (deduplication, rate limits, ceilings) is tested against a throwaway PostgreSQL database in the
  # `local` job above, never here. Credentialed tests stay disabled until an isolated staging project exists (docs/SECURITY_STAGING_ENVIRONMENT.md).
  #
  # Deliberately NOT run on `pull_request`: the script that runs with the project keys is always one that is already on main (Audit 2026-08-17).
  security:
    name: Security Regression Suite (live project)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL:           ${{ secrets.SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "$SUPABASE_URL" ]]      && missing+=(SUPABASE_URL)
          [[ -z "$SUPABASE_ANON_KEY" ]] && missing+=(SUPABASE_ANON_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required secrets not set: ${missing[*]}"
            echo "Go to Settings → Secrets and variables → Actions and add them."
            exit 1
          fi
          echo "Required secrets present."

      - name: Install dependencies (curl + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      - name: Run security suite
        run: bash tests/security/run.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: tests/security/output/reports/
          retention-days: 30
