name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      # ── TEMPORARY: production artifact verification ────────────────────
      # Proves pintag.io is now served from the GitHub Actions artifact
      # (generated config.js + stamped asset URLs + pruned pages) rather than
      # from main's raw branch tree. READ ONLY: GETs against the live site and
      # one GET against the Pages settings API. Writes nothing anywhere.
      - name: Production artifact verification (READ ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAIL=0
          bad() { echo "  ✗ $*"; FAIL=$((FAIL+1)); }
          ok()  { echo "  ✓ $*"; }

          # Cloudflare fronts /, /index.html*, /listing.html*, /listings.html*.
          # Every request below is sent with Cache-Control: no-cache so a cached
          # copy of the PREVIOUS branch-served deploy cannot masquerade as the
          # new artifact. cf-cache-status is printed so a cache HIT is visible
          # rather than silently believed.
          get() { curl -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$@"; }

          # The stamp comes from the commit deploy-prod built, which is main's
          # head -- NOT ${GITHUB_SHA}, which is this verification branch. Using
          # the wrong one asserts a stamp that was never supposed to be there.
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          SHA8="$(echo "$MAIN_SHA" | cut -c1-8)"
          echo "expecting asset stamp: ?v=${SHA8}  (main head ${MAIN_SHA})"
          echo ""

          echo "── 1. config.js is the GENERATED production config ─────────"
          CFG="$(get https://pintag.io/config.js)"
          echo "$CFG" | grep -q "detectEnvironment" \
            && bad "config.js still contains detectEnvironment() -- this is the RAW repo file" \
            || ok "no detectEnvironment() -- not the raw repo config.js"
          echo "$CFG" | grep -qE "env: *'production'"      && ok "env: 'production' (literal)"     || bad "env: 'production' missing"
          echo "$CFG" | grep -qE "isProduction: *true"     && ok "isProduction: true"              || bad "isProduction: true missing"
          echo "$CFG" | grep -qE "renditionsEnabled: *true" && ok "renditionsEnabled: true"        || bad "renditionsEnabled: true missing"
          echo "$CFG" | grep -qE "tag: *'PROD'"            && ok "tag: 'PROD'"                     || bad "tag: 'PROD' missing"
          echo ""
          echo "  served config.js, PINTAG fields only:"
          echo "$CFG" | grep -vE '^\s*//' | grep -E "env:|isProduction:|tag:|label:|renditionsEnabled:|supabaseUrl:" | sed 's/^/    /'

          echo ""
          echo "── 2. __ASSET_VERSION__ is substituted in served HTML ──────"
          for p in index.html listings.html listing.html admin.html agents.html; do
            H="$(get "https://pintag.io/$p")"
            # Every grep here ends in `|| true`: pipefail is on, and "no match"
            # is a RESULT to report, not a reason to abort the whole step.
            PLACE="$(printf '%s' "$H" | grep -c '__ASSET_VERSION__' || true)"
            N="$(printf '%s' "$H" | grep -o "?v=${SHA8}" | wc -l || true)"
            SEEN="$(printf '%s' "$H" | grep -oE '\?v=[A-Za-z0-9_]+' | sort -u | tr '\n' ' ' || true)"
            if [ "${PLACE:-0}" -gt 0 ]; then
              bad "$p: ${PLACE} unsubstituted __ASSET_VERSION__ placeholder(s) still present"
            elif [ "${N:-0}" -gt 0 ]; then
              ok "$p: 0 placeholders, ${N} asset URLs stamped ?v=${SHA8}"
            else
              bad "$p: placeholder gone but NO ?v=${SHA8} -- stamped from a different commit"
              echo "      stamps seen: ${SEEN:-(none)}"
            fi
          done

          echo ""
          echo "── 3. pruned pages are gone from the published artifact ────"
          for p in agent-login.html dashboard.html edit-listing.html add-property.html marketing-os.html; do
            C="$(curl -sS -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "https://pintag.io/$p")"
            [ "$C" = "404" ] && ok "$p -> $C" || bad "$p -> $C (expected 404)"
          done

          echo ""
          echo "── 4. public pages still serve ─────────────────────────────"
          for p in "" index.html listings.html listing.html agents.html for-agents.html admin.html config.js components.js image-renditions.js; do
            C="$(curl -sS -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "https://pintag.io/$p")"
            [ "$C" = "200" ] && ok "/$p -> $C" || bad "/$p -> $C (expected 200)"
          done

          echo ""
          echo "── 5. Pages configuration (read-only) ──────────────────────"
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '"  build_type=\(.build_type)  status=\(.status)  https_enforced=\(.https_enforced)  cname=\(.cname // "-")  source=\(.source // "-" | tostring)"' \
            || echo "  (pages API unreadable with this token)"
          echo "  latest build:"
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --jq '"    status=\(.status)  commit=\(.commit[0:8])  pusher=\(.pusher.login // "-")  updated=\(.updated_at)"' \
            || echo "    (unreadable)"

          echo ""
          echo "── 6. edge cache visibility ────────────────────────────────"
          curl -sS -D - -o /dev/null -H 'Cache-Control: no-cache' https://pintag.io/config.js \
            | grep -iE '^(cf-cache-status|age|server|cache-control|last-modified):' | sed 's/^/  /'

          echo ""
          if [ "$FAIL" -eq 0 ]; then
            echo "PRODUCTION ARTIFACT VERIFICATION: PASS"
          else
            echo "::error::PRODUCTION ARTIFACT VERIFICATION FAILED ($FAIL check(s))"
            exit 1
          fi

      # TEMPORARY: production smoke test of the rendition delivery flag.
      # Read-only: it loads the live site in a real browser and issues GETs.
      # It never writes to Storage or the database.
      - name: Where is production serving from (READ ONLY)
        run: node origin-diag.mjs

      - name: Which origin is behind pintag.io (READ ONLY)
        run: node pages-diag.mjs
        env:
          GH_TOKEN: ${{ github.token }}


      # ── TEMPORARY: prove the map fix against the REAL stored links ────
      # READ ONLY. The backfill runs in DRY RUN (no --apply, and no service-role
      # key is exported), so it resolves every short link and reports the
      # coordinate it would store without writing anything.
      - name: Map pin pipeline — unit tests + real-link resolution (READ ONLY)
        if: always()
        # `bash {0}` instead of GitHub's default `bash -e {0}`. This step's JOB
        # is to report commands that come back non-zero -- a curl that finds no
        # Location header, a grep that finds no match, a parse that yields no
        # coordinate. Under errexit the FIRST such result kills the step, so the
        # measurement destroys itself: run 32819146948 died on
        # `grep -i '^location:'` returning 1, which was not an error at all but
        # the very finding being measured (Google sent no Location for a Chrome
        # UA). Every verdict below is an explicit test, so errexit buys nothing
        # here and costs the whole step.
        shell: bash {0}
        # REF is used by the full-sweep branch, which had never executed before
        # -- it only runs once a method actually WINS, and until run 40 none
        # ever did. `set -u` then killed the step at the moment of success.
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -uo pipefail
          echo "── parser unit tests ───────────────────────────────────────"
          node --test tests/map-location/map-location.test.js 2>&1 | tail -12
          echo ""
          echo "── resolve every stored short link and parse it (DRY RUN) ──"
          node scripts/normalize-map-links.mjs 2>&1 | tee /tmp/normalize.log
          echo ""
          echo "── FULL 29-LINK SWEEP, categorised ─────────────────────────"
          # READ ONLY. Resolves every stored link with the proven method and
          # sorts the outcome into four DISJOINT buckets. The distinction that
          # matters is EXACT vs NAME_ONLY: both end on a google.com/maps URL and
          # both look like success to a naive check, but a name-only
          # destination (?q=<place name>&ftid=...) carries no coordinate and
          # must never be written back as if it were a location.
          cat > /tmp/judge.mjs <<'JS'
          import { createRequire } from 'node:module';
          import path from 'node:path';
          const M = createRequire(path.join(process.cwd(), 'noop.js'))('./map-location.js');
          const r = M.parseMapUrl(process.argv[2] || '');
          console.log(r.ok ? `COORD ${r.lat},${r.lng} ${r.pattern}` : `NONE ${r.reason}`);
          JS
          judge() { node /tmp/judge.mjs "$1" 2>/dev/null || echo "NONE judge-crashed"; }

          UA='PintagMapLinkResolver/1.0 (+https://pintag.io)'
          ANON="$(grep -oP "anonKey:\s*'\K[^']+" config.prod.js | head -1 || true)"
          curl -sS "https://${REF}.supabase.co/rest/v1/properties?select=slug,map_embed_url&map_embed_url=not.is.null&limit=400" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/links.json

          : > /tmp/exact.txt; : > /tmp/nameonly.txt; : > /tmp/unresolved.txt; : > /tmp/failed.txt
          TOTAL=0
          while IFS=$'\t' read -r slug link; do
            [ -n "$link" ] || continue
            TOTAL=$((TOTAL+1))
            OUT=$(curl -sS -m 25 -L -A "$UA" -o /dev/null \
                    -w '%{http_code}|%{url_effective}' "$link" 2>/dev/null || echo "000|")
            CODE=${OUT%%|*}; FINAL=${OUT#*|}
            V=$(judge "$FINAL")
            if [ "$CODE" = "000" ] || [ -z "$FINAL" ]; then
              printf '%s\t%s\tHTTP %s\n' "$slug" "$link" "$CODE" >> /tmp/failed.txt
            elif [ "${V%% *}" = "COORD" ]; then
              printf '%s\t%s\t%s\n' "$slug" "${V#COORD }" "$FINAL" >> /tmp/exact.txt
            else
              REASON=${V#NONE }
              case "$REASON" in
                unresolved-short-link) printf '%s\t%s\tHTTP %s\n' "$slug" "$FINAL" "$CODE" >> /tmp/unresolved.txt ;;
                *)                     printf '%s\t%s\t%s\n' "$slug" "$REASON" "$FINAL"  >> /tmp/nameonly.txt ;;
              esac
            fi
          done < <(python3 -c "
          import json
          for r in json.load(open('/tmp/links.json')):
              print(r['slug'] + chr(9) + (r.get('map_embed_url') or ''))
          ")

          E=$(wc -l < /tmp/exact.txt); N=$(wc -l < /tmp/nameonly.txt)
          U=$(wc -l < /tmp/unresolved.txt); F=$(wc -l < /tmp/failed.txt)

          echo ""
          echo "  ══ 1. EXACT COORDINATE ($E of $TOTAL) ══════════════════════"
          awk -F'\t' '{printf "    %-54s %s\n", substr($1,1,54), $2}' /tmp/exact.txt
          echo ""
          echo "  ══ 2. AMBIGUOUS / NAME-ONLY ($N) ═══════════════════════════"
          echo "     Resolved to a real Google destination that carries NO coordinate."
          echo "     These must NOT be written back as locations."
          awk -F'\t' '{printf "    %-54s %s\n      -> %s\n", substr($1,1,54), $2, substr($3,1,120)}' /tmp/nameonly.txt
          echo ""
          echo "  ══ 3. UNRESOLVED (still a short link) ($U) ═════════════════"
          awk -F'\t' '{printf "    %-54s %s  %s\n", substr($1,1,54), $3, substr($2,1,80)}' /tmp/unresolved.txt
          echo ""
          echo "  ══ 4. FAILED (request error) ($F) ══════════════════════════"
          awk -F'\t' '{printf "    %-54s %s  %s\n", substr($1,1,54), $3, substr($2,1,80)}' /tmp/failed.txt
          echo ""
          echo "  TOTALS: exact=$E  name-only=$N  unresolved=$U  failed=$F  (of $TOTAL)"
          if [ $((E+N+U+F)) -ne "$TOTAL" ]; then
            echo "::error::buckets do not sum to the total — the categorisation is wrong"
          fi

          echo ""
          echo "  spread of the EXACT set (the old markers occupied ~660m):"
          # $2 is "<lat>,<lng> <pattern>" -- take the two numbers only, or
          # float() chokes on the pattern name and (stderr being suppressed)
          # the whole spread block silently prints nothing.
          awk -F'\t' '{split($2,c,","); split(c[2],d," "); print c[1], d[1]}' /tmp/exact.txt | python3 -c "
          import sys
          pts=[tuple(map(float,l.split())) for l in sys.stdin if l.strip()]
          if pts:
              la=[p[0] for p in pts]; lo=[p[1] for p in pts]
              print(f'    lat {min(la):.6f}..{max(la):.6f}  ({(max(la)-min(la))*111:.1f} km)')
              print(f'    lng {min(lo):.6f}..{max(lo):.6f}  ({(max(lo)-min(lo))*106:.1f} km)')
              print(f'    distinct coordinates: {len(set(pts))} of {len(pts)}')
          "

      - name: Rendition smoke test against production
        run: |
          set -euo pipefail
          npm i -D @playwright/test@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node smoke-renditions.mjs
        env:
          REF: ${{ steps.ref.outputs.ref }}
