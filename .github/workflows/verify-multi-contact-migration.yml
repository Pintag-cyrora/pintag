name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Checks 1 + 2 — backfill and primary constraint (SELECT only)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::Missing secret SUPABASE_DB_PASSWORD."; exit 1
          fi
          # Session pooler; the direct db.<ref> host is IPv6-only on Supabase.
          PSQL="psql -h aws-0-ap-southeast-1.pooler.supabase.com -p 5432 -U postgres.${REF} -d postgres -v ON_ERROR_STOP=1 -X -A -F' | '"
          $PSQL -c "SET default_transaction_read_only = on;" >/dev/null

          echo "── schema objects ─────────────────────────────────────────"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT 'contacts.languages' AS object,
                   (SELECT data_type FROM information_schema.columns
                     WHERE table_name='contacts' AND column_name='languages') AS detail
            UNION ALL SELECT 'property_contacts table', to_regclass('public.property_contacts')::text
            UNION ALL SELECT 'idx_property_contacts_one_primary',
                   (SELECT indexdef FROM pg_indexes WHERE indexname='idx_property_contacts_one_primary');"

          echo ""
          echo "── CHECK 1: backfill counts ───────────────────────────────"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT
              (SELECT count(*) FROM properties WHERE contact_id IS NOT NULL) AS legacy_listings_with_contact_id,
              (SELECT count(*) FROM property_contacts)                        AS property_contacts_rows_total,
              (SELECT count(*) FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                 WHERE p.contact_id = pc.contact_id)                          AS backfilled_rows;"

          echo ""
          echo "  listings with a contact_id but NOT exactly one backfilled row (expect 0):"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT count(*) AS violations FROM (
              SELECT p.id FROM properties p
              LEFT JOIN property_contacts pc ON pc.property_id=p.id AND pc.contact_id=p.contact_id
              WHERE p.contact_id IS NOT NULL
              GROUP BY p.id HAVING count(pc.id) <> 1) t;"

          echo ""
          echo "── CHECK 2: primary + sort_order ──────────────────────────"
          echo "  backfilled rows NOT sort_order=0 (expect 0):"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT count(*) AS violations FROM property_contacts pc
            JOIN properties p ON p.id=pc.property_id
            WHERE p.contact_id=pc.contact_id AND pc.sort_order <> 0;"
          echo "  backfilled rows NOT is_primary (expect 0):"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT count(*) AS violations FROM property_contacts pc
            JOIN properties p ON p.id=pc.property_id
            WHERE p.contact_id=pc.contact_id AND pc.is_primary IS NOT TRUE;"
          echo "  listings with MORE THAN ONE primary (expect 0 — index enforces):"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT count(*) AS violations FROM (
              SELECT property_id FROM property_contacts WHERE is_primary
              GROUP BY property_id HAVING count(*) > 1) t;"

          echo ""
          echo "── inventory for the RLS checks ───────────────────────────"
          echo "  active/public listings with MORE THAN ONE contact:"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT p.slug, count(*) AS numbers FROM property_contacts pc
            JOIN properties p ON p.id=pc.property_id
            WHERE p.status IN ('active','available')
            GROUP BY p.slug HAVING count(*) > 1 ORDER BY 2 DESC LIMIT 5;"
          echo "  a contact reachable ONLY through a non-public listing:"
          $PSQL -c "SET default_transaction_read_only=on;
            SELECT c.id AS contact_id, right(c.phone,4) AS phone_last4
            FROM contacts c
            WHERE EXISTS (SELECT 1 FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                            WHERE pc.contact_id=c.id AND p.status NOT IN ('active','available'))
              AND NOT EXISTS (SELECT 1 FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                            WHERE pc.contact_id=c.id AND p.status IN ('active','available'))
              AND NOT EXISTS (SELECT 1 FROM properties p WHERE p.contact_id=c.id
                            AND p.status IN ('active','available'))
            LIMIT 3;"

      - name: Checks 3 + 4 — anonymous RLS through the real REST API
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The anon key is public (shipped in config.prod.js, visible in every
          # browser). Using it here is exactly what a visitor's browser does.
          ANON="$(grep -oP "anonKey:\s*'\K[^']+" config.prod.js | head -1)"
          [ -n "$ANON" ] || { echo "::error::Could not read anonKey from config.prod.js"; exit 1; }
          BASE="https://${REF}.supabase.co/rest/v1"
          SEL="select=slug,status,property_contacts(sort_order,is_primary,contacts(id,phone,languages))"

          echo "── CHECK 3: anon read of an ACTIVE listing's contacts ─────"
          curl -sS "${BASE}/properties?status=in.(active,available)&${SEL}&limit=400" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/anon_active.json
          python3 - <<'PY'
          import json,collections
          rows=json.load(open('/tmp/anon_active.json'))
          if isinstance(rows,dict):
              print("REST ERROR:",json.dumps(rows)[:400]); raise SystemExit(1)
          print(f"  active listings returned to anon: {len(rows)}")
          multi=[r for r in rows if len(r.get('property_contacts') or [])>1]
          print(f"  of those, listings exposing MORE THAN ONE contact: {len(multi)}")
          withdata=0
          for r in rows:
              for pc in (r.get('property_contacts') or []):
                  c=pc.get('contacts') or {}
                  if c.get('phone'): withdata+=1
          print(f"  join rows whose nested contact object actually carries a phone: {withdata}")
          for r in multi[:3]:
              print(f"  listing {r['slug']} ({r['status']}):")
              for pc in sorted(r['property_contacts'], key=lambda x: x.get('sort_order') or 0):
                  c=pc.get('contacts') or {}
                  ph=c.get('phone') or ''
                  print(f"    sort={pc.get('sort_order')} primary={pc.get('is_primary')} "
                        f"phone=***{ph[-4:] if ph else 'NONE'} languages={c.get('languages')}")
          json.dump({'multi':len(multi),'withdata':withdata,'total':len(rows)},open('/tmp/summary.json','w'))
          PY

          echo ""
          echo "── CHECK 4: anon must NOT see a draft-only contact ────────"
          curl -sS "${BASE}/properties?status=not.in.(active,available)&select=slug,status&limit=5" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/anon_draft.json
          echo "  non-public listings visible to anon (expect []):"
          head -c 300 /tmp/anon_draft.json; echo
          echo "  total contacts visible to anon vs total in the database:"
          curl -sS "${BASE}/contacts?select=id" -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" \
            -H "Prefer: count=exact" -H "Range: 0-0" -D /tmp/h.txt -o /dev/null
          grep -i '^content-range' /tmp/h.txt || true
