name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The pooler hostname is region-specific and must NOT be guessed — a
          # wrong region fails with a misleading "tenant/user not found". Ask the
          # Management API (read-only GET) for this project's real region, then
          # confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Cached-egress forensics — READ ONLY
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          q() { psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                  -v ON_ERROR_STOP=1 -X -A -F ' | ' -q -c "SET default_transaction_read_only=on;
          $1"; }

          echo "### 1A. BUCKETS"
          q "SELECT b.id AS bucket, b.public, count(o.id) AS objects,
                    pg_size_pretty(COALESCE(sum((o.metadata->>'size')::bigint),0)) AS total,
                    COALESCE(sum((o.metadata->>'size')::bigint),0) AS bytes,
                    pg_size_pretty(COALESCE(avg((o.metadata->>'size')::bigint),0)::bigint) AS avg_obj
             FROM storage.buckets b LEFT JOIN storage.objects o ON o.bucket_id=b.id
             GROUP BY b.id,b.public ORDER BY 5 DESC;"

          echo ""
          echo "### 1B. SIZE DISTRIBUTION — property-images"
          q "SELECT count(*) AS objects,
                    pg_size_pretty(sum(sz)) AS total, sum(sz) AS total_bytes,
                    pg_size_pretty(avg(sz)::bigint) AS avg,
                    pg_size_pretty(percentile_cont(0.5) WITHIN GROUP (ORDER BY sz)::bigint) AS median,
                    pg_size_pretty(percentile_cont(0.95) WITHIN GROUP (ORDER BY sz)::bigint) AS p95,
                    pg_size_pretty(percentile_cont(0.99) WITHIN GROUP (ORDER BY sz)::bigint) AS p99,
                    pg_size_pretty(max(sz)) AS max
             FROM (SELECT (metadata->>'size')::bigint AS sz FROM storage.objects
                   WHERE bucket_id='property-images' AND metadata->>'size' IS NOT NULL) t;"

          echo ""
          echo "### 1C. THRESHOLDS"
          q "SELECT '>1MB' AS band, count(*) FILTER (WHERE sz>1048576) AS n,
                    pg_size_pretty(COALESCE(sum(sz) FILTER (WHERE sz>1048576),0)) AS bytes FROM
               (SELECT (metadata->>'size')::bigint sz FROM storage.objects WHERE bucket_id='property-images') t
             UNION ALL SELECT '>2MB', count(*) FILTER (WHERE sz>2097152),
                    pg_size_pretty(COALESCE(sum(sz) FILTER (WHERE sz>2097152),0)) FROM
               (SELECT (metadata->>'size')::bigint sz FROM storage.objects WHERE bucket_id='property-images') t
             UNION ALL SELECT '>5MB', count(*) FILTER (WHERE sz>5242880),
                    pg_size_pretty(COALESCE(sum(sz) FILTER (WHERE sz>5242880),0)) FROM
               (SELECT (metadata->>'size')::bigint sz FROM storage.objects WHERE bucket_id='property-images') t
             UNION ALL SELECT '>10MB', count(*) FILTER (WHERE sz>10485760),
                    pg_size_pretty(COALESCE(sum(sz) FILTER (WHERE sz>10485760),0)) FROM
               (SELECT (metadata->>'size')::bigint sz FROM storage.objects WHERE bucket_id='property-images') t;"

          echo ""
          echo "### 1D. MIME / FORMAT DISTRIBUTION"
          q "SELECT COALESCE(metadata->>'mimetype','(none)') AS mime, count(*) AS n,
                    pg_size_pretty(sum((metadata->>'size')::bigint)) AS bytes,
                    pg_size_pretty(avg((metadata->>'size')::bigint)::bigint) AS avg
             FROM storage.objects WHERE bucket_id='property-images'
             GROUP BY 1 ORDER BY sum((metadata->>'size')::bigint) DESC;"

          echo ""
          echo "### 1E. LARGEST 20 OBJECTS"
          q "SELECT left(name,58) AS object, pg_size_pretty((metadata->>'size')::bigint) AS size,
                    metadata->>'mimetype' AS mime
             FROM storage.objects WHERE bucket_id='property-images'
             ORDER BY (metadata->>'size')::bigint DESC NULLS LAST LIMIT 20;"

          echo ""
          echo "### 3. IMAGES PER LISTING"
          q "SELECT round(avg(n),1) AS avg_imgs, percentile_cont(0.5) WITHIN GROUP (ORDER BY n) AS median,
                    max(n) AS max_imgs, count(*) AS listings_with_images
             FROM (SELECT property_id, count(*) n FROM property_images WHERE status='active' GROUP BY 1) t;"

          echo ""
          echo "  top 20 listings by TOTAL IMAGE BYTES:"
          q "SELECT left(COALESCE(p.slug,pi.property_id::text),46) AS listing, p.status,
                    count(*) AS imgs,
                    pg_size_pretty(COALESCE(sum(o.sz),0)) AS bytes
             FROM property_images pi
             LEFT JOIN properties p ON p.id=pi.property_id
             LEFT JOIN (SELECT name, (metadata->>'size')::bigint sz FROM storage.objects WHERE bucket_id='property-images') o
                    ON o.name=pi.storage_path
             WHERE pi.status='active'
             GROUP BY 1,2 ORDER BY COALESCE(sum(o.sz),0) DESC LIMIT 20;"

          echo ""
          echo "### 4. ORPHANS"
          q "SELECT 'storage objects with NO property_images row' AS kind, count(*) AS n,
                    pg_size_pretty(COALESCE(sum((o.metadata->>'size')::bigint),0)) AS bytes
             FROM storage.objects o
             WHERE o.bucket_id='property-images'
               AND NOT EXISTS (SELECT 1 FROM property_images pi WHERE pi.storage_path=o.name)
             UNION ALL
             SELECT 'property_images rows with NO storage object', count(*),
                    pg_size_pretty(0::bigint)
             FROM property_images pi
             WHERE NOT EXISTS (SELECT 1 FROM storage.objects o WHERE o.bucket_id='property-images' AND o.name=pi.storage_path)
             UNION ALL
             SELECT 'objects on non-public listings', count(*),
                    pg_size_pretty(COALESCE(sum((o.metadata->>'size')::bigint),0))
             FROM storage.objects o JOIN property_images pi ON pi.storage_path=o.name
             JOIN properties p ON p.id=pi.property_id
             WHERE o.bucket_id='property-images' AND p.status NOT IN ('active','available');"

          echo ""
          echo "### 5. DUPLICATES (sha256 in property_images)"
          q "SELECT count(*) AS dup_hash_groups,
                    COALESCE(sum(extra),0) AS redundant_copies
             FROM (SELECT sha256, count(*)-1 AS extra FROM property_images
                   WHERE sha256 IS NOT NULL GROUP BY sha256 HAVING count(*)>1) t;"
          echo "  how many property_images rows even HAVE a sha256:"
          q "SELECT count(*) FILTER (WHERE sha256 IS NOT NULL) AS with_hash,
                    count(*) FILTER (WHERE file_size IS NOT NULL) AS with_size,
                    count(*) AS total FROM property_images;"

          echo ""
          echo "### 9. REQUEST-LEVEL DATA availability"
          q "SELECT count(*) AS listing_events_image_related
             FROM listing_events WHERE event_type ILIKE '%image%' OR event_type ILIKE '%photo%' OR event_type ILIKE '%gallery%';"
