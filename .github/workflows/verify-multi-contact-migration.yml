name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      # TEMPORARY: production smoke test of the rendition delivery flag.
      # Read-only: it loads the live site in a real browser and issues GETs.
      # It never writes to Storage or the database.
      - name: Rendition smoke test against production
        run: |
          set -euo pipefail
          npm i -D @playwright/test@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node smoke-renditions.mjs
        env:
          REF: ${{ steps.ref.outputs.ref }}

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The pooler hostname is region-specific and must NOT be guessed — a
          # wrong region fails with a misleading "tenant/user not found". Ask the
          # Management API (read-only GET) for this project's real region, then
          # confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Phase 1 diagnostics — created_at semantics and contact identity
        id: phase1
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          d() {
            psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -F ' | ' -c "SET default_transaction_read_only=on;
          $1"
          }

          echo "── P1.1 column definition: nullable + default ─────────────"
          d "SELECT column_name, is_nullable, coalesce(column_default,'(none)') AS column_default
             FROM information_schema.columns
             WHERE table_schema='public' AND table_name='properties'
               AND column_name IN ('created_at','contact_id')
             ORDER BY column_name;"

          echo ""
          echo "── P1.2 how many properties have created_at IS NULL ───────"
          d "SELECT count(*) FILTER (WHERE created_at IS NULL) AS null_created_at,
                    count(*)                                   AS total_properties,
                    round(100.0*count(*) FILTER (WHERE created_at IS NULL)/nullif(count(*),0),1) AS pct_null
             FROM properties;"

          echo ""
          echo "  scope of the impact — NULL created_at broken out by status:"
          d "SELECT coalesce(status,'(null)') AS status,
                    count(*) FILTER (WHERE created_at IS NULL) AS null_created_at,
                    count(*)                                   AS total
             FROM properties GROUP BY 1 ORDER BY 2 DESC, 3 DESC;"

          echo ""
          echo "  earliest/latest created_at actually present (date semantics):"
          d "SELECT min(created_at) AS earliest, max(created_at) AS latest,
                    count(DISTINCT created_at::date) AS distinct_days
             FROM properties WHERE created_at IS NOT NULL;"

          echo ""
          echo "  candidate historical sources for a NULL-created_at row:"
          d "SELECT p.slug,
                    (SELECT min(lp.created_at) FROM listing_provenance lp WHERE lp.listing_id=p.id) AS first_provenance,
                    (SELECT min(pc.created_at) FROM property_contacts pc WHERE pc.property_id=p.id) AS first_link,
                    p.status_changed_at
             FROM properties p WHERE p.created_at IS NULL ORDER BY p.slug LIMIT 10;"

          echo ""
          echo "── P1.3 the two drift rows: is the contact REAL or the sentinel? ──"
          d "SELECT p.slug, p.contact_id,
                    (p.contact_id = '00000000-0000-0000-0000-0000000000c1') AS is_pending_sentinel,
                    c.role, c.name, right(c.phone,4) AS phone_last4,
                    c.languages,
                    (SELECT count(*) FROM properties o WHERE o.contact_id=c.id) AS shared_by_listings
             FROM properties p LEFT JOIN contacts c ON c.id=p.contact_id
             WHERE p.slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                              'listing-34e02f9b');"

          echo ""
          echo "  their full listing_provenance trail (who set contact_id, and when):"
          d "SELECT p.slug, lp.event_type, lp.field_name, lp.source, lp.actor, lp.created_at
             FROM listing_provenance lp JOIN properties p ON p.id=lp.listing_id
             WHERE p.slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                              'listing-34e02f9b')
             ORDER BY lp.created_at;" || echo "  (listing_provenance unreadable or absent)"

          echo ""
          echo "  when did the migration backfill run (min property_contacts.created_at)?"
          d "SELECT min(created_at) AS backfill_ran_at, count(*) AS rows FROM property_contacts;"

      - name: Checks 1 + 2 — backfill and primary constraint (SELECT only)
        id: db
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::Missing secret SUPABASE_DB_PASSWORD."; exit 1
          fi
          # A shell FUNCTION, not a string variable: the field separator is a
          # literal " | " and word-splitting an unquoted "$PSQL" would tear it
          # into three arguments.
          q() {
            psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -F ' | ' -c "SET default_transaction_read_only=on;
          $1"
          }
          # Tuples-only variant, for capturing a value rather than printing a table.
          q_raw() {
            psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -t -c "SET default_transaction_read_only=on;
          $1"
          }

          echo "── schema objects ─────────────────────────────────────────"
          q "SELECT 'contacts.languages' AS object,
                    (SELECT data_type FROM information_schema.columns
                      WHERE table_name='contacts' AND column_name='languages') AS detail
             UNION ALL SELECT 'property_contacts table', to_regclass('public.property_contacts')::text
             UNION ALL SELECT 'idx_property_contacts_one_primary',
                    (SELECT indexdef FROM pg_indexes WHERE indexname='idx_property_contacts_one_primary');"

          echo ""
          echo "── CHECK 1: backfill counts ───────────────────────────────"
          q "SELECT
               (SELECT count(*) FROM properties WHERE contact_id IS NOT NULL) AS legacy_listings_with_contact_id,
               (SELECT count(*) FROM property_contacts)                        AS property_contacts_rows_total,
               (SELECT count(*) FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                  WHERE p.contact_id = pc.contact_id)                          AS backfilled_rows;"

          echo ""
          echo "  listings with a contact_id but NOT exactly one backfilled row (expect 0):"
          q "SELECT count(*) AS violations FROM (
               SELECT p.id FROM properties p
               LEFT JOIN property_contacts pc ON pc.property_id=p.id AND pc.contact_id=p.contact_id
               WHERE p.contact_id IS NOT NULL
               GROUP BY p.id HAVING count(pc.id) <> 1) t;"

          echo ""
          echo "  WHICH listings, and when were they touched? A listing created or"
          echo "  edited AFTER the migration but BEFORE the admin UI shipped would"
          echo "  set properties.contact_id via the legacy path and never write the"
          echo "  join row — that is drift, not a bad backfill. created_at/updated_at"
          echo "  relative to the migration timestamp tells the two apart."
          # Optional columns are read through to_jsonb rather than named
          # directly: properties has no updated_at (a trigger references one,
          # but the column is not there), and naming a missing column aborts
          # the whole step — which is how the previous run starved check 4 of
          # its control group. An absent key yields NULL here instead.
          # `|| true` for the same reason: a diagnostic must never be able to
          # prevent the checks that follow it from running.
          q "SELECT p.slug, p.status, count(pc.id) AS join_rows,
                    p.created_at::date AS created,
                    (to_jsonb(p.*) ->> 'deleted_at') IS NOT NULL AS soft_deleted,
                    (p.created_at > timestamptz '2026-08-20 00:00:00+00') AS created_after_migration
             FROM properties p
             LEFT JOIN property_contacts pc ON pc.property_id=p.id AND pc.contact_id=p.contact_id
             WHERE p.contact_id IS NOT NULL
             GROUP BY p.id, p.slug, p.status, p.created_at
             HAVING count(pc.id) <> 1
             ORDER BY p.created_at;" || true

          echo ""
          echo "── CHECK 2: primary + sort_order ──────────────────────────"
          echo "  backfilled rows NOT sort_order=0 (expect 0):"
          q "SELECT count(*) AS violations FROM property_contacts pc
             JOIN properties p ON p.id=pc.property_id
             WHERE p.contact_id=pc.contact_id AND pc.sort_order <> 0;"
          echo "  backfilled rows NOT is_primary (expect 0):"
          q "SELECT count(*) AS violations FROM property_contacts pc
             JOIN properties p ON p.id=pc.property_id
             WHERE p.contact_id=pc.contact_id AND pc.is_primary IS NOT TRUE;"
          echo "  listings with MORE THAN ONE primary (expect 0 — index enforces):"
          q "SELECT count(*) AS violations FROM (
               SELECT property_id FROM property_contacts WHERE is_primary
               GROUP BY property_id HAVING count(*) > 1) t;"

          echo ""
          echo "── inventory for the RLS checks ───────────────────────────"
          echo "  active/public listings with MORE THAN ONE contact:"
          q "SELECT p.slug, count(*) AS numbers FROM property_contacts pc
             JOIN properties p ON p.id=pc.property_id
             WHERE p.status IN ('active','available')
             GROUP BY p.slug HAVING count(*) > 1 ORDER BY 2 DESC LIMIT 5;"
          echo "  a contact reachable ONLY through a non-public listing:"
          # These ids are the CONTROL GROUP for check 4. Counting how many
          # contacts anon can see proves nothing on its own; naming the rows
          # that MUST be absent and asserting their absence does.
          DRAFT_ONLY="$(q_raw "SELECT c.id FROM contacts c
             WHERE EXISTS (SELECT 1 FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                             WHERE pc.contact_id=c.id AND p.status NOT IN ('active','available'))
               AND NOT EXISTS (SELECT 1 FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                             WHERE pc.contact_id=c.id AND p.status IN ('active','available'))
               AND NOT EXISTS (SELECT 1 FROM properties p WHERE p.contact_id=c.id
                             AND p.status IN ('active','available'));" | tr -d ' ' | grep -E '^[0-9a-f-]{36}$' || true)"
          echo "$DRAFT_ONLY" | sed 's/^/    must stay hidden: /'
          echo "draft_only<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DRAFT_ONLY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "  total contacts in the database (compare with the anon count in check 4):"
          q "SELECT count(*) AS contacts_total FROM contacts;"

      - name: Checks 3 + 4 — anonymous RLS through the real REST API
        if: always()
        env:
          REF: ${{ steps.ref.outputs.ref }}
          DRAFT_ONLY: ${{ steps.db.outputs.draft_only }}
        run: |
          set -euo pipefail
          # The anon key is public (shipped in config.prod.js, visible in every
          # browser). Using it here is exactly what a visitor's browser does.
          ANON="$(grep -oP "anonKey:\s*'\K[^']+" config.prod.js | head -1)"
          [ -n "$ANON" ] || { echo "::error::Could not read anonKey from config.prod.js"; exit 1; }
          BASE="https://${REF}.supabase.co/rest/v1"
          SEL="select=slug,status,property_contacts(sort_order,is_primary,contacts(id,phone,languages))"

          echo "── CHECK 3: anon read of an ACTIVE listing's contacts ─────"
          curl -sS "${BASE}/properties?status=in.(active,available)&${SEL}&limit=400" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/anon_active.json
          python3 - <<'PY'
          import json,collections
          rows=json.load(open('/tmp/anon_active.json'))
          if isinstance(rows,dict):
              print("REST ERROR:",json.dumps(rows)[:400]); raise SystemExit(1)
          print(f"  active listings returned to anon: {len(rows)}")
          multi=[r for r in rows if len(r.get('property_contacts') or [])>1]
          print(f"  of those, listings exposing MORE THAN ONE contact: {len(multi)}")
          withdata=0
          for r in rows:
              for pc in (r.get('property_contacts') or []):
                  c=pc.get('contacts') or {}
                  if c.get('phone'): withdata+=1
          print(f"  join rows whose nested contact object actually carries a phone: {withdata}")
          for r in multi[:3]:
              print(f"  listing {r['slug']} ({r['status']}):")
              for pc in sorted(r['property_contacts'], key=lambda x: x.get('sort_order') or 0):
                  c=pc.get('contacts') or {}
                  ph=c.get('phone') or ''
                  print(f"    sort={pc.get('sort_order')} primary={pc.get('is_primary')} "
                        f"phone=***{ph[-4:] if ph else 'NONE'} languages={c.get('languages')}")
          json.dump({'multi':len(multi),'withdata':withdata,'total':len(rows)},open('/tmp/summary.json','w'))
          PY

          echo ""
          echo "── CHECK 4: anon must NOT see a draft-only contact ────────"
          curl -sS "${BASE}/properties?status=not.in.(active,available)&select=slug,status&limit=5" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/anon_draft.json
          echo "  non-public listings visible to anon (expect []):"
          head -c 300 /tmp/anon_draft.json; echo

          echo "  total contacts visible to anon:"
          curl -sS "${BASE}/contacts?select=id" -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" \
            -H "Prefer: count=exact" -H "Range: 0-0" -D /tmp/h.txt -o /dev/null
          grep -i '^content-range' /tmp/h.txt || true

          # The decisive assertion. A count comparison cannot prove containment;
          # naming the contacts that MUST be invisible and looking for them in
          # the anon response can. These ids came from the privileged query in
          # the previous step — each is reachable ONLY through a non-public
          # listing, so a visitor must never receive any of them.
          echo "  asserting the draft-only contacts are absent from the anon response:"
          printf '%s\n' "$DRAFT_ONLY" | grep -E '^[0-9a-f-]{36}$' > /tmp/draft_ids.txt || true
          curl -sS "${BASE}/contacts?select=id&limit=2000" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -o /tmp/anon_contacts.json
          python3 - <<'PY'
          import json
          ids=[l.strip() for l in open('/tmp/draft_ids.txt') if l.strip()]
          rows=json.load(open('/tmp/anon_contacts.json'))
          if isinstance(rows,dict):
              print("    REST ERROR:",json.dumps(rows)[:300]); raise SystemExit(1)
          visible={r['id'] for r in rows}
          if not ids:
              print("    NO CONTROL GROUP: the database has no draft-only contact, so"
                    "\n    check 4 has nothing to prove and is INCONCLUSIVE, not passed.")
              raise SystemExit(0)
          leaked=[i for i in ids if i in visible]
          for i in ids:
              print(f"    {i}  {'LEAKED — VISIBLE TO ANON' if i in visible else 'hidden (correct)'}")
          print(f"    anon sees {len(visible)} contacts; {len(leaked)} of {len(ids)} draft-only contacts leaked")
          if leaked:
              print("::error::RLS LEAK — a contact reachable only through a non-public listing is readable by anon.")
              raise SystemExit(1)
          PY
