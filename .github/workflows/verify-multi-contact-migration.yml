name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The pooler hostname is region-specific and must NOT be guessed — a
          # wrong region fails with a misleading "tenant/user not found". Ask the
          # Management API (read-only GET) for this project's real region, then
          # confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Storage audit — READ ONLY
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          q() { psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                  -v ON_ERROR_STOP=1 -X -A -F ' | ' -q -c "SET default_transaction_read_only=on;
          $1"; }

          echo "### A. DATABASE SIZE — the Free-plan metric"
          q "SELECT pg_size_pretty(pg_database_size(current_database())) AS db_size,
                    pg_database_size(current_database()) AS db_bytes,
                    round(100.0*pg_database_size(current_database())/(500*1024*1024),1) AS pct_of_500mb;"

          echo ""
          echo "### A2. size by schema (user data vs Supabase internals)"
          q "SELECT n.nspname AS schema, pg_size_pretty(sum(pg_total_relation_size(c.oid))) AS total,
                    sum(pg_total_relation_size(c.oid)) AS bytes
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind IN ('r','m','t','i')
             GROUP BY 1 ORDER BY 3 DESC LIMIT 12;"

          echo ""
          echo "### B. EVERY public TABLE: data / indexes / total"
          q "SELECT c.relname AS tbl,
                    pg_size_pretty(pg_table_size(c.oid))   AS data,
                    pg_size_pretty(pg_indexes_size(c.oid)) AS idx,
                    pg_size_pretty(pg_total_relation_size(c.oid)) AS total,
                    pg_total_relation_size(c.oid) AS bytes,
                    round(100.0*pg_total_relation_size(c.oid)/nullif(pg_database_size(current_database()),0),2) AS pct_db
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind='r' AND n.nspname='public'
             ORDER BY pg_total_relation_size(c.oid) DESC LIMIT 40;"

          echo ""
          echo "### C. TOP 20 INDEXES"
          q "SELECT i.relname AS idx, t.relname AS tbl,
                    pg_size_pretty(pg_relation_size(i.oid)) AS size, s.idx_scan AS scans
             FROM pg_class i JOIN pg_index ix ON ix.indexrelid=i.oid
             JOIN pg_class t ON t.oid=ix.indrelid
             JOIN pg_namespace n ON n.oid=i.relnamespace
             LEFT JOIN pg_stat_user_indexes s ON s.indexrelid=i.oid
             WHERE i.relkind='i' AND n.nspname='public'
             ORDER BY pg_relation_size(i.oid) DESC LIMIT 20;"

          echo ""
          echo "### D. DEAD TUPLES / BLOAT"
          q "SELECT relname AS tbl, n_live_tup AS live, n_dead_tup AS dead,
                    CASE WHEN n_live_tup+n_dead_tup>0 THEN round(100.0*n_dead_tup/(n_live_tup+n_dead_tup),1) ELSE 0 END AS dead_pct,
                    pg_size_pretty(pg_total_relation_size(relid)) AS size,
                    last_autovacuum
             FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 20;"

          echo ""
          echo "### E. TOAST — large JSON/text payloads"
          q "SELECT c.relname AS tbl,
                    pg_size_pretty(pg_total_relation_size(c.reltoastrelid)) AS toast,
                    pg_size_pretty(pg_relation_size(c.oid)) AS heap
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind='r' AND c.reltoastrelid<>0
               AND pg_total_relation_size(c.reltoastrelid)>0
             ORDER BY pg_total_relation_size(c.reltoastrelid) DESC LIMIT 15;"

          echo ""
          echo "### F. ROW COUNTS — history/event/log growth"
          q "SELECT relname AS tbl, n_live_tup AS live_rows,
                    pg_size_pretty(pg_total_relation_size(relid)) AS size, n_tup_ins AS inserts
             FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 25;"

          echo ""
          echo "### G. DUPLICATE INDEXES"
          q "SELECT indrelid::regclass AS tbl, count(*) AS copies,
                    string_agg(indexrelid::regclass::text,', ') AS idxs,
                    pg_size_pretty(sum(pg_relation_size(indexrelid))) AS combined
             FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
             GROUP BY indrelid, indkey, indclass, indexprs::text, indpred::text
             HAVING count(*)>1;"

          echo ""
          echo "### G2. never-scanned non-unique indexes"
          q "SELECT s.relname AS tbl, s.indexrelname AS idx,
                    pg_size_pretty(pg_relation_size(s.indexrelid)) AS size
             FROM pg_stat_user_indexes s JOIN pg_index i ON i.indexrelid=s.indexrelid
             WHERE s.idx_scan=0 AND NOT i.indisunique AND NOT i.indisprimary
             ORDER BY pg_relation_size(s.indexrelid) DESC LIMIT 15;"

      - name: Supabase-reported usage vs PostgreSQL — READ ONLY GETs
        # The audit measured pg_database_size at ~26 MB,約 5% of the Free
        # plan's 500 MB. If Supabase is warning, its number is measuring
        # something else (disk incl. WAL, or Storage buckets). These are
        # read-only GETs against the Management API with the token
        # apply-migration.yml already uses.
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "no token; skipping"; exit 0; }
          g() {
            echo "--- GET $1"
            curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                 "https://api.supabase.com$1" 2>/dev/null | head -c 1500 || true
            echo ""
          }
          g "/v1/projects/${REF}"
          ORG="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                 https://api.supabase.com/v1/organizations 2>/dev/null \
                 | jq -r '.[0].slug' 2>/dev/null || true)"
          echo "org slug: ${ORG:-<none>}"
          [ -n "${ORG:-}" ] && [ "$ORG" != "null" ] && g "/v1/organizations/${ORG}/usage" || true
