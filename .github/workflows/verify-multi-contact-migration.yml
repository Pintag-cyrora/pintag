name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The pooler hostname is region-specific and must NOT be guessed — a
          # wrong region fails with a misleading "tenant/user not found". Ask the
          # Management API (read-only GET) for this project's real region, then
          # confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Rendition storage sample — READ ONLY (downloads + encodes, uploads NOTHING)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq webp imagemagick >/dev/null 2>&1 || sudo apt-get install -y -qq webp >/dev/null

          # Stratified sample: the 3 largest, all PNGs, and a spread across the
          # size distribution, plus images from listings that carry many photos.
          psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres -X -A -t -q \
            -c "SET default_transaction_read_only=on;
                (SELECT name FROM storage.objects WHERE bucket_id='property-images'
                   AND metadata->>'mimetype'='image/png'
                 ORDER BY (metadata->>'size')::bigint DESC LIMIT 5)
                UNION
                (SELECT name FROM storage.objects WHERE bucket_id='property-images'
                 ORDER BY (metadata->>'size')::bigint DESC LIMIT 5)
                UNION
                (SELECT name FROM storage.objects WHERE bucket_id='property-images'
                   AND (metadata->>'size')::bigint BETWEEN 250000 AND 400000
                 ORDER BY random() LIMIT 8)
                UNION
                (SELECT name FROM storage.objects WHERE bucket_id='property-images'
                   AND (metadata->>'size')::bigint < 150000
                 ORDER BY random() LIMIT 6);" > /tmp/sample.txt
          sed -i '/^$/d' /tmp/sample.txt
          echo "sample objects: $(wc -l < /tmp/sample.txt)"

          BASE="https://${REF}.supabase.co/storage/v1/object/public/property-images"
          mkdir -p /tmp/w && : > /tmp/results.csv

          while read -r OBJ; do
            [ -n "$OBJ" ] || continue
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$OBJ")
            curl -sS -o /tmp/w/src "${BASE}/${ENC}" || continue
            ORIG=$(stat -c%s /tmp/w/src 2>/dev/null || echo 0)
            [ "$ORIG" -gt 1000 ] || continue
            DIM=$(identify -format "%wx%h" /tmp/w/src 2>/dev/null || echo "?")
            LINE="$OBJ,$ORIG,$DIM"
            for spec in "200 70" "400 75" "800 78" "1200 82"; do
              W=$(echo $spec | cut -d' ' -f1); Q=$(echo $spec | cut -d' ' -f2)
              convert /tmp/w/src -resize "${W}x>" -quality "$Q" -define webp:method=6 /tmp/w/out.webp 2>/dev/null || { LINE="$LINE,0"; continue; }
              LINE="$LINE,$(stat -c%s /tmp/w/out.webp)"
            done
            echo "$LINE" >> /tmp/results.csv
          done < /tmp/sample.txt

          echo ""
          echo "object,orig_bytes,dims,w200,w400,w800,w1200"
          cat /tmp/results.csv
          echo ""
          echo "=== TOTALS ==="
          python3 - <<'PY'
          rows=[l.strip().split(',') for l in open('/tmp/results.csv') if l.strip()]
          n=len(rows)
          orig=sum(int(r[1]) for r in rows)
          cols={'200':3,'400':4,'800':5,'1200':6}
          tot={k:sum(int(r[i]) for r in rows) for k,i in cols.items()}
          print(f"  images sampled      : {n}")
          print(f"  original bytes      : {orig:,} ({orig/1024/1024:.2f} MB)  avg {orig/n/1024:.0f} kB")
          for k in ['200','400','800','1200']:
              print(f"  webp {k:>4}px total   : {tot[k]:,} ({tot[k]/1024/1024:.2f} MB)  avg {tot[k]/n/1024:.0f} kB  = {100*tot[k]/orig:.1f}% of original")
          four=sum(tot.values()); three=tot['200']+tot['400']+tot['800']
          print(f"\n  4-size set (200/400/800/1200): {four:,} ({four/1024/1024:.2f} MB) = +{100*four/orig:.1f}% storage")
          print(f"  3-size set (200/400/1200)    : {tot['200']+tot['400']+tot['1200']:,} = +{100*(tot['200']+tot['400']+tot['1200'])/orig:.1f}% storage")
          LIB=540117759
          print(f"\n  EXTRAPOLATED to the full 515 MB library (1,599 objects):")
          print(f"    4-size: +{LIB*four/orig/1024/1024:.0f} MB   -> total {(LIB+LIB*four/orig)/1024/1024:.0f} MB")
          print(f"    3-size: +{LIB*(tot['200']+tot['400']+tot['1200'])/orig/1024/1024:.0f} MB")
          PY
