name: Verify multi-contact migration (production, read-only)

# Verifies migration 20260820000000_multi_phone_contacts.sql against the
# PRODUCTION database — and changes NOTHING.
#
# Why this exists: the release gate for this feature requires proving the
# backfill and the widened anon RLS policy in production, not locally. The
# anon policy in particular fails SILENTLY — a secondary contact number simply
# vanishes from the public response while admin still shows it — so it has to
# be exercised as a real anonymous caller.
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every statement is a SELECT. The psql session is additionally
#     pinned with `SET default_transaction_read_only = on`, so a write would
#     error rather than succeed even if one were introduced by mistake.
#   * Never applies, resets, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml uses) with the same dev-ref tripwire.
#   * PII: phone numbers are masked to their last 4 digits in the log. The
#     checks care about presence and language mapping, not the digits.
#   * The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # The pooler hostname is region-specific and must NOT be guessed — a
          # wrong region fails with a misleading "tenant/user not found". Ask the
          # Management API (read-only GET) for this project's real region, then
          # confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Phase 1 — created_at semantics + contact identity (SELECT only)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          d() { psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                  -v ON_ERROR_STOP=1 -X -A -F ' | ' -q -c "SET default_transaction_read_only=on;
          $1"; }

          echo "P1.1 column definition"
          d "SELECT column_name, is_nullable, coalesce(column_default,'(NO DEFAULT)') AS default_
             FROM information_schema.columns WHERE table_schema='public'
               AND table_name='properties' AND column_name IN ('created_at','contact_id')
             ORDER BY column_name;"

          echo ""
          echo "P1.2 how many rows have created_at IS NULL"
          d "SELECT count(*) FILTER (WHERE created_at IS NULL) AS null_created_at,
                    count(*) AS total,
                    round(100.0*count(*) FILTER (WHERE created_at IS NULL)/nullif(count(*),0),1) AS pct
             FROM properties;"
          echo "  by status:"
          d "SELECT coalesce(status,'(null)') AS status,
                    count(*) FILTER (WHERE created_at IS NULL) AS null_ca, count(*) AS total
             FROM properties GROUP BY 1 ORDER BY 2 DESC;"
          echo "  range of the created_at values that DO exist:"
          d "SELECT min(created_at)::date AS earliest, max(created_at)::date AS latest
             FROM properties WHERE created_at IS NOT NULL;"

          echo ""
          echo "P1.3 the two drift rows — REAL contact or the PENDING sentinel?"
          d "SELECT p.slug, (p.contact_id='00000000-0000-0000-0000-0000000000c1') AS is_sentinel,
                    c.role, c.name, right(c.phone,4) AS phone_last4, c.languages,
                    (SELECT count(*) FROM properties o WHERE o.contact_id=c.id) AS shared_by
             FROM properties p LEFT JOIN contacts c ON c.id=p.contact_id
             WHERE p.slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                              'listing-34e02f9b');"

      - name: Phase 4 — repair the two drift rows (AUTHORIZED WRITE)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          w() { psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                  -v ON_ERROR_STOP=1 -X -A -F ' | ' -q -c "$1"; }

          # REFUSE to promote the shared PENDING placeholder to a public
          # primary. It carries phone 0000000000 and the name "PENDING --
          # Pintag staff to confirm buyer contact"; linking it would advertise
          # a fake number as the listing's main contact.
          SENTINEL="$(w "SELECT count(*) FROM properties
                          WHERE slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                                         'listing-34e02f9b')
                            AND contact_id='00000000-0000-0000-0000-0000000000c1';" | tail -2 | head -1)"
          echo "  rows pointing at the PENDING sentinel: $SENTINEL"
          if [ "$SENTINEL" != "0" ]; then
            echo "::error::REFUSING to repair — a target listing points at the PENDING sentinel."
            exit 1
          fi

          echo "  applying the scoped, idempotent backfill:"
          w "INSERT INTO property_contacts (property_id, contact_id, sort_order, is_primary)
             SELECT p.id, p.contact_id, 0, true
             FROM properties p
             WHERE p.contact_id IS NOT NULL
               AND p.slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                              'listing-34e02f9b')
               AND NOT EXISTS (SELECT 1 FROM property_contacts pc WHERE pc.property_id = p.id)
             ON CONFLICT (property_id, contact_id) DO NOTHING;"

      - name: Check 1 re-verify after repair (SELECT only)
        if: always()
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          d() { psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                  -v ON_ERROR_STOP=1 -X -A -F ' | ' -q -c "SET default_transaction_read_only=on;
          $1"; }

          echo "CHECK 1 counts:"
          d "SELECT (SELECT count(*) FROM properties WHERE contact_id IS NOT NULL) AS with_contact_id,
                    (SELECT count(*) FROM property_contacts)                        AS link_rows,
                    (SELECT count(*) FROM property_contacts pc JOIN properties p ON p.id=pc.property_id
                       WHERE p.contact_id=pc.contact_id)                            AS matched;"
          echo "CHECK 1 violations (expect 0):"
          d "SELECT count(*) AS violations FROM (
               SELECT p.id FROM properties p
               LEFT JOIN property_contacts pc ON pc.property_id=p.id AND pc.contact_id=p.contact_id
               WHERE p.contact_id IS NOT NULL
               GROUP BY p.id HAVING count(pc.id) <> 1) t;"
          echo "the two repaired rows:"
          d "SELECT p.slug, pc.sort_order, pc.is_primary, right(c.phone,4) AS phone_last4
             FROM properties p
             JOIN property_contacts pc ON pc.property_id=p.id
             JOIN contacts c ON c.id=pc.contact_id
             WHERE p.slug IN ('modern-2-bedroom-house-near-lycee-francais-international-636385',
                              'listing-34e02f9b') ORDER BY p.slug, pc.sort_order;"
          echo "still exactly one primary per listing (expect 0):"
          d "SELECT count(*) AS violations FROM (
               SELECT property_id FROM property_contacts WHERE is_primary
               GROUP BY property_id HAVING count(*) > 1) t;"
