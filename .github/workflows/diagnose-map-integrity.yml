name: "DIAGNOSTIC: Production public-listing count vs original audit (read-only)"

# TEMPORARY, READ-ONLY diagnostic. NOT to be merged. Explains why the public listing
# count is 101 now versus 100 in the 2026-10-01T06:30Z audit (which was: 170 rows,
# 100 public, 70 excluded = 1 active soft-deleted + 2 archived + 64 draft + 3 draft soft-deleted).
#
# SAFETY (same pattern as the original diagnostic): SELECT only, no migration / apply /
# CLI path; static keyword + psql meta-command gate on every SQL file BEFORE any connection;
# BEGIN READ ONLY with transaction_read_only verified, ROLLBACK at the end; reuses the existing
# production-backup environment and PINTAG_PROD_DB_URL. Output: ids, slugs, status, timestamps only.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/diagnose-map-integrity

permissions:
  contents: read

concurrency:
  group: diagnose-map-integrity
  cancel-in-progress: false

jobs:
  diagnose:
    name: Public listing count vs audit (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup
    env:
      PINTAG_PROD_DB_URL: ${{ secrets.PINTAG_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify DB URL secret is present
        run: |
          if [ -z "${PINTAG_PROD_DB_URL:-}" ]; then
            echo "::error::Missing secret PINTAG_PROD_DB_URL in the production-backup environment."
            exit 1
          fi

      - name: Assemble the diagnostic SQL (SELECT only)
        run: |
          set -euo pipefail
          cat > d1.sql <<'Q'
          BEGIN READ ONLY;
          \pset border 2
          \pset pager off
          \echo === A0: session
          SELECT current_setting('transaction_read_only') AS transaction_read_only, current_user AS connected_role, now() AS now_utc;
          \echo === Q1: row counts NOW (audit at 2026-10-01 06:30Z: all=170 public=100 excluded=70)
          SELECT count(*) AS all_rows,
                 count(*) FILTER (WHERE status IN ('active','available') AND deleted_at IS NULL) AS public_rows,
                 count(*) FILTER (WHERE NOT (status IN ('active','available') AND deleted_at IS NULL)) AS excluded_rows
          FROM properties;
          \echo === Q2: status x soft-deleted NOW (audit excluded: active+deleted=1, archived=2, draft=64, draft+deleted=3)
          SELECT status, (deleted_at IS NOT NULL) AS soft_deleted, count(*) AS listings
          FROM properties GROUP BY 1, 2 ORDER BY 1, 2;
          \echo === Q3: every soft-deleted row NOW
          SELECT id, slug, status, market_status, deleted_at, status_changed_at
          FROM properties WHERE deleted_at IS NOT NULL ORDER BY deleted_at;
          \echo === Q4: public rows whose status_changed_at is NULL or newer than the audit
          SELECT id, slug, status, market_status, deleted_at, status_changed_at, market_status_changed_at
          FROM properties
          WHERE status IN ('active','available') AND deleted_at IS NULL
            AND (status_changed_at IS NULL OR status_changed_at > timestamptz '2026-10-01 06:30:03+00')
          ORDER BY slug;
          ROLLBACK;
          Q
          cat > d2.sql <<'Q'
          BEGIN READ ONLY;
          \pset border 2
          \pset pager off
          \echo === S1: row snapshots by operation
          SELECT op, count(*) AS snapshots, min(created_at) AS first_at, max(created_at) AS last_at
          FROM properties_row_snapshots GROUP BY op ORDER BY op;
          \echo === S2: snapshots taken since 2026-09-20, with whether the listing is public NOW
          SELECT s.property_id AS id, p.slug, s.op, s.created_at AS snapshot_at,
                 s.row_data->>'status' AS status_in_snapshot,
                 s.row_data->>'deleted_at' IS NOT NULL AS was_soft_deleted_in_snapshot,
                 (p.id IS NOT NULL AND p.status IN ('active','available') AND p.deleted_at IS NULL) AS public_now
          FROM properties_row_snapshots s LEFT JOIN properties p ON p.id = s.property_id
          WHERE s.created_at > timestamptz '2026-09-20 00:00:00+00'
          ORDER BY s.created_at DESC LIMIT 40;
          \echo === S3: listings that were soft-deleted per a snapshot and are PUBLIC now (i.e. restored)
          SELECT s.property_id AS id, p.slug, s.op, s.created_at AS snapshot_at, p.status, p.deleted_at
          FROM properties_row_snapshots s JOIN properties p ON p.id = s.property_id
          WHERE s.op = 'soft_delete' AND p.status IN ('active','available') AND p.deleted_at IS NULL
          ORDER BY s.created_at DESC;
          ROLLBACK;
          Q

      - name: Safety gate (static, before any connection)
        run: |
          set -euo pipefail
          for f in d1.sql d2.sql; do
            BAD_META=$(grep -nE '[\\]' "$f" | grep -vE '^[0-9]+:[[:space:]]*[\\](pset|set|echo|if|else|endif|q|timing|gset)([[:space:]]|$)' || true)
            if [ -n "$BAD_META" ]; then echo "$BAD_META"; echo "::error::$f meta-command outside the allow-list"; exit 1; fi
            if grep -vE '^[[:space:]]*[\\]' "$f" | grep -inE '\b(CREATE|ALTER|DROP|GRANT|REVOKE|INSERT|UPDATE|DELETE|TRUNCATE|COPY|CALL|DO|VACUUM|ANALYZE|ANALYSE|REINDEX|CLUSTER|REFRESH|LOCK|SET|RESET|EXECUTE|PREPARE|MERGE|COMMENT|LISTEN|NOTIFY|DISCARD|IMPORT|LOAD|REASSIGN|SAVEPOINT|COMMIT|INTO)\b'; then
              echo "::error::$f contains a write/DDL keyword"; exit 1
            fi
            grep -qE '^BEGIN READ ONLY;$' "$f" || { echo "::error::$f missing BEGIN READ ONLY"; exit 1; }
            [ "$(grep -vE '^[[:space:]]*$' "$f" | tail -n1)" = "ROLLBACK;" ] || { echo "::error::$f must end with ROLLBACK;"; exit 1; }
            echo "OK: $f"
          done

      - name: Fail closed unless the connection is READ ONLY
        run: |
          set -euo pipefail
          RO=$(psql "$PINTAG_PROD_DB_URL" -X -tA -c "BEGIN READ ONLY; SELECT current_setting('transaction_read_only'); ROLLBACK;" | grep -E '^(on|off)$' | head -n1)
          echo "transaction_read_only reports: '$RO'"
          [ "$RO" = "on" ] || { echo "::error::cannot confirm READ ONLY"; exit 1; }

      - name: Run diagnostic (SELECT only)
        run: |
          set -uo pipefail
          psql "$PINTAG_PROD_DB_URL" -X -v ON_ERROR_STOP=1 -f d1.sql 2>&1 | tee report.txt
          echo; echo "##### snapshots (may be unreadable by this role; that is reported, not fatal)"
          psql "$PINTAG_PROD_DB_URL" -X -v ON_ERROR_STOP=1 -f d2.sql 2>&1 | tee -a report.txt || echo "(snapshot queries failed; see above)"
