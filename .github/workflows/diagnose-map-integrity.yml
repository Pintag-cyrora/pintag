name: "DIAGNOSTIC: Production map/location integrity (read-only)"

# TEMPORARY, READ-ONLY diagnostic. Answers, with live evidence, whether every
# PUBLIC listing (status IN ('active','available') AND deleted_at IS NULL)
# actually yields a map pin, and why not when it does not.
#
# The map's source of truth is properties.map_embed_url (a Google Maps link),
# parsed in the browser by map-location.js. This workflow:
#   1. classifies every properties row with a SQL transcription of that parser
#      (same patterns, same order, same Laos bounds) -- the query validated
#      locally against the real parser on synthetic rows;
#   2. re-classifies the SAME rows with the REAL map-location.js in Node and
#      reports any disagreement, so "what the SQL says" and "what the frontend
#      will do" cannot silently differ;
#   3. reports suspicious-but-"valid" pins (outside the real Laos extent, the
#      generic/default Vientiane pins, exact duplicate pins).
#
# SAFETY (all load-bearing, same pattern as the earlier analytics diagnostic):
#   - SELECT / catalog inspection only. There is NO migration, apply,
#     supabase CLI, or write path anywhere in this workflow.
#   - Static safety gate BEFORE any connection, applied to EVERY generated SQL
#     file: psql meta-commands are allow-listed and the SQL may not contain any
#     write/DDL/maintenance keyword. Either failure aborts before psql connects.
#   - BEGIN READ ONLY is opened on the real connection and the job fails closed
#     unless transaction_read_only reports 'on'. The report re-checks it as its
#     first query and quits otherwise. Every script ends with ROLLBACK.
#   - Reuses the EXISTING production-backup environment and its EXISTING
#     PINTAG_PROD_DB_URL secret. No new credential.
#   - Privacy: output is limited to property id, slug, province/district, status,
#     parser reason, parsed coordinates and a URL PREFIX with its query string
#     removed. A value that is not a URL is never echoed (only its length).
#     No owner, contact, price or lead data is selected. The raw rows used for
#     the parser cross-check live only on the runner's disk, are never printed,
#     and are not uploaded.
#   - Does not modify any other workflow, migration, or application code.
#
# TRIGGERS: push to this exact diagnostic branch (fires the single run this
# exists for) and workflow_dispatch. Never scheduled. NOT to be merged.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/diagnose-map-integrity

permissions:
  contents: read

concurrency:
  group: diagnose-map-integrity
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect map/location integrity (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backup
    env:
      PINTAG_PROD_DB_URL: ${{ secrets.PINTAG_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify DB URL secret is present
        run: |
          if [ -z "${PINTAG_PROD_DB_URL:-}" ]; then
            echo "::error::Missing secret PINTAG_PROD_DB_URL in the production-backup environment."
            exit 1
          fi

      - name: Assemble the diagnostic SQL (SELECT / catalog inspection only)
        run: |
          set -euo pipefail

          # The classification CTE: one row per properties row. No SQL comments
          # in the generated files on purpose -- the safety gate scans them.
          cat > cte.sql <<'SQL_EOF'
          WITH base AS (
            SELECT id, slug, province_en, district_en, status, workflow_status, market_status,
                   owner_id, managed_by_party_id, deleted_at, map_embed_url,
                   COALESCE(status IN ('active','available') AND deleted_at IS NULL, false) AS is_public
            FROM public.properties
          ), parsed AS (
            SELECT b.*,
              regexp_match(map_embed_url, '!3d(-?[0-9]+(?:[.][0-9]+)?)!4d(-?[0-9]+(?:[.][0-9]+)?)') AS m_pin,
              regexp_match(map_embed_url, '!2d(-?[0-9]+(?:[.][0-9]+)?)!3d(-?[0-9]+(?:[.][0-9]+)?)') AS m_embed,
              regexp_match(map_embed_url, '[?&](?:q|query|ll|center|destination|daddr|sll)=(-?[0-9]+(?:[.][0-9]+)?)(?:%2C|,)(-?[0-9]+(?:[.][0-9]+)?)', 'i') AS m_q,
              regexp_match(map_embed_url, '/maps/(?:search|dir/?)/(?:[^/]*/)?(-?[0-9]+(?:[.][0-9]+)?),(-?[0-9]+(?:[.][0-9]+)?)') AS m_path,
              regexp_match(map_embed_url, '[/@](-?[0-9]+(?:[.][0-9]+)?),(-?[0-9]+(?:[.][0-9]+)?)(?:,[0-9.]+[a-z])?') AS m_cam
            FROM base b
          ), picked AS (
            SELECT p.*,
              CASE WHEN m_pin IS NOT NULL THEN 'place-pin'
                   WHEN m_embed IS NOT NULL THEN 'embed'
                   WHEN m_q IS NOT NULL THEN 'query-param'
                   WHEN m_path IS NOT NULL THEN 'path-coords'
                   WHEN m_cam IS NOT NULL THEN 'camera' END AS pin_source,
              CASE WHEN m_pin IS NOT NULL THEN m_pin[1]::float8
                   WHEN m_embed IS NOT NULL THEN m_embed[2]::float8
                   WHEN m_q IS NOT NULL THEN m_q[1]::float8
                   WHEN m_path IS NOT NULL THEN m_path[1]::float8
                   WHEN m_cam IS NOT NULL THEN m_cam[1]::float8 END AS lat,
              CASE WHEN m_pin IS NOT NULL THEN m_pin[2]::float8
                   WHEN m_embed IS NOT NULL THEN m_embed[1]::float8
                   WHEN m_q IS NOT NULL THEN m_q[2]::float8
                   WHEN m_path IS NOT NULL THEN m_path[2]::float8
                   WHEN m_cam IS NOT NULL THEN m_cam[2]::float8 END AS lng
            FROM parsed p
          ), classified AS (
            SELECT *,
              CASE
                WHEN map_embed_url IS NULL OR btrim(map_embed_url) = '' THEN 'no-url'
                WHEN map_embed_url !~* '^[[:space:]]*https?://' THEN 'not-a-url'
                WHEN map_embed_url ~* '^[[:space:]]*https?://(maps[.]app[.]goo[.]gl|goo[.]gl|g[.]co)(/|[?]|#|$)' THEN 'unresolved-short-link'
                WHEN lat IS NULL THEN 'no-coordinates'
                WHEN lat BETWEEN 13.5 AND 23.0 AND lng BETWEEN 99.5 AND 108.5 THEN 'ok'
                WHEN lng BETWEEN 13.5 AND 23.0 AND lat BETWEEN 99.5 AND 108.5 THEN 'reversed-coordinates'
                WHEN lat NOT BETWEEN -90 AND 90 OR lng NOT BETWEEN -180 AND 180 THEN 'out-of-range'
                ELSE 'outside-bounds'
              END AS map_state,
              CASE
                WHEN map_embed_url IS NULL OR btrim(map_embed_url) = '' THEN '(none)'
                WHEN map_embed_url !~* '^[[:space:]]*https?://' THEN '(not a URL: ' || length(map_embed_url) || ' chars)'
                ELSE left(regexp_replace(btrim(map_embed_url), '[?#].*$', ''), 70)
              END AS url_prefix
            FROM picked
          )
          SQL_EOF

          # section <title> : stdin is the final SELECT, run over the classified CTE.
          section() {
            printf '%s\n' "\\echo '=== $1 ==='" >> diagnose.sql
            cat cte.sql >> diagnose.sql
            cat >> diagnose.sql
            printf ';\n\n' >> diagnose.sql
          }

          cat > diagnose.sql <<'SQL_EOF'
          \pset border 2
          \pset pager off
          \set ON_ERROR_STOP on

          BEGIN READ ONLY;

          \echo '=== A0: SESSION - connected role, read-only confirmation ==='
          SELECT current_user AS connected_role,
                 current_setting('server_version') AS server_version,
                 current_setting('transaction_read_only') AS transaction_read_only,
                 (SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user) AS role_bypasses_rls,
                 (SELECT rolsuper FROM pg_roles WHERE rolname = current_user) AS role_is_superuser,
                 to_char(now() AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"') AS reference_now_utc;

          SELECT (current_setting('transaction_read_only') = 'on') AS ro_on
          \gset
          \if :ro_on
            \echo 'OK: transaction_read_only = on'
          \else
            \echo 'ABORT: transaction is NOT read only - stopping before any listing query'
            \q
          \endif

          \echo '=== A1: properties columns the map depends on ==='
          SELECT column_name, data_type
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'properties'
            AND column_name IN ('map_embed_url','latitude','longitude','province_en','district_en','deleted_at','status','workflow_status','market_status')
          ORDER BY column_name;

          \echo '=== A2: RLS policies on properties (what an anonymous visitor is allowed to read) ==='
          SELECT policyname, cmd, roles, qual
          FROM pg_policies
          WHERE schemaname = 'public' AND tablename = 'properties'
          ORDER BY policyname;

          \echo '=== A3: latitude / longitude columns - are they populated at all? (only if they exist) ==='
          SELECT (SELECT count(*) FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'properties' AND column_name IN ('latitude','longitude')) = 2 AS has_latlng
          \gset
          \if :has_latlng
            SELECT count(*) AS properties_rows,
                   count(*) FILTER (WHERE latitude IS NOT NULL OR longitude IS NOT NULL) AS rows_with_latitude_or_longitude
            FROM public.properties;
          \else
            \echo 'no latitude/longitude columns on properties: map_embed_url is the only location source'
          \endif

          SQL_EOF

          section "Q1: HEADLINE - public listings and whether each gets a map pin" <<'Q'
          SELECT count(*) FILTER (WHERE is_public) AS public_listings_total,
                 count(*) FILTER (WHERE is_public AND map_state = 'ok') AS public_with_valid_coordinates,
                 count(*) FILTER (WHERE is_public AND map_state <> 'ok') AS public_without_a_pin,
                 (count(*) FILTER (WHERE is_public AND map_state <> 'ok') = 0) AS every_public_listing_gets_a_marker,
                 count(*) FILTER (WHERE NOT is_public) AS excluded_listings_total,
                 count(*) AS all_rows
          FROM classified
          Q

          section "Q2: PUBLIC listings by parser outcome (ok = a marker is placed)" <<'Q'
          SELECT map_state, count(*) AS public_listings
          FROM classified WHERE is_public
          GROUP BY map_state
          ORDER BY (map_state = 'ok') DESC, count(*) DESC, map_state
          Q

          section "Q3: EXCLUDED (not public) by status and soft-delete state - kept out of the public-map count" <<'Q'
          SELECT coalesce(status, '(null)') AS status, (deleted_at IS NOT NULL) AS soft_deleted,
                 count(*) AS listings,
                 count(*) FILTER (WHERE map_state = 'ok') AS with_valid_coordinates
          FROM classified WHERE NOT is_public
          GROUP BY 1, 2
          ORDER BY 1, 2
          Q

          section "Q4: EVERY PUBLIC LISTING WITHOUT A PIN (identifiers only; URL shown as a prefix with no query string)" <<'Q'
          SELECT id, slug, province_en, district_en, status, market_status, map_state,
                 url_prefix,
                 CASE WHEN map_state = 'not-a-url' THEN NULL ELSE lat END AS lat,
                 CASE WHEN map_state = 'not-a-url' THEN NULL ELSE lng END AS lng
          FROM classified
          WHERE is_public AND map_state <> 'ok'
          ORDER BY map_state, province_en NULLS FIRST, slug
          Q

          section "Q5a: valid pins by the pattern that produced them (camera = lowest authority: the viewport, not the place)" <<'Q'
          SELECT pin_source, count(*) AS public_listings
          FROM classified WHERE is_public AND map_state = 'ok'
          GROUP BY pin_source ORDER BY count(*) DESC
          Q

          section "Q5b: SUSPICIOUS pins the validator accepts - outside the real Laos extent, or a generic/default Vientiane pin" <<'Q'
          SELECT id, slug, province_en, district_en, pin_source, lat, lng,
                 CASE
                   WHEN lat < 13.9 OR lat > 22.6 OR lng < 100.0 OR lng > 107.7 THEN 'outside real Laos extent (inside the validator box)'
                   WHEN abs(lat - 17.960) < 0.0006 AND abs(lng - 102.630) < 0.0006 THEN 'old MAP_CENTER default 17.960,102.630'
                   WHEN abs(lat - 17.9757) < 0.0006 AND abs(lng - 102.6331) < 0.0006 THEN 'generic Google Vientiane pin'
                 END AS suspicion
          FROM classified
          WHERE is_public AND map_state = 'ok'
            AND ( lat < 13.9 OR lat > 22.6 OR lng < 100.0 OR lng > 107.7
               OR (abs(lat - 17.960) < 0.0006 AND abs(lng - 102.630) < 0.0006)
               OR (abs(lat - 17.9757) < 0.0006 AND abs(lng - 102.6331) < 0.0006) )
          ORDER BY slug
          Q

          section "Q5c: DUPLICATE pins - several public listings on exactly the same coordinate (6 dp)" <<'Q'
          SELECT round(lat::numeric, 6) AS lat, round(lng::numeric, 6) AS lng,
                 count(*) AS listings,
                 count(DISTINCT owner_id) AS distinct_owners,
                 count(DISTINCT managed_by_party_id) AS distinct_managers,
                 count(DISTINCT province_en) AS distinct_provinces,
                 array_agg(slug ORDER BY slug) AS slugs
          FROM classified
          WHERE is_public AND map_state = 'ok'
          GROUP BY 1, 2
          HAVING count(*) > 1
          ORDER BY count(*) DESC, 1, 2
          Q

          section "Q5d: pins per province (informational: lets a human spot a pin far from its province)" <<'Q'
          SELECT coalesce(province_en, '(null)') AS province,
                 count(*) AS public_listings,
                 count(*) FILTER (WHERE map_state = 'ok') AS with_valid_pin,
                 min(lat) FILTER (WHERE map_state = 'ok') AS min_lat,
                 max(lat) FILTER (WHERE map_state = 'ok') AS max_lat,
                 min(lng) FILTER (WHERE map_state = 'ok') AS min_lng,
                 max(lng) FILTER (WHERE map_state = 'ok') AS max_lng
          FROM classified WHERE is_public
          GROUP BY 1 ORDER BY 1
          Q

          printf 'ROLLBACK;\n' >> diagnose.sql

          # export.sql: one JSON document of the rows, for the Node cross-check
          # against the REAL map-location.js. It stays on the runner's disk.
          { printf 'BEGIN READ ONLY;\n'; cat cte.sql; cat <<'SQL_EOF'
          SELECT json_agg(json_build_object('id', id, 'slug', slug, 'is_public', is_public,
                                            'sql_state', map_state, 'sql_lat', lat, 'sql_lng', lng,
                                            'url', map_embed_url) ORDER BY slug)
          FROM classified;
          ROLLBACK;
          SQL_EOF
          } > export.sql

          echo "diagnose.sql: $(wc -l < diagnose.sql) lines; export.sql: $(wc -l < export.sql) lines."

      - name: "Safety gate: refuse to run if any SQL is anything but read-only"
        run: |
          set -euo pipefail
          echo "================================================================"
          echo " SAFETY GATE -- scanning every generated SQL file BEFORE any connection."
          echo "================================================================"
          for f in diagnose.sql export.sql; do
            echo "--- $f ---"
            # 1. psql meta-commands: only an explicit allow-list may appear, and
            #    only at the start of a line. Anything else (\!, \i, \copy,
            #    \gexec, \o, \w, ...) can run shell or SQL the keyword scan
            #    cannot see. The SQL itself must carry no backslash at all.
            BAD_META=$(grep -nE '[\\]' "$f" \
              | grep -vE '^[0-9]+:[[:space:]]*[\\](pset|set|echo|if|else|endif|q|timing|gset)([[:space:]]|$)' || true)
            if [ -n "$BAD_META" ]; then
              echo "$BAD_META"
              echo "::error::$f contains a psql meta-command outside the allow-list. Refusing to run."
              exit 1
            fi
            # 2. Write / DDL / maintenance / session-mutation keywords in the SQL
            #    proper (meta-command lines are constrained above).
            if grep -vE '^[[:space:]]*[\\]' "$f" \
               | grep -inE '\b(CREATE|ALTER|DROP|GRANT|REVOKE|INSERT|UPDATE|DELETE|TRUNCATE|COPY|CALL|DO|VACUUM|ANALYZE|ANALYSE|REINDEX|CLUSTER|REFRESH|LOCK|SET|RESET|EXECUTE|PREPARE|MERGE|COMMENT|LISTEN|NOTIFY|DISCARD|IMPORT|LOAD|REASSIGN|SAVEPOINT|COMMIT|INTO)\b'; then
              echo "::error::$f contains a write/DDL/maintenance keyword (matched above). Refusing to run -- this workflow is READ-ONLY by design."
              exit 1
            fi
            # 3. Must open a READ ONLY transaction and end with ROLLBACK.
            grep -qE '^BEGIN READ ONLY;$' "$f" || { echo "::error::$f missing BEGIN READ ONLY"; exit 1; }
            [ "$(grep -vE '^[[:space:]]*$' "$f" | tail -n1)" = "ROLLBACK;" ] || { echo "::error::$f must end with ROLLBACK;"; exit 1; }
            echo "OK: meta-commands allow-listed, no write/DDL keywords, BEGIN READ ONLY ... ROLLBACK present."
          done

      - name: "Fail closed unless the connection can actually be made READ ONLY"
        run: |
          set -euo pipefail
          RO=$(psql "$PINTAG_PROD_DB_URL" -X -tA -c "BEGIN READ ONLY; SELECT current_setting('transaction_read_only'); ROLLBACK;" | grep -E '^(on|off)$' | head -n1)
          echo "transaction_read_only reports: '$RO'"
          if [ "$RO" != "on" ]; then
            echo "::error::Could not confirm a READ ONLY transaction against production (got '$RO'). Refusing to proceed."
            exit 1
          fi
          echo "OK: connection confirmed read-only."

      - name: Run diagnostic (SELECT / catalog inspection only)
        run: |
          set -euo pipefail
          echo "================================================================"
          echo " READ-ONLY DIAGNOSTIC -- map/location integrity. No writes."
          echo "================================================================"
          psql "$PINTAG_PROD_DB_URL" -X -v ON_ERROR_STOP=1 -f diagnose.sql 2>&1 | tee diagnostic-report.txt

      - name: "Cross-check: the REAL map-location.js vs the SQL classification, on the same rows"
        run: |
          set -euo pipefail
          psql "$PINTAG_PROD_DB_URL" -X -qtA -v ON_ERROR_STOP=1 -f export.sql > export-raw.txt
          grep -m1 '^\[' export-raw.txt > rows.json || echo '[]' > rows.json
          cat > crosscheck.js <<'JS_EOF'
          const fs = require('fs');
          const M = require('./map-location.js');
          const rows = JSON.parse(fs.readFileSync('rows.json', 'utf8')) || [];
          let stateMismatch = 0, coordMismatch = 0, pub = 0, pubMarkers = 0;
          const lines = [];
          const jsByReason = {};
          for (const r of rows) {
            const js = M.parseMapUrl(r.url);
            const jsState = js.ok ? 'ok' : js.reason;
            if (r.is_public) {
              pub++;
              if (js.ok) pubMarkers++;
              else jsByReason[jsState] = (jsByReason[jsState] || 0) + 1;
            }
            if (jsState !== r.sql_state) {
              stateMismatch++;
              lines.push('STATE MISMATCH  ' + r.slug + ' (' + r.id + ')  sql=' + r.sql_state + '  real-parser=' + jsState + '  public=' + r.is_public);
            } else if (js.ok && (Math.abs(js.lat - r.sql_lat) > 1e-9 || Math.abs(js.lng - r.sql_lng) > 1e-9)) {
              coordMismatch++;
              lines.push('COORD MISMATCH  ' + r.slug + ' (' + r.id + ')  sql=' + r.sql_lat + ',' + r.sql_lng + '  real-parser=' + js.lat + ',' + js.lng);
            }
          }
          console.log('rows compared (all properties rows)                 : ' + rows.length);
          console.log('public rows                                          : ' + pub);
          console.log('public rows the REAL parser places a marker for      : ' + pubMarkers);
          console.log('public rows the REAL parser cannot place (by reason) : ' + JSON.stringify(jsByReason));
          console.log('SQL-vs-real-parser state mismatches                  : ' + stateMismatch);
          console.log('SQL-vs-real-parser coordinate mismatches             : ' + coordMismatch);
          lines.forEach(l => console.log(l));
          console.log(stateMismatch + coordMismatch === 0
            ? 'RESULT: the SQL classification and the real frontend parser agree on every row.'
            : 'RESULT: DISAGREEMENT -- the real parser is authoritative for what the frontend does; see lines above.');
          JS_EOF
          node crosscheck.js 2>&1 | tee crosscheck-report.txt
          rm -f rows.json export-raw.txt

      - name: Publish findings to the job summary
        if: always()
        run: |
          {
            echo "# Production map/location integrity diagnostic"
            echo ""
            echo "Read-only SELECT inspection. No writes were made to production."
            echo ""
            echo '```'
            cat diagnostic-report.txt 2>/dev/null || echo "(did not run)"
            echo ""
            echo "=== Q6: real map-location.js vs SQL classification ==="
            cat crosscheck-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: map-integrity-diagnostic
          path: |
            diagnostic-report.txt
            crosscheck-report.txt
          retention-days: 30
