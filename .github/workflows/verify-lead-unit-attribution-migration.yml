name: Verify lead-unit-attribution migration (production, read-only)

# Verifies migration 20260921000000_lead_unit_attribution.sql against the
# PRODUCTION database and the PRODUCTION PostgREST API — and changes NOTHING.
#
# Why this exists: the 2026-09-21 incident review established that
# components.js has sent lead_events.unit_type_id/unit_id since 2026-09-21,
# that the migration adding those columns was applied to production on
# 2026-09-25 (Apply DB Migration run #14), and that a local regression suite
# (tests/security/regression/run-lead-unit-attribution-pg.sh) proves the
# trigger logic is correct on a throwaway cluster. What Check 3 verifies is
# whether PRODUCTION's live PostgREST layer actually recognizes the new
# columns in its schema cache — done with two anon-key, read-only GET
# probes (see Check 3's own comments for why a GET alone is decisive here,
# with no write of any kind needed).
#
# SAFETY MODEL
#   * Manual only (workflow_dispatch). No push or schedule trigger.
#   * READ ONLY. Every SQL statement is a SELECT, and the psql session is
#     additionally pinned with `SET default_transaction_read_only = on`, so a
#     write would error rather than succeed even if one were introduced by
#     mistake. Every HTTP call is a GET.
#   * Creates NO lead, NO lead_events row, NO leads row, and writes NO other
#     production data.
#   * Never applies, resets, alters, or pushes a migration.
#   * PRODUCTION ref is read from config.prod.js (the same single source of
#     truth apply-migration.yml and verify-multi-contact-migration.yml use)
#     with the same dev-ref tripwire.
#   * Credentials are the existing SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD
#     repository secrets already used by verify-multi-contact-migration.yml
#     (same pooler-resolution pattern) — no new credential is introduced.
#     The anon key is NOT a secret — it is the public key already shipped in
#     config.prod.js and visible in every browser.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_REF: 'ebtgoqrywdywuqrvudcp'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve PRODUCTION project ref from config.prod.js
        id: ref
        run: |
          set -euo pipefail
          REF="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')"
          [ -n "$REF" ] || { echo "::error::Could not resolve production ref."; exit 1; }
          [ "$REF" != "${DEV_REF}" ] || { echo "::error::Resolved ref is DEV. Refusing."; exit 1; }
          ANON="$(grep -oP "anonKey:\s*'\K[^']+" config.prod.js | head -1)"
          [ -n "$ANON" ] || { echo "::error::Could not read anonKey from config.prod.js"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::PRODUCTION project ref: $REF (read-only)"

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the pooler endpoint for this project
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # Same resolution logic as verify-multi-contact-migration.yml: ask
          # the Management API (read-only GET) for this project's real region,
          # then confirm the candidate host actually answers before using it.
          REGION=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            REGION="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$REF" 'if type=="array" then (.[] | select(.id==$ref) | .region) else empty end' \
              2>/dev/null | head -1 || true)"
            if [ "$REGION" = "null" ]; then REGION=""; fi
          fi
          if [ -n "$REGION" ]; then
            echo "::notice title=Region::Management API reports region $REGION"
            CANDIDATES="aws-0-${REGION}.pooler.supabase.com aws-1-${REGION}.pooler.supabase.com"
          else
            echo "::warning::Could not resolve the region from the Management API; probing known regions."
            CANDIDATES=""
            for r in ap-southeast-1 ap-southeast-2 ap-northeast-1 us-east-1 us-west-1 eu-central-1 eu-west-2; do
              CANDIDATES="$CANDIDATES aws-0-${r}.pooler.supabase.com aws-1-${r}.pooler.supabase.com"
            done
          fi
          HOST=""
          for h in $CANDIDATES; do
            if PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" PGCONNECT_TIMEOUT=10 \
               psql -h "$h" -p 5432 -U "postgres.${REF}" -d postgres -X -t -A \
                    -c "SELECT 1" >/dev/null 2>&1; then
              HOST="$h"; break
            fi
          done
          [ -n "$HOST" ] || { echo "::error::No pooler host accepted a connection for ref ${REF}."; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "::notice title=Pooler::$HOST (session mode, port 5432)"

      - name: Check 1 — lead_events / leads columns exist (SELECT only)
        id: columns
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Set via the connection's startup options rather than an inline
          # `SET ...;` statement prefixed onto every query: a `SET` executed
          # as part of a multi-statement -c string prints its own "SET"
          # command tag even under -t/-A, which would corrupt a psql -t
          # value meant to be parsed as a single bare number (as q_raw()
          # below does). PGOPTIONS applies the GUC before any query runs and
          # emits no output of its own, so -t output stays exactly the
          # query's own result. Read-only is still enforced identically — a
          # write still errors, verified before use in this PR.
          PGOPTIONS: '-c default_transaction_read_only=on'
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::Missing secret SUPABASE_DB_PASSWORD."; exit 1
          fi
          q() {
            psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -F ' | ' -c "$1"
          }
          q_raw() {
            psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -t -c "$1"
          }

          echo "── lead_events / leads column existence ───────────────────"
          q "SELECT table_name, column_name, data_type, is_nullable
             FROM information_schema.columns
             WHERE table_schema='public'
               AND table_name IN ('lead_events','leads')
               AND column_name IN ('unit_type_id','unit_id')
             ORDER BY table_name, column_name;"

          MISSING=""
          for pair in "lead_events:unit_type_id" "lead_events:unit_id" "leads:unit_type_id" "leads:unit_id"; do
            tbl="${pair%%:*}"; col="${pair##*:}"
            FOUND="$(q_raw "SELECT count(*) FROM information_schema.columns
                            WHERE table_schema='public' AND table_name='$tbl' AND column_name='$col';" | tr -d ' ')"
            if [ "$FOUND" != "1" ]; then
              MISSING="$MISSING $tbl.$col"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing column(s) in production:$MISSING"
            exit 1
          fi
          echo "PASS — all four columns exist in production: lead_events.unit_type_id, lead_events.unit_id, leads.unit_type_id, leads.unit_id"

      - name: Check 2 — create_lead_from_event() carries the new unit fields (SELECT only)
        id: function
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: '-c default_transaction_read_only=on'
          REF: ${{ steps.ref.outputs.ref }}
          PGHOST_POOLER: ${{ steps.pooler.outputs.host }}
        run: |
          set -euo pipefail
          # pg_get_functiondef() is a read-only catalog function — it returns
          # the function's source text, it does not execute the function.
          DEF="$(psql -h "$PGHOST_POOLER" -p 5432 -U "postgres.${REF}" -d postgres \
                 -v ON_ERROR_STOP=1 -X -A -t -c "
          SELECT pg_get_functiondef(p.oid)
          FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
          WHERE n.nspname='public' AND p.proname='create_lead_from_event';")"

          if [ -z "$DEF" ]; then
            echo "::error::create_lead_from_event() not found in production."
            exit 1
          fi

          echo "$DEF" > /tmp/create_lead_from_event.sql
          MISSING=""
          echo "$DEF" | grep -q 'unit_type_id' || MISSING="$MISSING unit_type_id"
          echo "$DEF" | grep -q 'NEW\.unit_id\|unit_id' || MISSING="$MISSING unit_id"
          if [ -n "$MISSING" ]; then
            echo "::error::create_lead_from_event() is missing reference(s) to:$MISSING"
            echo "── live definition ──"
            cat /tmp/create_lead_from_event.sql
            exit 1
          fi
          echo "PASS — create_lead_from_event() references both unit_type_id and unit_id."
          {
            echo "### create_lead_from_event() — live production definition"
            echo '```sql'
            cat /tmp/create_lead_from_event.sql
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check 3 — PostgREST schema-cache recognition (GET only, no INSERT)
        if: always()
        env:
          REF: ${{ steps.ref.outputs.ref }}
          ANON: ${{ steps.ref.outputs.anon }}
        run: |
          set -euo pipefail
          BASE="https://${REF}.supabase.co"

          # This check intentionally uses ONLY table-level GET probes with
          # the anon key — the same key components.js uses in the browser.
          # An earlier version of this check also tried GET /rest/v1/ (the
          # bare root) with `Accept: application/openapi+json`, reasoning
          # that PostgREST's own OpenAPI/schema document would show whether
          # a column is in its cache. That request is not usable here: it
          # returns HTTP 401 "Invalid API key" / "Only the `service_role`
          # API key can be used for this endpoint" for the anon key on this
          # project (confirmed by a dedicated diagnostic run against
          # production), regardless of Accept header. Using service_role
          # instead would defeat the point of this check, which is
          # specifically what the browser's anon-key client sees — so that
          # path has been removed rather than worked around.
          #
          # The table-level probe below is decisive on its own: PostgREST
          # must resolve every column named in `select=` against its live
          # schema cache BEFORE it can plan or execute the query. If a
          # requested column is not in the cache, PostgREST refuses the
          # request with a specific, recognizable error (PGRST204 / "column
          # ... does not exist" / 42703). RLS and table/column grants govern
          # which ROWS anon may read (a separate question already covered
          # by Check 1's direct information_schema query) — they do not,
          # and cannot, turn a successfully parsed select list into a
          # schema-cache miss.
          #
          # That gives exactly two DECISIVE outcomes, each proven by direct
          # evidence:
          #   * HTTP 200 — PostgREST fully parsed AND executed the query,
          #     which is only possible if every requested column resolved.
          #     This alone proves recognition, regardless of body content
          #     (empty array or real rows both prove the same thing here).
          #   * An explicit missing-column/schema-cache-miss body (PGRST204
          #     / "column ... does not exist" / 42703) — proves the opposite.
          # Anything else (a non-200 status that is NOT an explicit
          # schema-cache-miss response — e.g. an unrelated 401/403 from the
          # API gateway, a 5xx, a timeout, or a malformed/empty body) is
          # proof of NEITHER: the request never reached a state that says
          # anything about the schema cache one way or the other. Silently
          # treating that as a pass (as an earlier version of this check
          # did, by only checking for the miss signature) is precisely the
          # deceptively convenient failure mode this check exists to avoid
          # — an unrelated auth/gateway failure could otherwise be mistaken
          # for evidence the columns are fine. That case is therefore its
          # own outcome, UNVERIFIED, and fails the check closed rather than
          # passing it: proven-safe (200) and proven-broken (explicit miss)
          # are the only two ways to earn a result other than UNVERIFIED.
          #
          # limit=0 additionally guarantees no row content is ever
          # transferred, on top of this being a pure GET.
          echo "── PostgREST select probe (GET, anon key, limit=0) ──"
          HTTP_CODE_LE="$(curl -sS -o /tmp/le_select.json -w '%{http_code}' \
            "${BASE}/rest/v1/lead_events?select=unit_type_id,unit_id&limit=0" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}")"
          echo "lead_events select probe: HTTP $HTTP_CODE_LE"
          cat /tmp/le_select.json; echo

          HTTP_CODE_L="$(curl -sS -o /tmp/l_select.json -w '%{http_code}' \
            "${BASE}/rest/v1/leads?select=unit_type_id,unit_id&limit=0" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}")"
          echo "leads select probe: HTTP $HTTP_CODE_L"
          cat /tmp/l_select.json; echo

          # Three-way classification per probe — see the header comment
          # above for the full reasoning:
          #   * RESOLVED       — HTTP 200. Decisive proof PostgREST executed
          #                      the query, which requires every requested
          #                      column to already be in its schema cache.
          #   * SCHEMA_CACHE_MISS — not 200, and the body carries an explicit
          #                      missing-column/schema-cache-miss signature.
          #                      Decisive proof the column is NOT recognized.
          #   * UNVERIFIED     — neither of the above (an unrelated
          #                      401/403/5xx/timeout/malformed body). Proves
          #                      nothing either way; never treated as a pass.
          # HTTP status is checked FIRST and unconditionally settles RESOLVED
          # before the body is ever inspected for a miss signature.
          classify() {
            local http_code="$1"
            local body="$2"
            if [ "$http_code" = "200" ]; then
              echo "RESOLVED"
            elif echo "$body" | grep -qiE 'does not exist|PGRST204|42703'; then
              echo "SCHEMA_CACHE_MISS"
            else
              echo "UNVERIFIED"
            fi
          }
          LE_CLASS="$(classify "$HTTP_CODE_LE" "$(cat /tmp/le_select.json)")"
          L_CLASS="$(classify "$HTTP_CODE_L" "$(cat /tmp/l_select.json)")"
          echo "lead_events probe classification: $LE_CLASS"
          echo "leads probe classification: $L_CLASS"

          {
            echo "### PostgREST schema-cache check"
            echo ""
            echo "- lead_events select probe: HTTP $HTTP_CODE_LE, classification \`$LE_CLASS\`"
            echo "- leads select probe: HTTP $HTTP_CODE_L, classification \`$L_CLASS\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Decisive FAIL: at least one probe hit an explicit, recognizable
          # schema-cache-miss response — direct evidence the column is
          # missing from PostgREST's cache.
          if [ "$LE_CLASS" = "SCHEMA_CACHE_MISS" ] || [ "$L_CLASS" = "SCHEMA_CACHE_MISS" ]; then
            echo "::error::PostgREST's schema cache does NOT recognize the requested column(s) — explicit evidence of a miss. See the summary above for exactly which probe failed."
            {
              echo ""
              echo "**FAIL**: PostgREST returned an explicit missing-column/schema-cache-miss response for at least one table. See the job log for which probe and its exact response body."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # UNVERIFIED, fails closed: at least one probe was neither a clean
          # 200 nor an explicit miss (an unrelated auth/gateway failure, a
          # 5xx, a timeout, a malformed/empty response, etc). This is NOT
          # evidence the columns are missing — do not report it as such —
          # but it is also not evidence they were resolved, so it must never
          # be treated as a pass.
          if [ "$LE_CLASS" = "UNVERIFIED" ] || [ "$L_CLASS" = "UNVERIFIED" ]; then
            echo "::error::Schema-cache recognition could NOT be established — at least one probe returned neither a clean HTTP 200 nor an explicit schema-cache-miss response (see the HTTP status and body above). This is inconclusive, not evidence of a miss; failing closed rather than assuming success."
            {
              echo ""
              echo "**UNVERIFIED**: at least one select probe returned an unexpected, non-200, non-schema-miss response (see HTTP status/body above — e.g. an unrelated auth/gateway failure, a 5xx, or a malformed response). Schema-cache recognition could not be established either way. Treated as a failing result, not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "PASS — both PostgREST select probes returned HTTP 200; the schema cache recognizes the requested columns."
          {
            echo ""
            echo "**PASS**: both PostgREST select probes returned HTTP 200 — the schema cache recognizes unit_type_id/unit_id."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
