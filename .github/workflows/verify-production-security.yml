name: Verify Production Security

# Answers the one question repository inspection cannot: does the PRODUCTION
# system actually enforce the security model this repository describes?
#
# The 2026-08-03 breach happened because production carried dashboard-created
# policies no migration file described, and the first storage lockdown was a
# silent no-op because it dropped policies BY NAME. "The migration is in Git"
# has already proven not to be evidence. This workflow is the evidence.
#
# ENTIRELY READ-ONLY. Two independent probes:
#
#   1. scripts/verify-production-security.sql — catalog inspection over a
#      read-only DB connection: RLS coverage, every policy, view execution
#      mode, SECURITY DEFINER gating, function grants, migration ledger.
#      Reads no customer data and prints no identities — counts and object
#      names only.
#   2. scripts/verify-production-http.sh — probes the deployed surface as an
#      unauthenticated attacker with nothing but the public anon key: sign-up
#      state, internal tables, privileged RPCs, the write boundary, storage,
#      Edge Function auth, security headers, and whether the XSS fix is
#      actually deployed.
#
# Neither writes, deletes, or modifies anything. The sign-up check reads
# /auth/v1/settings rather than attempting a registration, so it cannot leave a
# real account behind on a project where sign-up turns out to be open.
#
# NOT run on pull_request — it consumes secrets, and a PR can edit the scripts
# it executes (the lesson from the audit's F-07 finding).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC — catch drift within a week

permissions:
  contents: read

concurrency:
  group: verify-production-security
  cancel-in-progress: false

jobs:
  verify:
    name: Production security drift check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required for PINTAG_PROD_DB_URL to resolve at all: it is an Environment
    # secret on production-backup, not a repository secret. Without this the
    # value arrives empty and the "Database catalog" step reports
    # "SKIPPED: secret PINTAG_PROD_DB_URL is not set" — which is exactly what
    # this workflow has been doing, and why the catalog drift check has never
    # run. Scoping it to the environment rather than the repository keeps the
    # credential out of every other workflow's reach.
    environment: production-backup
    env:
      # Same read-only connection secret monitoring.yml and image-integrity.yml
      # already use. If it is scoped to a read-only role, this workflow is
      # incapable of writing even by accident.
      PINTAG_PROD_DB_URL: ${{ secrets.PINTAG_PROD_DB_URL }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://pintag.io' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client curl

      # The production project ref and anon key come from config.prod.js, the
      # same single source of truth apply-migration.yml and deploy-functions.yml
      # read. The anon key is public by design, so this needs no extra secret.
      - name: Resolve production project from config.prod.js
        id: cfg
        run: |
          set -euo pipefail
          URL="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.prod.js | head -1)"
          KEY="$(grep -oE 'eyJ[A-Za-z0-9._-]+' config.prod.js | head -1)"
          [ -n "$URL" ] || { echo "::error::could not resolve the production Supabase URL"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::could not resolve the production anon key"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::$URL"

      - name: HTTP surface — probe as an unauthenticated attacker
        id: http
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ steps.cfg.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.cfg.outputs.key }}
        run: |
          set -o pipefail
          bash scripts/verify-production-http.sh 2>&1 | tee http-report.txt

      # Phase 9 — prove the XSS fix is not merely PRESENT but EFFECTIVE on the
      # live pages: download listing.html/admin.html from production, extract
      # the escJs() actually shipped there, and run the full attack-payload
      # suite against that copy through a real HTML attribute decode. Read-only
      # (two GETs); no payload is ever written to the database.
      - name: XSS fix proven against the live pages
        id: xss
        continue-on-error: true
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          set -o pipefail
          node scripts/verify-production-xss.mjs 2>&1 | tee xss-report.txt

      # The admin-lockdown matrix. Optional: runs only if the credentials are
      # configured. The critical case (allowlisted admin, password-only session,
      # no TOTP -> DENIED) needs no TOTP secret, because a password-only sign-in
      # yields exactly an aal1 session. Never runs on pull_request (see the
      # header), so the F-07 concern about PR-controlled scripts does not apply.
      - name: Admin lockdown matrix (optional — needs ADMIN_EMAIL/ADMIN_PASSWORD)
        id: matrix
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ steps.cfg.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.cfg.outputs.key }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/verify-admin-lockdown.sh 2>&1 | tee matrix-report.txt

      - name: Database catalog — drift against the repository security model
        id: db
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -z "${PINTAG_PROD_DB_URL:-}" ]; then
            echo "SKIPPED: secret PINTAG_PROD_DB_URL is not set." | tee db-report.txt
            echo "The HTTP probe still ran, but policy//view/function drift cannot be" >> db-report.txt
            echo "checked without a read-only database connection." >> db-report.txt
            exit 1
          fi
          psql "$PINTAG_PROD_DB_URL" -v ON_ERROR_STOP=1 \
            -f scripts/verify-production-security.sql 2>&1 | tee db-report.txt

      - name: Publish report
        if: always()
        run: |
          {
            echo "# Production security verification"
            echo ""
            echo "Target: \`${{ steps.cfg.outputs.url }}\` · Site: \`$SITE_URL\`"
            echo "Commit: \`${GITHUB_SHA::8}\`"
            echo ""
            echo "## HTTP surface (unauthenticated attacker's view)"
            echo '```'
            cat http-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo ""
            echo "## Database catalog (drift vs the repository)"
            echo '```'
            cat db-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo ""
            echo "## XSS fix — live payload proof"
            echo '```'
            cat xss-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo ""
            echo "## Admin lockdown matrix"
            echo '```'
            cat matrix-report.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-security-verification
          path: |
            http-report.txt
            db-report.txt
            matrix-report.txt
            xss-report.txt
          retention-days: 90

      # Fail the run if EITHER probe found drift, so this shows up as a red
      # check rather than a report nobody opens.
      - name: Fail on drift
        if: always()
        run: |
          http='${{ steps.http.outcome }}'
          db='${{ steps.db.outcome }}'
          matrix='${{ steps.matrix.outcome }}'
          xss='${{ steps.xss.outcome }}'
          echo "http probe:   $http"
          echo "db probe:     $db"
          echo "admin matrix: $matrix"
          echo "xss proof:    $xss"
          if [ "$http" != "success" ] || [ "$db" != "success" ] || [ "$matrix" != "success" ] || [ "$xss" != "success" ]; then
            echo "::error::Production does NOT match the repository security model — see the job summary."
            exit 1
          fi
          echo "Production matches the repository security model."
