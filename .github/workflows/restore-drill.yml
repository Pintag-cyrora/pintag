name: DR Restore Drill

# "A backup that has never been restored does not count as a backup."
# (Never Again rule #3/#4; audit 2026-08-06.)
#
# Quarterly (and on demand): pull the LATEST backup snapshot from R2, restore
# it into a scratch Postgres container, run scripts/restore-validation.sql,
# and compare row counts against the counts recorded AT BACKUP TIME
# (metadata/backup.json). Any mismatch fails the run — which notifies.
# The job timeout doubles as the RTO check: a drill that can't finish inside
# it is a failed drill.
#
# Key model: backups are age-encrypted to ops/backup.age.pub, which may list
# TWO recipients — the OFFLINE master key (disaster use, never in CI) and a
# dedicated DRILL key whose private half lives only in the protected
# production-backup environment as BACKUP_AGE_DRILL_KEY. See ops/README.md.

on:
  schedule:
    - cron: '0 4 2 1,4,7,10 *'    # quarterly: Jan/Apr/Jul/Oct, 2nd, 04:00 UTC
  workflow_dispatch:
    inputs:
      backup:
        description: 'Backup dir name (backup-YYYY-MM-DD); empty = latest'
        required: false

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 60           # the drill-scale RTO bound
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PINTAG_RESTORE_DB_URL: postgresql://postgres:drill@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client rclone age

      - name: Locate and download the backup snapshot
        id: pick
        run: |
          PICK="${{ github.event.inputs.backup }}"
          if [ -z "$PICK" ]; then
            PICK=$(rclone lsd "R2:$R2_BUCKET" | awk '{print $NF}' | grep '^backup-' | sort | tail -1)
          fi
          test -n "$PICK" || { echo "::error::No backup-* snapshot found in R2 — has backup.yml ever succeeded?"; exit 1; }
          echo "Using $PICK"
          echo "dir=$PICK" >> "$GITHUB_OUTPUT"
          rclone copy "R2:$R2_BUCKET/$PICK" "./$PICK" --transfers 8

      - name: Decrypt with the drill key
        env:
          BACKUP_AGE_DRILL_KEY: ${{ secrets.BACKUP_AGE_DRILL_KEY }}
        run: |
          test -n "$BACKUP_AGE_DRILL_KEY" || { echo "::error::BACKUP_AGE_DRILL_KEY secret not set (see ops/README.md)"; exit 1; }
          umask 077 && printf '%s\n' "$BACKUP_AGE_DRILL_KEY" > ./backup-age-key.txt

      - name: Seed scratch DB stubs (Supabase-managed schemas the public dump references)
        run: |
          psql "$PINTAG_RESTORE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Roles that RLS policies in the dump are written TO:
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          -- Supabase-managed schemas the public schema references. Stubs only:
          -- the drill validates OUR data + policies, not Supabase's platform.
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY, email text, created_at timestamptz, last_sign_in_at timestamptz);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql AS 'select null::uuid';
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql AS 'select null::jsonb';
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.objects (bucket_id text, name text, metadata jsonb);
          CREATE SCHEMA IF NOT EXISTS supabase_migrations;
          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text, name text);
          SQL
          # admin_accounts FK needs the admin row's auth.users id to exist;
          # seed ids from the backup's reference export when present.
          REF="./${{ steps.pick.outputs.dir }}/database/reference/auth_users.csv"
          if [ -f "$REF" ]; then
            psql "$PINTAG_RESTORE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "\copy auth.users (id,email,created_at,last_sign_in_at) FROM '$REF' WITH (FORMAT csv, HEADER true)" || true
          fi

      - name: Restore + validate (fail-closed report)
        run: |
          START=$(date +%s)
          AGE_KEY=./backup-age-key.txt \
            bash scripts/restore-production.sh --backup "./${{ steps.pick.outputs.dir }}"
          END=$(date +%s)
          echo "Drill restore+validation took $(( (END-START)/60 ))m $(( (END-START)%60 ))s (RTO bound: job timeout 60m)"

      - name: Record drill result
        if: always()
        run: |
          echo "## DR Restore Drill — ${{ steps.pick.outputs.dir }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }} · run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
