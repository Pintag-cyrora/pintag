<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src https://*.supabase.co; frame-src 'none'; object-src 'none';">
<title>ແກ້ໄຂອະສັງຫາ • Pintag</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#F5F1EB;
  --panel:#FFFFFF;
  --line:#E7E1DA;
  --text:#17242B;
  --muted:#7C8B92;
  --teal:#4C9494;
  --danger:#B45B5B;
  --radius:28px;
}

body{
  font-family:'Noto Sans Lao',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:24px 16px 120px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.page-title{
  font-size:42px;
  line-height:1;
  font-weight:700;
  letter-spacing:-0.04em;
}

.back-btn{
  text-decoration:none;
  color:var(--teal);
  font-weight:700;
}

.section{
  background:#fff;
  border-radius:30px;
  padding:24px;
  border:1px solid var(--line);
  margin-bottom:18px;
}

.section-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:20px;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:10px;
  font-size:15px;
  font-weight:700;
}

.input,
.textarea,
.select{
  width:100%;
  border:1px solid #E4DED7;
  background:#FAF8F5;
  border-radius:20px;
  padding:18px;
  font-size:16px;
  font-family:inherit;
  color:var(--text);
}

.textarea{
  min-height:160px;
  resize:none;
}

/* Rental Terms panel: reuses rental-terms.js's shared renderRentalTermsFields()
   DOM structure (form-field/rt-row/form-label/form-input/rt-*) rather than a
   second hand-rolled per-field renderer -- see add-property.html's matching
   block for the full rationale. These rules only make that shared structure
   look native to this page's visual language. */
.rt-row{margin-bottom:14px;}
.rt-row .form-label{display:block;margin-bottom:10px;font-size:15px;font-weight:700;}
.rt-row select,.rt-row input[type=text],.rt-row input[type=number]{
  border:1px solid #E4DED7;background:#FAF8F5;border-radius:20px;
  padding:14px;font-size:15px;font-family:inherit;color:var(--text);outline:none;
}
.rt-field-money,.rt-field-utility{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rt-field-fees{display:flex;flex-direction:column;gap:8px;}
.rt-fee-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;}
.rt-fee-remove{border:none;background:#EFE7E4;color:var(--danger,#B45B5B);border-radius:12px;padding:10px 12px;cursor:pointer;}
.rt-fee-add{border:1px dashed rgba(45,140,140,0.4);background:rgba(45,140,140,0.04);color:var(--teal);border-radius:14px;padding:10px;cursor:pointer;width:100%;}
.rt-field-checkboxes{display:flex;flex-wrap:wrap;gap:10px;}
.rt-checkbox-item{display:flex;align-items:center;gap:6px;background:#F8F5F1;border-radius:14px;padding:8px 12px;font-size:14px;}

.preview-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.preview{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:20px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.remove-img{
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.upload-box{
  border:2px dashed #DDD5CC;
  border-radius:24px;
  padding:24px;
  background:#FBFAF8;
}

.upload-text{
  color:var(--muted);
  line-height:1.8;
  margin-bottom:16px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.feature{
  background:#F7F3EE;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:10px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:24px;
}

.save-btn,
.delete-btn{
  flex:1;
  border:none;
  border-radius:22px;
  padding:18px;
  font-size:17px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
}

.save-btn{
  background:var(--teal);
  color:#fff;
}

.delete-btn{
  background:#EFE7E4;
  color:var(--danger);
}

.status-text{
  margin-top:16px;
  color:var(--muted);
  font-size:14px;
}

.delete-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}

.delete-box{
  background:#fff;
  width:100%;
  max-width:380px;
  border-radius:28px;
  padding:28px;
}

.delete-box h3{
  font-size:24px;
  margin-bottom:10px;
}

.delete-box p{
  color:var(--muted);
  line-height:1.7;
  margin-bottom:22px;
}

.delete-actions{
  display:flex;
  gap:12px;
}

.cancel-btn,
.confirm-btn{
  flex:1;
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.cancel-btn{
  background:#F2EFEB;
}

.confirm-btn{
  background:var(--danger);
  color:#fff;
}

</style>
</head>
<body>

<div class="topbar">

  <div class="page-title">
    ແກ້ໄຂ<br>
    ອະສັງຫາ
  </div>

  <a href="dashboard.html" class="back-btn">
    ← ກັບ
  </a>

</div>

<div class="section">

  <div class="section-title">
    ຂໍ້ມູນຫຼັກ
  </div>

  <div class="field">
    <label>ຫົວຂໍ້</label>
    <input type="text" class="input" id="title">
  </div>

  <div class="field">
    <label>ປະເພດ</label>
    <select class="select" id="propertyType" onchange="renderPropertyTypeFields(this.value)"></select>
  </div>

  <!-- Structured pricing (20260731000000_structured_pricing.sql) -- mirrors
       admin.html's single-price mode. Transaction type is immutable on this
       page (see below), so frequency visibility is set once at load, not
       wired to an onchange. Same "no dual sale+rent leg on this simpler
       self-service form" scope as add-property.html: a sale_or_rent
       listing edited here still captures one price, written as the sale
       leg (price_frequency='one_time'). -->
  <div class="field">
    <label>ລາຄາ</label>
    <div class="rt-field-money">
      <input type="number" min="0" class="input" id="priceAmount">
      <select class="select" id="priceCurrency"></select>
      <select class="select" id="priceFrequency"></select>
    </div>
  </div>

  <div class="field">
    <label>ລາຍລະອຽດ</label>
    <textarea class="textarea" id="description"></textarea>
  </div>

</div>

<!-- RENTAL TERMS (deposit, cleaning deposit, utilities, policies, fees) --
     the full RENTAL_TERMS_FIELDS set (rental-terms.js), same registry
     admin.html's Rental Terms section and add-property.html read from.
     Gated on the listing's transaction_type being a rental
     (isRentalTransactionType()) -- there is no field on this page to
     change transaction_type itself (immutable here), so this is a
     one-time show/hide at load, not wired to an onchange. See
     loadProperty(). -->
<div class="section" id="rental-terms-section" style="display:none;">

  <div class="section-title">
    ເງື່ອນໄຂການເຊົ່າ
  </div>

  <div id="rental-terms-grid"></div>

</div>

<div class="section">

  <div class="section-title">
    ສະຖານທີ່
  </div>

  <div class="field">
    <label>ເມືອງ</label>
    <input type="text" class="input" id="district">
  </div>

  <div class="field">
    <label>ບ້ານ</label>
    <input type="text" class="input" id="village">
  </div>

</div>

<div class="section">

  <div class="section-title">
    ລາຍລະອຽດ
  </div>

  <!-- Rendered dynamically from PROPERTY_TYPE_FIELDS (terminology.js)
       based on the selected property type; see renderPropertyTypeFields().
       No wrapping .field class here — each rendered field is its own
       .field div, matching this page's single-column layout. -->
  <div id="property-details-grid"></div>

</div>

<div class="section">

  <div class="section-title">
    ຜູ້ຕິດຕໍ່ (Buyer Contact)
  </div>

  <div class="field">
    <label>ຊື່ຜູ້ຕິດຕໍ່</label>
    <input type="text" class="input" id="contactName">
  </div>

  <div class="field">
    <label>ເບີໂທ *</label>
    <input type="text" class="input" id="contactPhone">
  </div>

</div>

<!-- Internal Owner -- staff-only concept in spirit, but this self-service
     portal has no separate "buyer contact role" selector to gate on (every
     listing here is by definition managed by the logged-in agent), so this
     section is simply always available, mirroring admin.html's capability
     set: view the linked owner, edit it, change it, create a new one, and
     see how many other listings share it before editing. -->
<div class="section">

  <div class="section-title">
    ເຈົ້າຂອງ (Internal Owner) <span style="font-weight:400;font-size:12px;color:#7A9098;">— private, never shown to buyers</span>
  </div>

  <div class="field">
    <label>Owner</label>
    <select class="input" id="ownerSelect" onchange="onOwnerSelectChange()">
      <option value="">— No owner on file —</option>
      <option value="__new__">+ Create new owner…</option>
    </select>
  </div>

  <div id="ownerFields" style="display:none;">
    <div class="field">
      <label>Owner Name *</label>
      <input type="text" class="input" id="ownerName">
    </div>
    <div class="field">
      <label>Owner Phone</label>
      <input type="text" class="input" id="ownerPhone">
    </div>
    <div class="field">
      <label>Owner WhatsApp</label>
      <input type="text" class="input" id="ownerWhatsapp">
    </div>
    <div class="field">
      <label>Internal Notes</label>
      <input type="text" class="input" id="ownerNotes">
    </div>
    <p id="ownerPortfolioNote" style="font-size:12px;color:#7A9098;margin-top:4px;"></p>
  </div>

</div>

<div class="section">

  <div class="section-title">
    ຮູບພາບ
  </div>

  <div class="upload-box">

    <div class="upload-text">
      ອັບໂຫລດຫຼາຍຮູບໄດ້<br>
      ຮູບທຳອິດຈະເປັນຮູບໜ້າປົກ
    </div>

    <input
      type="file"
      id="images"
      multiple
      accept="image/*"
    >

    <div
      class="preview-grid"
      id="previewGrid"
    ></div>

  </div>

</div>

<div class="section">

  <div class="section-title">
    ສິ່ງອຳນວຍຄວາມສະດວກ
  </div>

  <!-- Rendered dynamically from PROPERTY_TYPE_FIELDS's amenities
       checkbox_ref for the selected property type; see
       renderPropertyTypeFields() below. -->
  <div class="features" id="property-features-grid"></div>

</div>

<div class="section">

  <div class="section-title">
    ສະຖານະ
  </div>

  <select class="select" id="status">

    <option value="published">
      Published
    </option>

    <option value="draft">
      Draft
    </option>

    <option value="sold">
      Sold
    </option>

    <option value="rented">
      Rented
    </option>

  </select>

  <div class="actions">

    <button
      class="save-btn"
      onclick="saveProperty()"
    >
      ບັນທຶກ
    </button>

    <button
      class="delete-btn"
      onclick="openDeleteModal()"
    >
      ລຶບ
    </button>

  </div>

  <div class="status-text" id="statusText"></div>

</div>

<div class="delete-modal" id="deleteModal">

  <div class="delete-box">

    <h3>ລຶບອະສັງຫາ?</h3>

    <p>
      ການລຶບນີ້ບໍ່ສາມາດກູ້ຄືນໄດ້
    </p>

    <div class="delete-actions">

      <button
        class="cancel-btn"
        onclick="closeDeleteModal()"
      >
        ຍົກເລີກ
      </button>

      <button
        class="confirm-btn"
        onclick="confirmDelete()"
      >
        ລຶບ
      </button>

    </div>

  </div>

</div>

<script src="config.js?v=__ASSET_VERSION__"></script>
<script src="dev-banner.js?v=__ASSET_VERSION__"></script>
<script src="terminology.js?v=__ASSET_VERSION__"></script>
<script src="amenities.js?v=__ASSET_VERSION__"></script>
<script src="currency.js?v=__ASSET_VERSION__"></script>
<script src="rental-terms.js?v=__ASSET_VERSION__"></script>
<script>

const SUPABASE_URL = window.PINTAG.supabaseUrl;

const SUPABASE_KEY = window.PINTAG.anonKey;

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const propertyId =
new URLSearchParams(
  window.location.search
).get('id');

let existingImages = [];

// Rental Terms: the full RENTAL_TERMS_FIELDS registry (rental-terms.js) --
// see add-property.html's matching block for the full rationale (shared
// renderRentalTermsFields() with lang='lo', not a parallel per-field
// renderer). _rentalTermsFieldValues is populated from the loaded
// property's existing rental_terms in loadProperty() below (unlike
// add-property.html, which always starts empty), so opening Edit Listing
// on a rental shows every previously-saved field, not just Deposit.
let _rentalTermsFieldValues = {};

// Captured in loadProperty() -- transaction_type is immutable on this page
// (no field lets the user change it), so it's read once at load time and
// reused by buildPricePayload() at save time rather than re-read from a
// nonexistent form field.
let _propertyTransactionType = null;

function renderRentalTermsPanel(){
  renderRentalTermsFields(
    document.getElementById('rental-terms-grid'),
    _rentalTermsFieldValues,
    function(key, value){ if (value == null) delete _rentalTermsFieldValues[key]; else _rentalTermsFieldValues[key] = value; },
    undefined,
    'lo'
  );
}

async function compressImage(file){

  return new Promise((resolve)=>{

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = function(event){

      const img = new Image();

      img.src = event.target.result;

      img.onload = function(){

        const canvas =
          document.createElement('canvas');

        const MAX_WIDTH = 1600;

        let width = img.width;
        let height = img.height;

        if(width > MAX_WIDTH){

          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;

        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(

          (blob)=>{

            resolve(
              new File(
                [blob],
                file.name,
                {
                  type:'image/jpeg'
                }
              )
            );

          },

          'image/jpeg',
          0.78

        );

      };

    };

  });

}

// Populates the currency/frequency <select>s once at page load -- their
// options never change. currency.js/PRICE_FREQUENCY_OPTIONS is the single
// source of truth (shared with admin.html/add-property.html).
(function populatePriceSelectors(){
  const curEl = document.getElementById('priceCurrency');
  curEl.innerHTML = Object.keys(CURRENCIES).map(function(code){
    return '<option value="' + code + '">' + CURRENCIES[code].symbol + ' ' + code + '</option>';
  }).join('');
  const freqEl = document.getElementById('priceFrequency');
  freqEl.innerHTML = PRICE_FREQUENCY_OPTIONS.map(function(o){
    return '<option value="' + o.value + '">' + o.label + '</option>';
  }).join('');
})();

// Reads the Price fields and returns both the structured payload and its
// derived legacy price_display text (currency.js's deriveLegacyPriceFields())
// -- mirrors add-property.html's buildPricePayload()/admin.html's
// computeStructuredPrice(). transactionType is passed in explicitly since
// this page never lets the user change it (loadProperty() captures it into
// _propertyTransactionType at load time).
function buildPricePayload(transactionType){
  const isRental = isRentalTransactionType(transactionType);
  const raw = document.getElementById('priceAmount').value.trim();
  const amount = raw === '' ? null : Number(raw);
  const currency = amount != null ? document.getElementById('priceCurrency').value : null;
  const frequency = amount == null ? null : (isRental ? document.getElementById('priceFrequency').value : 'one_time');
  return {
    price_amount: amount,
    price_currency: currency,
    price_frequency: frequency,
    price_display: deriveLegacyPriceFields(amount, currency, frequency)
  };
}

let editingContactId = null;
let editingContactSharedCount = 0;

// ── Internal Owners (self-service) ──────────────────────────────────────
// Same normalized model as admin.html: one owners row can back many
// listings via properties.owner_id. RLS ("Authenticated read own-scope
// owners") already scopes a plain SELECT here to owners this agent created
// or that link to their own party -- no client-side filtering needed on
// top of it.
let ownersAll = [];

async function loadOwners(){
  const { data } = await supabaseClient
    .from('owners')
    .select('id,name,phone,whatsapp,notes')
    .order('name');
  ownersAll = data || [];
  populateOwnerSelect();
}

function populateOwnerSelect(selectedId){
  const sel = document.getElementById('ownerSelect');
  if (!sel) return;
  const current = selectedId !== undefined ? selectedId : sel.value;
  sel.innerHTML =
    '<option value="">— No owner on file —</option>' +
    ownersAll.map(o => `<option value="${o.id}">${o.name}${o.phone ? ' · ' + o.phone : ''}</option>`).join('') +
    '<option value="__new__">+ Create new owner…</option>';
  sel.value = current || '';
}

async function onOwnerSelectChange(){
  const sel = document.getElementById('ownerSelect');
  const fields = document.getElementById('ownerFields');
  const note = document.getElementById('ownerPortfolioNote');
  const v = sel.value;
  if (!v){ fields.style.display = 'none'; note.textContent = ''; return; }
  fields.style.display = 'block';
  if (v === '__new__'){
    ['ownerName','ownerPhone','ownerWhatsapp','ownerNotes'].forEach(id => { document.getElementById(id).value = ''; });
    note.textContent = 'A new owner record will be created and linked to this listing.';
    return;
  }
  const o = ownersAll.find(x => x.id === v);
  if (!o) return;
  document.getElementById('ownerName').value = o.name || '';
  document.getElementById('ownerPhone').value = o.phone || '';
  document.getElementById('ownerWhatsapp').value = o.whatsapp || '';
  document.getElementById('ownerNotes').value = o.notes || '';
  // Portfolio count is RLS-scoped to what this agent can see, same as the
  // rest of this page -- "how many other listings share this owner" from
  // this agent's own point of view.
  const { data: linked } = await supabaseClient.from('properties').select('id').eq('owner_id', v);
  const count = (linked || []).filter(p => p.id !== propertyId).length;
  note.textContent = count > 0
    ? `⚠ This owner is linked to ${count} other listing${count > 1 ? 's' : ''} you manage — edits here update all of them.`
    : 'Linked to this listing only.';
}

// Returns the owner_id to store on the property: null, an existing id
// (possibly with edits saved back), or a newly-created owner's id.
async function resolveOwnerId(){
  const sel = document.getElementById('ownerSelect');
  if (!sel) return null;
  const v = sel.value;
  if (!v) return null;
  const payload = {
    name: document.getElementById('ownerName').value.trim(),
    phone: document.getElementById('ownerPhone').value.trim() || null,
    whatsapp: document.getElementById('ownerWhatsapp').value.trim() || null,
    notes: document.getElementById('ownerNotes').value.trim() || null
  };
  if (!payload.whatsapp) payload.whatsapp = payload.phone;
  if (!payload.name) throw new Error('Owner Name is required when an owner is selected.');
  if (v === '__new__'){
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data, error } = await supabaseClient
      .from('owners')
      .insert({ ...payload, created_by: user ? user.id : null })
      .select('id')
      .single();
    if (error) throw error;
    return data.id;
  }
  const { error } = await supabaseClient.from('owners').update(payload).eq('id', v);
  if (error) throw error;
  return v;
}

// Resolves the logged-in user's own party row — checks auth_user_id first
// (the decoupled model going forward), falling back to id (the legacy
// "agents.id == auth uid" convention preserved for pre-existing agents).
async function resolveMyPartyId(userId){
  const { data } = await supabaseClient
    .from('parties')
    .select('id,name_en,whatsapp')
    .or(`auth_user_id.eq.${userId},id.eq.${userId}`)
    .limit(1);
  return (data && data[0]) || null;
}

// Populate the Property Type dropdown from PROPERTY_TYPES (terminology.js)
// using Lao labels, since this page is Lao-only UI.
(function populatePropertyTypeOptions(){
  const sel = document.getElementById('propertyType');
  sel.innerHTML = Object.keys(PROPERTY_TYPES).map(function(key){
    return '<option value="' + key + '">' + PROPERTY_TYPES[key].lo + '</option>';
  }).join('');
})();

function getCheckedFeatureKeys(){
  return Array.from(document.querySelectorAll('#property-features-grid input:checked')).map(function(el){ return el.value; });
}

// Renders the Property Details fields and the Features checkboxes for the
// selected property type from PROPERTY_TYPE_FIELDS (terminology.js). Only
// the AMENITIES-registry checkbox_ref is used here (not FEATURES), since
// this page has a single combined features/amenities checkbox list mapped
// to the `amenities` column. presetChecked, when given (on initial load),
// wins over whatever's currently checked in the DOM; when omitted (a
// mid-edit type switch), currently-checked keys are preserved instead.
function getCheckedMultiKeys(gridId){
  const el = document.getElementById(gridId);
  return el ? Array.from(el.querySelectorAll('input:checked')).map(function(cb){ return cb.value; }) : [];
}

function renderPropertyTypeFields(typeKey, presetChecked){
  const detailsGrid = document.getElementById('property-details-grid');
  const featuresGrid = document.getElementById('property-features-grid');
  if(!detailsGrid || !featuresGrid) return;
  const fields = PROPERTY_TYPE_FIELDS[typeKey] || [];
  const toCheck = presetChecked || getCheckedFeatureKeys();
  const multiFields = fields.filter(function(f){ return f.kind === 'multi_checkbox'; });
  const prevMulti = {};
  multiFields.forEach(function(f){ prevMulti[f.id] = getCheckedMultiKeys(f.id + '-grid'); });

  detailsGrid.innerHTML = fields.filter(function(f){ return f.kind !== 'checkbox_ref'; }).map(function(f){
    if(f.kind === 'select'){
      const opts = f.options.map(function(o){
        return '<option value="' + o.value + '">' + o.label.lo + '</option>';
      }).join('');
      return '<div class="field"><label>' + f.label.lo + '</label><select class="select" id="' + f.id + '">' + opts + '</select></div>';
    }
    if(f.kind === 'multi_checkbox'){
      const items = f.options.map(function(o){
        return '<label class="feature"><input type="checkbox" value="' + o.value + '">' + o.label.lo + '</label>';
      }).join('');
      return '<div class="field"><label>' + f.label.lo + '</label><div class="features" id="' + f.id + '-grid">' + items + '</div></div>';
    }
    return '<div class="field"><label>' + f.label.lo + '</label><input type="' + (f.kind === 'text' ? 'text' : 'number') + '" class="input" id="' + f.id + '"' +
      (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
      (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '') + '></div>';
  }).join('');

  multiFields.forEach(function(f){
    const container = document.getElementById(f.id + '-grid');
    if(!container) return;
    (prevMulti[f.id] || []).forEach(function(v){
      const cb = container.querySelector('input[value="' + v + '"]');
      if(cb) cb.checked = true;
    });
  });

  const amenityField = fields.find(function(f){ return f.kind === 'checkbox_ref' && f.registry === 'AMENITIES'; });
  const keys = amenityField ? amenityField.keys : [];
  featuresGrid.innerHTML = keys.map(function(key){
    const a = AMENITIES[key];
    if(!a) return '';
    return '<label class="feature"><input type="checkbox" value="' + key + '">' + a.lo + '</label>';
  }).join('');
  keys.forEach(function(key){
    if(toCheck.indexOf(key) === -1) return;
    const input = featuresGrid.querySelector('input[value="' + key + '"]');
    if(input) input.checked = true;
  });
}

function populateTypedFields(typeKey, sourceRow){
  (PROPERTY_TYPE_FIELDS[typeKey] || []).forEach(function(f){
    if(!f.column) return;
    if(f.kind === 'multi_checkbox'){
      const container = document.getElementById(f.id + '-grid');
      if(!container) return;
      const values = Array.isArray(sourceRow && sourceRow[f.column]) ? sourceRow[f.column] : [];
      container.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        cb.checked = values.indexOf(cb.value) !== -1;
      });
      return;
    }
    const el = document.getElementById(f.id);
    if(!el) return;
    const v = sourceRow ? sourceRow[f.column] : null;
    el.value = (v != null ? v : '');
  });
}

function buildTypedFieldsPayload(typeKey){
  const activeIds = {};
  (PROPERTY_TYPE_FIELDS[typeKey] || []).forEach(function(f){ if(f.column) activeIds[f.id] = f; });
  const allColumns = {};
  Object.keys(PROPERTY_TYPE_FIELDS).forEach(function(key){
    PROPERTY_TYPE_FIELDS[key].forEach(function(f){ if(f.column) allColumns[f.column] = f; });
  });
  const out = {};
  Object.keys(allColumns).forEach(function(column){
    const f = allColumns[column];
    const active = activeIds[f.id];
    if(!active){ out[column] = null; return; }
    if(f.kind === 'multi_checkbox'){ out[column] = getCheckedMultiKeys(f.id + '-grid'); return; }
    const el = document.getElementById(f.id);
    if(!el){ out[column] = null; return; }
    out[column] = f.kind === 'number' ? (parseInt(el.value) || null) : (el.value.trim() || null);
  });
  return out;
}

async function loadProperty(){

  const { data,error } =
  await supabaseClient
    .from('properties')
    .select('*,contacts(*)')
    .eq('id',propertyId)
    .single();

  if(error){

    alert('Property not found');

    return;

  }

  document.getElementById('title').value =
  data.title_en || '';

  // Structured fields are the source of truth; price_display is legacy-
  // derived and never read back into the form (matches admin.html's
  // editListing()).
  _propertyTransactionType = data.transaction_type || null;
  document.getElementById('priceAmount').value =
    data.price_amount != null ? data.price_amount : '';
  document.getElementById('priceCurrency').value =
    data.price_currency || DEFAULT_CURRENCY;
  document.getElementById('priceFrequency').value =
    data.price_frequency && data.price_frequency !== 'one_time' ? data.price_frequency : 'monthly';
  // Frequency only means something for a rental cadence -- see the markup
  // comment; hidden for a sale the same way admin.html hides it.
  document.getElementById('priceFrequency').style.display =
    isRentalTransactionType(data.transaction_type) ? '' : 'none';

  document.getElementById('description').value =
  data.description_lo || '';

  document.getElementById('district').value =
  data.district_lo || '';

  document.getElementById('village').value =
  data.village_lo || '';

  // Reconstruct this dropdown's legacy published/draft/sold/rented
  // vocabulary from the real workflow_status/market_status columns --
  // data.status itself now always collapses to just active/draft/archived
  // (see 20260729000000_listing_status_model.sql's sync trigger), so
  // reading it directly here would silently forget "sold"/"rented" on
  // every load.
  document.getElementById('status').value =
    (data.workflow_status === 'draft') ? 'draft' :
    (data.market_status === 'sold' || data.market_status === 'rented') ? data.market_status :
    'published';

  document.getElementById('propertyType').value =
  data.property_type || '';

  renderPropertyTypeFields(data.property_type || '', data.amenities || []);
  populateTypedFields(data.property_type || '', data);

  // Rental Terms -- resolveRentalTerms() is the only allowed read path for
  // rental_terms (rental-terms.js rule 3); unitType is null here since
  // this self-service form has no per-unit override UI, so this always
  // resolves to the property's own default (never an inherited override).
  // Seeds _rentalTermsFieldValues with every previously-saved field (not
  // just deposit), then renders the full panel from it.
  _rentalTermsFieldValues = Object.assign({}, resolveRentalTerms(data, null).values);
  renderRentalTermsPanel();

  // Rental Terms only applies when this listing's transaction_type is a
  // rental (for_rent/sale_or_rent) -- isRentalTransactionType() is
  // rental-terms.js's single source of truth for that check, shared with
  // admin.html/add-property.html/listings.html's search filters. No field
  // on this page can change transaction_type, so this is a one-time
  // show/hide, not wired to any onchange.
  const rentalTermsSection = document.getElementById('rental-terms-section');
  if (rentalTermsSection) {
    rentalTermsSection.style.display = isRentalTransactionType(data.transaction_type) ? '' : 'none';
  }

  // Internal Owner -- populate from the linked owner (if any) via the same
  // handler the manual picker uses. loadOwners() has already resolved by
  // the time this runs (see the loadOwners().then(loadProperty) chain
  // below), so ownersAll is populated before this select renders.
  populateOwnerSelect(data.owner_id || '');
  await onOwnerSelectChange();

  editingContactId = data.contact_id || null;
  document.getElementById('contactName').value =
  (data.contacts && data.contacts.name) || '';

  document.getElementById('contactPhone').value =
  (data.contacts && data.contacts.phone) || '';

  if(editingContactId){
    const { data:usage } = await supabaseClient
      .from('properties')
      .select('id')
      .eq('contact_id',editingContactId);
    editingContactSharedCount = (usage || []).filter(r=>r.id !== propertyId).length;
    if(editingContactSharedCount > 0){
      alert(`ໝາຍເຫດ: ຜູ້ຕິດຕໍ່ນີ້ຖືກໃຊ້ຮ່ວມກັນໃນ ${editingContactSharedCount} ລາຍການອື່ນ. ການບັນທຶກຈະປ່ຽນແປງທຸກລາຍການ.`);
    }
  }

  existingImages =
    data.images || [];

  renderPreviews();

}

function renderPreviews(){

  const grid =
  document.getElementById(
    'previewGrid'
  );

  grid.innerHTML = '';

  existingImages.forEach(
    (url,index)=>{

      grid.innerHTML += `
      
      <div class="preview">

        <img src="${url}">

        <button
          class="remove-img"
          onclick="removeImage(${index})"
        >
          ×
        </button>

      </div>

      `;

    }
  );

}

function removeImage(index){

  existingImages.splice(index,1);

  renderPreviews();

}

async function uploadImages(){

  const files =
  document.getElementById(
    'images'
  ).files;

  if(!files.length){

    return existingImages;

  }

  const uploaded = [];

  for(let file of files){

    file =
      await compressImage(file);

    const fileName =
      `${Date.now()}-${file.name}`;

    const { error } =
    await supabaseClient
      .storage
      .from('property-images')
      .upload(
        fileName,
        file
      );

    if(error){

      console.log(error);

      continue;

    }

    const { data } =
    supabaseClient
      .storage
      .from('property-images')
      .getPublicUrl(
        fileName
      );

    uploaded.push(
      data.publicUrl
    );

  }

  return [
    ...existingImages,
    ...uploaded
  ];

}

async function saveProperty(){

  document.getElementById(
    'statusText'
  ).innerHTML =
  'ກຳລັງບັນທຶກ...';

  const images =
    await uploadImages();

  const amenities =
    getCheckedFeatureKeys();

  const propertyType =
    document.getElementById('propertyType').value;

  const contactPhone =
    document.getElementById('contactPhone').value.trim();

  if(!contactPhone){
    document.getElementById('statusText').innerHTML =
      'ກະລຸນາປ້ອນເບີໂທຜູ້ຕິດຕໍ່.';
    return;
  }

  // Internal owner resolved before the contact so a failure here (e.g. an
  // owner selected with no name) aborts the save before any contact row
  // is touched.
  let resolvedOwnerId = null;
  try {
    resolvedOwnerId = await resolveOwnerId();
  } catch (e) {
    document.getElementById('statusText').innerHTML = e.message;
    return;
  }

  const contactBody = {
    name: document.getElementById('contactName').value.trim() || null,
    phone: contactPhone,
    whatsapp: contactPhone
  };

  if(editingContactId){
    const { error: contactError } = await supabaseClient
      .from('contacts')
      .update(contactBody)
      .eq('id',editingContactId);
    if(contactError){
      alert(JSON.stringify(contactError));
      return;
    }
  } else {
    // Defensive fallback for a pre-migration listing with no contact_id yet.
    const { data:{ user } } = await supabaseClient.auth.getUser();
    const myParty = user ? await resolveMyPartyId(user.id) : null;
    const { data:created, error: contactError } = await supabaseClient
      .from('contacts')
      .insert({ ...contactBody, role: 'agent', party_id: myParty ? myParty.id : null, created_by: user ? user.id : null })
      .select('id');
    if(contactError){
      alert(JSON.stringify(contactError));
      return;
    }
    editingContactId = created[0].id;
  }

  const pricePayload =
    buildPricePayload(_propertyTransactionType);

  const payload = {

    title_en:
      document.getElementById(
        'title'
      ).value,

    title_lo:
      document.getElementById(
        'title'
      ).value,

    price_amount:
      pricePayload.price_amount,

    price_currency:
      pricePayload.price_currency,

    price_frequency:
      pricePayload.price_frequency,

    price_display:
      pricePayload.price_display,

    description_lo:
      document.getElementById(
        'description'
      ).value,

    description_en:
      document.getElementById(
        'description'
      ).value,

    district_lo:
      document.getElementById(
        'district'
      ).value,

    district_en:
      document.getElementById(
        'district'
      ).value,

    village_lo:
      document.getElementById(
        'village'
      ).value,

    village_en:
      document.getElementById(
        'village'
      ).value,

    // properties.status is derived server-side from workflow_status by
    // trg_properties_status_sync -- write workflow_status/market_status
    // instead of the legacy status vocabulary (published/draft/sold/rented)
    // this dropdown still uses, or the trigger would collapse it to just
    // 'active'/'draft' and silently forget sold/rented on every save.
    workflow_status:
      (document.getElementById('status').value === 'draft') ? 'draft' : 'active',
    market_status:
      (['sold','rented'].includes(document.getElementById('status').value))
        ? document.getElementById('status').value
        : 'available',

    property_type: propertyType,

    amenities,

    images,

    contact_id: editingContactId,

    owner_id: resolvedOwnerId,

    // _rentalTermsFieldValues was seeded from the property's full existing
    // rental_terms at load (loadProperty()) and is kept live by the panel's
    // onChange -- it IS the payload, not a merge of a partial edit onto a
    // separately-tracked snapshot.
    rental_terms: buildRentalTermsPayload(_rentalTermsFieldValues),

    ...buildTypedFieldsPayload(propertyType)

  };

  const { error } =
  await supabaseClient
    .from('properties')
    .update(payload)
    .eq('id',propertyId);

  if(error){

    alert(
      JSON.stringify(error)
    );

    return;

  }

  document.getElementById(
    'statusText'
  ).innerHTML =
  'ບັນທຶກສຳເລັດ';

}

function openDeleteModal(){

  document.getElementById(
    'deleteModal'
  ).style.display =
  'flex';

}

function closeDeleteModal(){

  document.getElementById(
    'deleteModal'
  ).style.display =
  'none';

}

async function confirmDelete(){

  await supabaseClient
    .from('properties')
    .delete()
    .eq('id',propertyId);

  window.location.href =
    'dashboard.html';

}

loadOwners().then(loadProperty);

</script>
