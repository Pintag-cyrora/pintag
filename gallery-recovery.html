<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src https://*.supabase.co; frame-src 'none'; object-src 'none';">
<title>Pintag — Gallery Recovery</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0F1418;color:#E8EDF0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;line-height:1.4}
h1{font-size:1.2rem;color:#2D8C8C;margin-bottom:.2rem}
.sub{color:#9AA7B0;font-size:.85rem;margin-bottom:1rem}
.bar{position:sticky;top:0;background:#0F1418;padding:8px 0;border-bottom:1px solid rgba(232,237,240,.12);margin-bottom:12px;z-index:5;font-size:.8rem;color:#9AA7B0}
.card{background:#1A2428;border:1px solid rgba(232,237,240,.12);border-radius:12px;padding:14px;margin-bottom:16px}
.sumbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi b{font-size:1.2rem;color:#2D8C8C}
.kpi span{font-size:.68rem;color:#9AA7B0;text-transform:uppercase;letter-spacing:.02em}
.hc{font-size:.8rem;display:flex;align-items:center;gap:6px;margin-left:auto}
.chd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cover{width:120px;height:90px;object-fit:cover;border-radius:8px;background:#0F1418}
.meta{font-size:.8rem;color:#9AA7B0}
.why{font-size:.78rem;color:#7FB2B2;margin:.3rem 0}
.gallery{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0}
.photo{position:relative;flex:0 0 auto}
.photo input{position:absolute;top:3px;left:3px;width:16px;height:16px;cursor:pointer;z-index:2}
.photo img{display:block;width:78px;height:58px;object-fit:cover;border-radius:6px;background:#0F1418}
.photo input:not(:checked)~img{opacity:.32;outline:2px solid #B0778F}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.cfl{color:#9AA7B0;font-size:.8rem;margin-left:6px}
select{background:#0F1418;color:#E8EDF0;border:1px solid rgba(232,237,240,.25);border-radius:6px;padding:5px 6px;font-size:.82rem}
.search,.usearch,.rsearch{width:100%;padding:8px;margin:8px 0 4px;box-sizing:border-box;background:#0F1418;color:#E8EDF0;border:1px solid rgba(232,237,240,.2);border-radius:8px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px;border:1px solid rgba(232,237,240,.1);border-radius:8px;margin-top:6px}
.cand .t{font-size:.85rem}
.cand .d{font-size:.75rem;color:#9AA7B0}
.cand2{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid rgba(232,237,240,.1);border-radius:8px;margin-top:6px}
.cand2 .ph{width:56px;height:44px;flex:0 0 auto;border-radius:6px;background:#0F1418;display:flex;align-items:center;justify-content:center;font-size:1.15rem;opacity:.55}
.cand2 .info{flex:1;min-width:0}
.cand2 .t{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.cand2 .lo{font-size:.8rem;color:#C9D3D9}
.cand2 .m{font-size:.74rem;color:#9AA7B0}
.conf{font-weight:700}
.hi{color:#4CAF7D}.mid{color:#E0B15A}.lo{color:#B0778F}
.uphoto{position:relative;display:inline-block;margin:3px}
.uphoto input{position:absolute;top:3px;left:3px;width:15px;height:15px;z-index:2}
.uphoto img{width:74px;height:56px;object-fit:cover;border-radius:6px}
button{border:0;border-radius:8px;background:#2D8C8C;color:#fff;font-size:.85rem;font-weight:600;padding:.5rem .8rem;cursor:pointer}
button.ghost{background:transparent;border:1px solid rgba(232,237,240,.2);color:#E8EDF0}
button.danger{background:#8C3A4A}
button:disabled{opacity:.5;cursor:default}
.done{color:#4CAF7D;font-weight:600}
.tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:6px;border:1px solid rgba(232,237,240,.2);margin-left:6px;color:#9AA7B0}
#log{position:fixed;bottom:0;left:0;right:0;background:#111a1e;border-top:1px solid rgba(232,237,240,.12);font-size:.72rem;color:#9AA7B0;padding:6px 10px;max-height:22vh;overflow:auto;font-family:ui-monospace,monospace}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:#1A2428;border:1px solid rgba(232,237,240,.15);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto}
.mtitle{font-weight:700;color:#2D8C8C;margin-bottom:8px}
.trow{border:1px solid rgba(232,237,240,.1);border-radius:8px;padding:8px;margin:6px 0}
.trow .lg{font-size:.7rem;color:#9AA7B0;text-transform:uppercase}
.trow .vv{font-size:.9rem}
.nav{display:flex;gap:6px}
.cols{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.col{flex:1;min-width:260px}
.col h3{font-size:.85rem;color:#7FB2B2;margin-bottom:6px}
.grid{display:flex;flex-wrap:wrap;gap:6px;max-height:60vh;overflow:auto;align-content:flex-start;padding:4px;border:1px solid rgba(232,237,240,.08);border-radius:8px}
.pth{position:relative;cursor:pointer}
.pth img{width:84px;height:64px;object-fit:cover;border-radius:6px;display:block;background:#0F1418}
.pth.added img{outline:3px solid #4CAF7D}
.pth.sug img{outline:3px dashed #E0B15A}
.pth.focus img{box-shadow:0 0 0 3px #2D8C8C,0 0 0 5px rgba(45,140,140,.35)}
.pth .x{position:absolute;top:2px;right:2px;background:#8C3A4A;color:#fff;border-radius:4px;font-size:.62rem;padding:0 4px}

/* ───────── Mobile gallery assignment (Photos-style; desktop unaffected) ───────── */
.selbadge{display:none}
.mbar{display:none}
.qfilters{display:none}
.qfilters:empty{display:none}
@media (max-width:640px){
  /* 2-column large tiles: accuracy over density (rooms must be recognizable). */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;padding-bottom:0}
  .photo{flex:none;width:100%}
  .photo input{display:none}                         /* checkbox stays the source of truth, just hidden */
  .photo img{width:100%;height:auto;aspect-ratio:4/3;border-radius:10px}
  .photo input:not(:checked)~img{opacity:1;outline:none}   /* undo the desktop "deselected" dim */
  .photo:has(input:checked) img{outline:3px solid #2D8C8C;outline-offset:-2px}
  /* badge appears only on a selected tile (unselected tiles stay clean) */
  .selbadge{display:none;position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;
    background:#2D8C8C;border:2px solid #2D8C8C;align-items:center;justify-content:center;
    color:#fff;font-size:.85rem;line-height:1;z-index:2}
  .photo:has(input:checked) .selbadge{display:flex}
  .photo:has(input:checked) .selbadge::after{content:"✓"}
  /* the inline desktop controls move to the sticky bar + picker sheet on mobile */
  .card .ctrls,.card .search,.card .cands{display:none}
  /* room quick-filters (dormant until photos carry a room classification) */
  .qfilters{display:flex;gap:6px;overflow-x:auto;margin:8px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .qfilters::-webkit-scrollbar{display:none}
  .qchip{flex:0 0 auto;font-size:.8rem;padding:.4rem .8rem;border-radius:999px;border:1px solid rgba(232,237,240,.22);color:#C9D3D9;background:transparent}
  .qchip.on{background:#2D8C8C;border-color:#2D8C8C;color:#fff}
  /* sticky, thumb-reachable action bar */
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:8px;align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0e1519;
    border-top:1px solid rgba(232,237,240,.16);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  .mbar.hide{display:none}
  .mbar .mc{font-weight:700;color:#2D8C8C;font-size:.98rem;margin-right:auto;white-space:nowrap}
  .mbar button{padding:.62rem .72rem;font-size:.82rem}
  #log{display:none}                                  /* debug log would steal the thumb zone */
  body{padding-bottom:64px}                            /* room so the bar never covers the last card */
}
/* Mobile recovery-queue editor (Listing → Gallery, the primary phone flow) */
@media (max-width:640px){
  #bylisting .card:first-child{display:none}   /* hide the agent/search card; the queue drives itself */
  .mqhead{position:sticky;top:0;z-index:25;background:#0e1519;border-bottom:1px solid rgba(232,237,240,.14);margin:-4px -4px 8px;padding:8px 12px}
  .mqrow{display:flex;align-items:baseline;gap:10px}
  .mqrow b{color:#E8EDF0}
  .mqrow .mqn{margin-left:auto;font-size:.82rem;color:#2D8C8C;font-weight:700}
  .mqhead .pbar{height:6px;background:#22303a;border-radius:4px;overflow:hidden;margin-top:6px}
  .mqhead .pbar i{display:block;height:100%;background:#2D8C8C}
  .msec{margin:12px 0 4px}
  .msec h3{font-size:.9rem;color:#7FB2B2;margin-bottom:6px}
  .mgrp{margin:10px 0}
  .mgrp .gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:#9AA7B0;margin-bottom:6px}
  .mgrp .gh b{color:#7FB2B2}
  .mgrp .gh .gsel,.mgrp .gh .ghide{margin:0;padding:.3rem .6rem;font-size:.72rem}
  .mgrp .gh .gsel{margin-left:auto}
  .mgrp .gh .ghide{background:transparent;border:1px solid rgba(232,237,240,.2);color:#9AA7B0}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mtile{position:relative;cursor:pointer}
  .mtile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:#0F1418}
  .mtile.sel img{outline:3px solid #2D8C8C;outline-offset:-2px}
  .mtile.sel::after{content:"✓";position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;background:#2D8C8C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
  .mtile .rm{position:absolute;top:6px;right:6px;background:#8C3A4A;color:#fff;border-radius:6px;font-size:.7rem;padding:2px 7px}
  .mlebar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0e1519;
    border-top:1px solid rgba(232,237,240,.16);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  .mlebar .mc{font-weight:700;color:#2D8C8C;font-size:.92rem;margin-right:auto;white-space:nowrap}
  .mlebar .msave{padding:.66rem .9rem}
  .mlebar .msi{padding:.66rem .7rem;font-size:.8rem}
  #bleditor{padding-bottom:64px}
  /* photo-first recovery: minimal factual metadata, no title */
  .idbar{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:.78rem;color:#9AA7B0;margin:2px 0 12px;align-items:center}
  .idbar .pid{font-family:ui-monospace,monospace;color:#7FB2B2;font-weight:700}
}
/* Full-screen preview (used by long-press; inspect before selecting) */
.pv{position:fixed;inset:0;background:#000;z-index:45;display:flex;flex-direction:column;touch-action:none}
.pv .pvtop{display:flex;justify-content:space-between;align-items:center;padding:14px;color:#C9D3D9;font-size:.82rem}
.pv .pvclose{background:transparent;color:#fff;font-size:1.1rem;padding:.3rem .6rem}
.pv .pvwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.pv .pvwrap img{max-width:100%;max-height:100%;object-fit:contain}
.pv .pvbtns{display:flex;gap:10px;align-items:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:#0c0f11}
.pv .pvbtns .nav2{background:transparent;border:1px solid rgba(232,237,240,.25);color:#E8EDF0;font-size:1.1rem;min-width:52px}
.pv .pvsel{flex:1;font-weight:700}
.pv .pvsel.on{background:#2D8C8C}
.pv .pvsel.off{background:transparent;border:1px solid #2D8C8C;color:#2D8C8C}
</style>
</head>
<body>
<h1>Gallery Recovery</h1>
<div class="sub">Work the queue: tick the photos that belong, pick the listing, Assign. Completed galleries move to <b>Recovered Galleries</b>. Every assign &amp; unassign is logged.</div>
<div class="bar" id="bar">Loading…</div>
<div id="summary"></div>
<div id="tools"></div>
<div id="clusters"></div>
<div id="bylisting" style="display:none"></div>
<div id="recovered" style="display:none"></div>
<div id="log"></div>

<script src="config.js?v=__ASSET_VERSION__"></script>
<script src="admin-auth.js?v=__ASSET_VERSION__"></script>
<script>
(function () {
  'use strict';
  var sb = supabase.createClient(window.PINTAG.supabaseUrl, window.PINTAG.anonKey);
  var BUCKET = 'property-images';
  var PUB = window.PINTAG.supabaseUrl + '/storage/v1/object/public/' + BUCKET + '/';
  var GAP_MS = 15 * 60 * 1000;
  var OPERATOR = 'operator';
  var ALL_PROPS = [], DRAFTS = [], PARTY = {}, PARTIES = [], CLUSTERS = [];
  var SET91 = new Set();
  var CONFMAP = {};                 // listing_id -> worst confidence among its assigns
  var HIDE_COMPLETED = true;        // ☑ Hide completed (default ON)
  var VIEW = 'queue';               // 'queue' | 'bylisting' | 'recovered'
  var BL_SEL = null;                // currently-open listing id in "Recover by Listing"
  var BL_AGENT = '';                // agent scope for Mode 2 ('' = all agents)
  var AUTO_SELECT = true;           // click one photo → suggest its upload-burst mates
  var AUTO_TITLE = true;            // after a Mode-2 gallery save, AI-title if untitled
  var HIDE_DUPES = true;            // collapse duplicate photos within a cluster
  var BL_KEY = null;                // active Mode-2 keydown handler
  var FILTERS = { agent:'', district:'', ptype:'' };
  var RCONF = 'all';                // recovered-view confidence filter
  var CONF_RANK = { low:0, medium:1, high:2 };
  var log = function (m) { var l = document.getElementById('log'); l.innerHTML = '['+new Date().toLocaleTimeString()+'] '+m+'<br>'+l.innerHTML; };
  function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function nameOf(u){ return (''+u).split('/').pop(); }
  function imgsOf(p){ if(!p||!p.images) return []; try { return Array.isArray(p.images)?p.images:JSON.parse(p.images); } catch(e){ return []; } }
  function label(d){ return d.title_en || d.title_lo || d.id; }
  function nz(s){ return s!=null && (''+s).trim()!==''; }
  // Recognizable label for untitled listings: "Untitled House • Sisattanak • Agent: Daeng".
  function displayTitle(p){
    if (nz(p.title_en)) return p.title_en;
    if (nz(p.title_lo)) return p.title_lo;
    var t = p.property_type ? (p.property_type.charAt(0).toUpperCase()+p.property_type.slice(1)) : 'Listing';
    var parts = ['Untitled '+t];
    if (nz(p.district_en)) parts.push(p.district_en);
    var ag = agentName(p); if (ag) parts.push('Agent: '+ag);
    return parts.join(' • ');
  }
  function eTagOf(f){ var m=f&&f.metadata; return (m && (m.eTag||m.etag)) || (m && m.size!=null ? 'sz:'+m.size : null); }
  // Collapse exact-duplicate photos (same content hash/size). Returns { files, dupes }.
  function dedup(files){
    if (!HIDE_DUPES) return { files: files, dupes: 0 };
    var seen = {}, out = [], dupes = 0;
    files.forEach(function(f){ var k = eTagOf(f); if (k && seen[k]) { dupes++; return; } if (k) seen[k]=1; out.push(f); });
    return { files: out, dupes: dupes };
  }
  function detachKey(){ if (BL_KEY){ document.removeEventListener('keydown', BL_KEY); BL_KEY = null; } }
  function worseConf(a,b){ if(!a) return b; if(!b) return a; return CONF_RANK[a] <= CONF_RANK[b] ? a : b; }
  function agentName(d){ return (d.managed_by_party_id && PARTY[d.managed_by_party_id]) || ''; }
  function agentOptionsHtml(sel){
    var o = '<option value="">— no agent —</option>';
    PARTIES.forEach(function(p){ o += '<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>'; });
    return o;
  }

  // Global quick-filters that narrow the candidate lists for every cluster.
  function baseDrafts(){
    return DRAFTS.filter(function(d){
      var a = FILTERS.agent;
      if (a === '__none__' && d.managed_by_party_id) return false;
      if (a === '__any__'  && !d.managed_by_party_id) return false;
      if (a && a !== '__none__' && a !== '__any__' && d.managed_by_party_id !== a) return false;
      if (FILTERS.district && d.district_en !== FILTERS.district) return false;
      if (FILTERS.ptype && d.property_type !== FILTERS.ptype) return false;
      return true;
    });
  }
  function refreshAllCands(){ CLUSTERS.forEach(function(c){ if (c._refreshCands) c._refreshCands(); }); }

  // Recognize the agent → recover the relationship. Fill-only unless you change
  // an existing one (confirmed). Logged to listing_provenance (agent_changed).
  async function setAgent(draft, partyId) {
    var prev = draft.managed_by_party_id || null; partyId = partyId || null;
    if (prev === partyId) return;
    if (prev && partyId && prev !== partyId &&
        !confirm('Change agent from '+(PARTY[prev]||prev)+' to '+(PARTY[partyId]||partyId)+' for:\n'+label(draft)+' ?')) { refreshAllCands(); return; }
    var r = await sb.from('properties').update({ managed_by_party_id: partyId }).eq('id', draft.id).select('id');
    if (r.error) { alert('Failed: '+r.error.message); log('ERROR set agent '+r.error.message); refreshAllCands(); return; }
    var reg = await sb.from('listing_provenance').insert([{
      listing_id: draft.id, event_type:'agent_changed', field_name:'managed_by_party_id',
      old_value: prev, new_value: partyId, source:'manual', actor: OPERATOR,
      details: { via:'gallery-recovery', agent_name: (partyId ? PARTY[partyId] : null) }
    }]);
    if (reg.error) log('WARN provenance insert failed: '+reg.error.message);
    draft.managed_by_party_id = partyId;
    log('AGENT '+(partyId ? ('set → '+(PARTY[partyId]||partyId)) : 'cleared')+' for '+label(draft));
    refreshAllCands(); updateSummary();
    if (VIEW === 'recovered') renderRecovered();
  }

  PintagAdminAuth.protect(sb, boot);

  async function listAllObjects() {
    var out = [], page = 0;
    while (true) {
      var r = await sb.storage.from(BUCKET).list('', { limit: 100, offset: page*100, sortBy: { column: 'created_at', order: 'asc' } });
      if (r.error) throw r.error;
      out = out.concat(r.data || []);
      if (!r.data || r.data.length < 100) break;
      page++;
    }
    return out.filter(function (o) { return o.name && o.created_at; });
  }

  function clusterByTime(objs) {
    objs.sort(function (a,b){ return new Date(a.created_at) - new Date(b.created_at); });
    var clusters = [], cur = null, prev = null;
    objs.forEach(function (o) {
      var t = new Date(o.created_at).getTime();
      if (!cur || (prev !== null && t - prev > GAP_MS)) { cur = { files: [], start: o.created_at }; clusters.push(cur); }
      cur.files.push(o); cur.end = o.created_at; prev = t;
    });
    return clusters;
  }

  async function boot() {
    try {
      document.getElementById('bar').textContent = 'Loading photos…';
      try { var u = await sb.auth.getUser(); OPERATOR = (u.data && u.data.user && u.data.user.email) || OPERATOR; } catch(e){}
      if (OPERATOR === 'operator' && window.PintagAdminAuth && PintagAdminAuth.ADMIN_EMAIL) OPERATOR = PintagAdminAuth.ADMIN_EMAIL;

      var objs = await listAllObjects();
      ALL_PROPS = (await sb.from('properties').select('id,title_en,title_lo,title_zh,district_en,village_en,village,property_type,property_style,transaction_type,bedrooms,bathrooms,price_display,features,nearby_places,managed_by_party_id,contact_id,images,workflow_status')).data || [];
      var parties = (await sb.from('parties').select('id,name_en,name_lo')).data || [];
      parties.forEach(function (p){ PARTY[p.id] = p.name_en || p.name_lo || null; });
      PARTIES = parties.map(function(p){ return { id:p.id, name: p.name_en||p.name_lo||p.id }; }).sort(function(a,b){ return a.name.localeCompare(b.name); });

      var rl = (await sb.from('properties_removal_log').select('property_id')).data || [];
      SET91 = new Set(rl.map(function(r){ return r.property_id; }));

      var reg = (await sb.from('gallery_assignments').select('listing_id,confidence').eq('op','assign')).data || [];
      reg.forEach(function(r){ if (r.confidence) CONFMAP[r.listing_id] = worseConf(CONFMAP[r.listing_id], r.confidence); });

      var referenced = new Set();
      ALL_PROPS.forEach(function (p){ imgsOf(p).forEach(function(u){ var m=nameOf(u); if(m) referenced.add(m); }); });
      DRAFTS = ALL_PROPS.filter(function (p){ return p.workflow_status === 'draft'; });

      var orphans = objs.filter(function (o){ return !referenced.has(o.name); });
      CLUSTERS = clusterByTime(orphans);
      CLUSTERS.forEach(function (c, i){ c.id = c.files[0].name; c._n = i+1; c.remaining = c.files.slice(); c.files.forEach(function(f){ f._cluster = c.id; }); });

      document.getElementById('bar').textContent = 'Loaded '+objs.length+' photos → '+CLUSTERS.length+' clusters. Read-only until you act.';
      renderSummary();
      renderTools();
      renderClusters();
      updateSummary();
      // On a phone, Listing → Gallery is the primary flow: open the queue.
      if (isPhone()) switchView('bylisting');

  async function assign(c, draft, confidence, names, btn) {
    if (!names.length) { alert('Tick at least one photo first.'); return; }
    if (!confirm('Assign '+names.length+' photo(s) to:\n'+label(draft)+'\nConfidence: '+confidence.toUpperCase()+'\n\n(Merged into the gallery — never removes existing photos.)')) return;
    btn.disabled = true;
    var addUrls = names.map(function(n){ return PUB + n; });
    var cur = imgsOf(draft);
    var have = new Set(cur.map(nameOf));
    var merged = cur.concat(addUrls.filter(function(u){ return !have.has(nameOf(u)); }));
    var r = await sb.from('properties').update({ images: merged }).eq('id', draft.id).select('id');
    if (r.error) { btn.disabled = false; log('ERROR assign '+r.error.message); alert('Failed: '+r.error.message); return; }
    var reg = await sb.from('gallery_assignments').insert([{
      op:'assign', listing_id:draft.id, cluster_id:c.id, photo_paths:names,
      photo_count:names.length, confidence:confidence, method:'manual', operator:OPERATOR
    }]);
    if (reg.error) log('WARN register insert failed: '+reg.error.message);
    draft.images = merged;
    CONFMAP[draft.id] = worseConf(CONFMAP[draft.id], confidence);
    // also consume exact-duplicate siblings (same content) so a de-duped cluster can complete
    var sibs = {};
    if (HIDE_DUPES) {
      var chosen = {};
      c.remaining.forEach(function(f){ if (names.indexOf(f.name) >= 0){ var k=eTagOf(f); if(k) chosen[k]=1; } });
      c.remaining.forEach(function(f){ if (names.indexOf(f.name) < 0){ var k=eTagOf(f); if (k && chosen[k]) sibs[f.name]=1; } });
    }
    c.remaining = c.remaining.filter(function(f){ return names.indexOf(f.name) < 0 && !sibs[f.name]; });
    log('ASSIGNED '+names.length+' photo(s) → '+label(draft)+' ['+confidence+'] (cluster #'+c._n+')');
    afterClusterChange(c);
  }
  function afterClusterChange(c) {
    if (window.MobileGallery) MobileGallery.afterChange(c);
    if (HIDE_COMPLETED && c.remaining.length === 0) { if (c._card && c._card.parentNode) c._card.parentNode.removeChild(c._card); }
    else if (c._card) fillCard(c);
    updateSummary();
  }

  // ───────────────────────── MODE 2: Recover by Listing ─────────────────────────
  // Start from a listing you recognize; the right pane shows every still-
  // unassigned photo; click to add them to the listing's gallery; Save. The
  // cluster queue (Mode 1) stays intact and shares the same pool.
  function poolFiles(){ var out = []; CLUSTERS.forEach(function(c){ out = out.concat(c.remaining); }); return out; }
  function removeFromPool(names){
    var set = {}; names.forEach(function(n){ set[n]=1; });
    var tags = {};
    if (HIDE_DUPES) CLUSTERS.forEach(function(c){ c.remaining.forEach(function(f){ if (set[f.name]){ var k=eTagOf(f); if(k) tags[k]=1; } }); });
    CLUSTERS.forEach(function(c){ c.remaining = c.remaining.filter(function(f){ if (set[f.name]) return false; if (HIDE_DUPES){ var k=eTagOf(f); if (k && tags[k]) return false; } return true; }); });
  }
  function byId(id){ for (var i=0;i<ALL_PROPS.length;i++) if (ALL_PROPS[i].id === id) return ALL_PROPS[i]; return null; }
  function nextNeedingGallery(){
    var list = ALL_PROPS.filter(function(x){ return SET91.has(x.id) && imgsOf(x).length === 0 && (!BL_AGENT || x.managed_by_party_id === BL_AGENT); });
    list.sort(function(a,b){ return displayTitle(a).localeCompare(displayTitle(b)); });
    return list[0] || null;
  }
  function isPhone(){ return window.matchMedia('(max-width:640px)').matches; }
  function galleryProgress(){
    var done = ALL_PROPS.filter(function(x){ return SET91.has(x.id) && imgsOf(x).length > 0; }).length;
    var total = SET91.size || 91;
    return { done: done, total: total, remaining: total - done };
  }
  // Advance the recovery queue to the next gallery-less listing (shared by
  // Save & Next and Skip). Shows the completion card when none remain.
  function blAdvance(){
    var next = nextNeedingGallery();
    if (next){ BL_SEL = next.id; openListingEditor(next); }
    else {
      detachKey(); BL_SEL = null;
      // Enrichment (titles, description, details, publish) happens in Smart
      // Import → Admin, NOT here. Recovery's one job is the photos.
      document.getElementById('bleditor').innerHTML =
        '<div class="card done">🎉 No more gallery-less listings'+(BL_AGENT?' for this agent':'')+'. Every one in scope has photos.</div>'+
        '<div class="card"><b>Next stage · Complete in Smart Import</b><div class="why" style="margin-top:4px">Galleries are reconnected. Finish the listings in Smart Import (generate title, description, details) → Admin (polish &amp; publish). Use “→ Smart Import” on any listing to send its photos into that flow.</div></div>';

  // Recovery → Smart Import handoff. Gallery Recovery is just another input
  // source (like a Facebook URL or a pasted description): it stages the chosen
  // photos and opens the existing Smart Import page. One pipeline, one AI, one

  var SI_MAX = 15;   // Smart Import's photo cap
  function sendToSmartImport(names, listingId){
    names = (names||[]).filter(Boolean);
    if (!names.length){ alert('Select the photos that belong together first.'); return; }
    if (names.length > SI_MAX && !confirm(names.length+' photos selected. Smart Import takes up to '+SI_MAX+' — the first '+SI_MAX+' will be sent. Continue?')) return;

      localStorage.setItem('pintag_gr_to_import', JSON.stringify({
        images: urls, source: 'gallery_recovery', listing_id: listingId || null, at: Date.now()
      }));
    } catch(e){ alert('Could not stage photos for Smart Import: '+e.message); return; }
    log('→ SMART IMPORT: staged '+urls.length+' photo(s)'+(listingId?' (from '+String(listingId).slice(0,8)+')':''));

    base = base.slice(0, 30);
    if (!base.length) { r.innerHTML = '<div class="why">No listings'+(BL_AGENT?' for this agent':'')+' match.</div>'; return; }
    base.forEach(function(d){
      var have = imgsOf(d).length;

  function openListingEditor(p){
    detachKey();
    var host = document.getElementById('bleditor');
    var ddp = dedup(poolFiles());
    var pool = ddp.files;               // stable, de-duplicated snapshot
    var added = {}, suggested = {};
    var focusIdx = pool.length ? 0 : -1, anchor = -1, curConf = 'high';

    function addedNames(){ return Object.keys(added); }
    function toggleOne(idx, allowAuto){
      if (idx<0 || idx>=pool.length) return;
      var n = pool[idx].name;
      if (added[n]) { delete added[n]; delete suggested[n]; }
      else {
        added[n] = true; delete suggested[n];
        if (allowAuto && AUTO_SELECT){ var cl = pool[idx]._cluster; pool.forEach(function(f){ if (f._cluster===cl && !added[f.name]){ added[f.name]=true; suggested[f.name]=true; } }); }
      }
    }
    function selectRange(a,b){ var lo=Math.min(a,b), hi=Math.max(a,b); for (var i=lo;i<=hi;i++){ added[pool[i].name]=true; delete suggested[pool[i].name]; } }
    function handleClick(idx, e){
      if (e.shiftKey && anchor>=0) selectRange(anchor, idx);
      else if (e.ctrlKey || e.metaKey){ toggleOne(idx, false); anchor=idx; }
      else anchor = idx;               // plain click = focus (no add)
      focusIdx = idx; draw();
    }
    function doSave(){ saveListingGallery(p, addedNames(), curConf); }

    // ---- MOBILE: the recovery queue. Listing dominates; available photos are
    // grouped by upload session (the strongest "these belong together" signal
    // we have today); tap to select like Photos; one tap saves and opens the
    // next gallery-less listing. Desktop keeps the keyboard editor (draw()).
    var hiddenG = {};   // upload-session groups the operator marked "not this listing" (session-only)
    function drawMobile(){
      var orig = imgsOf(p), an = addedNames();
      var prog = galleryProgress();
      // group the de-duped pool by upload burst; _cluster is the cluster ID
      // string (set at load), so resolve it to the cluster for its time label.
      var CBYID = {}; CLUSTERS.forEach(function(c){ CBYID[c.id] = c; });
      var groups = {};
      pool.forEach(function(f){ var k = f._cluster || '_'; if(!groups[k]) groups[k]={ key:k, cl:CBYID[k]||null, files:[] }; groups[k].files.push(f); });
      var glist = Object.keys(groups).map(function(k){ return groups[k]; })
        .filter(function(g){ return !hiddenG[g.key]; })

      if (VIEW!=='bylisting') return;
      var tag=(e.target&&e.target.tagName)||'';
      if ((tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') && e.key!=='Escape') return;
      if (e.key==='Enter'){ e.preventDefault(); doSave(); }
      else if (e.key==='Escape'){ e.preventDefault(); detachKey(); BL_SEL=null; host.innerHTML=''; }
      else if (e.key===' '){ e.preventDefault(); toggleOne(focusIdx, true); anchor=focusIdx; draw(); }
      else if (e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); if (focusIdx<pool.length-1){ focusIdx++; draw(); } }

  async function saveListingGallery(p, added, confidence){
    if (!added.length) { alert('Select photos first — click a photo then Space, dbl-click, or Shift-click a range.'); return; }
    var cur = imgsOf(p); var have = new Set(cur.map(nameOf));
    var merged = cur.concat(added.filter(function(n){ return !have.has(n); }).map(function(n){ return PUB + n; }));
    var r = await sb.from('properties').update({ images: merged }).eq('id', p.id).select('id');
    if (r.error) { alert('Failed: '+r.error.message); log('ERROR by-listing '+r.error.message); return; }
    var reg = await sb.from('gallery_assignments').insert([{ op:'assign', listing_id:p.id, cluster_id:'by-listing', photo_paths:added, photo_count:added.length, confidence:confidence, method:'manual', operator:OPERATOR }]);
    if (reg.error) log('WARN register insert failed: '+reg.error.message);
    p.images = merged; CONFMAP[p.id] = worseConf(CONFMAP[p.id], confidence);
    removeFromPool(added);
    log('BY-LISTING assigned '+added.length+' photo(s) → '+label(p)+' ['+confidence+']');
    // Recovery first, enrichment later: the mobile queue NEVER interrupts a
    // save to make a title — the listing is gallery-recovered + title-pending
    // and handled in the Title Pending queue at the end. Desktop keeps its
    // explicit opt-in "Auto AI-title after save" checkbox.
    if (!isPhone() && AUTO_TITLE && !nz(p.title_en)) {
      try { var gen = await generateTitles(p); var f = await saveTitles(p, gen); log('AI TITLE auto ['+f.join(', ')+'] → '+label(p)); }
      catch(e){ log('AI TITLE auto FAIL '+label(p)+': '+e.message); }
    }
    updateSummary();
    // inbox: advance to the next gallery-less listing (respecting the agent scope)
    blAdvance();

  // ───────────────────────── AI title recovery ─────────────────────────
  // Reuse the Smart Import AI (generate-listing-content) to produce a NEW
  // Pintag-quality title for gallery-complete listings whose title is missing.
  // Not historical reconstruction — publishable content. Never overwrites an
  // existing title; logged as source = recovery_ai_generated.
  function needsTitle(p){ return !nz(p.title_en); }               // the recovery gap (English)
  function aiBody(p){
    return {
      property_type: p.property_type||null, property_style: p.property_style||null,
      transaction_type: p.transaction_type||null, bedrooms: p.bedrooms||null, bathrooms: p.bathrooms||null,
      price_display: p.price_display||null, village: p.village_en||p.village||null, district: p.district_en||null,
      features: Array.isArray(p.features)?p.features:null,
      nearby_places: Array.isArray(p.nearby_places)?p.nearby_places:null,
      existing_title: p.title_lo || p.title_en || null           // surviving Lao title = the base
    };
  }
  async function generateTitles(p){
    var res = await sb.functions.invoke('generate-listing-content', { body: aiBody(p) });
    if (res.error) throw new Error(res.error.message || 'AI request failed');
    var d = res.data || {};
    if (d.error) throw new Error(d.error);
    return { title_lo: d.title_lo||'', title_en: d.title_en||'', title_zh: d.title_zh||'' };
  }
  async function saveTitles(p, gen, source){
    source = source || 'recovery_ai_generated';
    var patch = {}, filled = [];
    ['title_lo','title_en','title_zh'].forEach(function(f){ if (!nz(p[f]) && nz(gen[f])) { patch[f] = gen[f]; filled.push(f); } });
    if (!filled.length) return [];
    var r = await sb.from('properties').update(patch).eq('id', p.id).select('id');
    if (r.error) throw new Error(r.error.message);
    var evt = source === 'manual' ? 'manual_entry' : 'ai_generation';
    var rows = filled.map(function(f){ return { listing_id:p.id, event_type:evt, field_name:f, old_value:null, new_value:patch[f], source:source, actor:OPERATOR, details:{ via:'gallery-recovery', model: source==='manual'?null:'gemini-2.5-flash' } }; });
    var reg = await sb.from('listing_provenance').insert(rows);
    if (reg.error) log('WARN provenance insert failed: '+reg.error.message);
    filled.forEach(function(f){ p[f] = patch[f]; });
    return filled;
  }

  async function bulkTitles(targets){
    var m = showModal('<div class="mtitle">Generating AI titles…</div><div class="why bulkprog">Starting…</div>');
    var prog = m.body.querySelector('.bulkprog'), ok = 0, fail = [];

  // ───────────────────────── MOBILE gallery assignment ─────────────────────────
  // Photos/Files-style: tap a big tile to toggle (✓ + teal border), long-press to
  // preview, a sticky thumb bar to act, and a bottom-sheet listing picker. Desktop
  // is untouched (everything below is gated on a phone-width media query). The
  // native checkboxes remain the single source of truth, so assign()/renderCands()
  // work unchanged — this only changes how those checkboxes are driven and shown.
  var MobileGallery = (function(){
    var mq = window.matchMedia('(max-width:640px)');
    function isM(){ return mq.matches; }
    var bar=null, sheet=null, pv=null, activeCard=null;

    // Room classification is not present on recovery photos yet ("optional AI
    // classification later"). roomOf() returns null today, so the quick-filter
    // row stays empty and hidden; the moment photos carry a room type it lights up.
    var ROOMS=[['bedroom','Bedroom'],['living_room','Living room'],['kitchen','Kitchen'],['bathroom','Bathroom'],['exterior','Exterior'],['pool','Pool']];
    function roomOf(f){ return (f && (f.room_type||f.roomType)) || null; }

    function ensureBar(){
      if (bar) return;
      bar=document.createElement('div'); bar.className='mbar hide';
      bar.innerHTML='<span class="mc">0 selected</span>'+
        '<button class="ghost b-all">Select all</button>'+
        '<button class="ghost b-clr">Clear</button>'+
        '<button class="b-add">Add to gallery</button>';
      document.body.appendChild(bar);
      bar.querySelector('.b-all').onclick=function(){ if(activeCard) setAll(activeCard,true); };
      bar.querySelector('.b-clr').onclick=function(){ if(activeCard) setAll(activeCard,false); };
      bar.querySelector('.b-add').onclick=function(){ if(activeCard) openPicker(activeCard); };
    }
    function inputs(card){ return [].slice.call(card.querySelectorAll('.gallery input')); }
    function count(card){ return inputs(card).filter(function(x){return x.checked;}).length; }
    function setAll(card,on){ inputs(card).forEach(function(x){ x.checked=on; }); sync(card); }
    function sync(card){
      if(!isM()||!card) return;
      activeCard=card; ensureBar();
      var n=count(card);
      bar.querySelector('.mc').textContent=n+' selected';
      bar.classList.toggle('hide', n===0);
    }

    // Wire one freshly-rendered card (called from fillCard).
    function wire(card){
      if(!isM()||!card) return;
      inputs(card).forEach(function(x){ x.checked=false; });   // Photos-model: start empty, pick up
      // quick-filter chips (only if any photo classifies)
      var qf=card.querySelector('.qfilters');
      if(qf){ qf.innerHTML='';
        var present={}; card._cluster.remaining.forEach(function(f){ var r=roomOf(f); if(r) present[r]=1; });
        if(Object.keys(present).length){
          ROOMS.forEach(function(r){ if(!present[r[0]]) return;
            var b=document.createElement('button'); b.className='qchip'; b.textContent=r[1]; b.dataset.room=r[0];
            b.onclick=function(){ var on=b.classList.toggle('on'); filterRoom(card, on?r[0]:null, b); };
            qf.appendChild(b);
          });
        }
      }
      // per-tile: tap toggles (native, via label); long-press previews
      [].forEach.call(card.querySelectorAll('.photo'), function(lbl){
        var t, longFired=false;
        lbl.addEventListener('touchstart', function(){ longFired=false; t=setTimeout(function(){ longFired=true; openPreview(card, lbl); }, 460); }, {passive:true});
        lbl.addEventListener('touchmove', function(){ clearTimeout(t); }, {passive:true});   // scrolling stays smooth
        lbl.addEventListener('touchend', function(){ clearTimeout(t); }, {passive:true});
        lbl.addEventListener('click', function(e){ if(longFired){ e.preventDefault(); e.stopPropagation(); longFired=false; } }, true);
        var inp=lbl.querySelector('input');
        if(inp) inp.addEventListener('change', function(){ sync(card); });
      });
      sync(card);
    }
    function filterRoom(card, room, chip){
      // single-select chips
      [].forEach.call(card.querySelectorAll('.qchip'), function(c){ if(c!==chip) c.classList.remove('on'); });
      var files=card._cluster.remaining, tiles=card.querySelectorAll('.photo');
      [].forEach.call(tiles, function(lbl){
        var nm=lbl.getAttribute('data-name'); var f=null;
        for(var i=0;i<files.length;i++){ if(files[i].name===nm){ f=files[i]; break; } }
        lbl.style.display=(!room || roomOf(f)===room)?'':'none';
      });
    }

    function openPicker(card){
      var c=card._cluster; if(!c) return;
      closeSheet();
      sheet=document.createElement('div'); sheet.className='overlay'; sheet.style.alignItems='flex-end'; sheet.style.padding='0';
      sheet.innerHTML='<div class="modal" style="max-width:none;border-radius:14px 14px 0 0;max-height:80vh">'+
        '<div class="mtitle">Add '+count(card)+' photo(s) to…</div>'+
        '<div class="ctrls" style="display:flex"><span class="cfl">Confidence:</span>'+
          '<select class="confsel"><option value="high">HIGH</option><option value="medium">MEDIUM</option><option value="low">LOW</option></select>'+
          '<button class="ghost s-close" style="margin-left:auto">Close</button></div>'+
        '<input class="search s-search" placeholder="Search listing by agent, district, type, or title…">'+
        '<div class="cands s-cands" style="display:block"></div></div>';
      document.body.appendChild(sheet);
      sheet.addEventListener('click', function(e){ if(e.target===sheet) closeSheet(); });
      var input=sheet.querySelector('.s-search'), cd=sheet.querySelector('.s-cands'), conf=sheet.querySelector('.confsel');
      sheet.querySelector('.s-close').onclick=closeSheet;
      var refresh=function(){ renderCands(c, card, cd, input.value, conf); };  // reads card's checked inputs — unchanged
      input.oninput=refresh; refresh(); input.focus();
    }
    function closeSheet(){ if(sheet&&sheet.parentNode){ sheet.parentNode.removeChild(sheet); } sheet=null; }

    function openPreview(card, lbl){
      var files=card._cluster.remaining.filter(function(f){ // honor an active room filter's visible set
        var tile=card.querySelector('.photo[data-name="'+cssq(f.name)+'"]'); return !tile||tile.style.display!=='none'; });
      var idx=0, want=lbl.getAttribute('data-name');
      for(var i=0;i<files.length;i++){ if(files[i].name===want){ idx=i; break; } }
      if(pv&&pv.parentNode) pv.parentNode.removeChild(pv);
      pv=document.createElement('div'); pv.className='pv';
      pv.innerHTML='<div class="pvtop"><span class="pvcount"></span><button class="pvclose">✕ Close</button></div>'+
        '<div class="pvwrap"><img alt=""></div>'+
        '<div class="pvbtns"><button class="nav2 pvprev">‹</button>'+
          '<button class="pvsel"></button><button class="nav2 pvnext">›</button></div>';
      document.body.appendChild(pv);
      var img=pv.querySelector('img'), selBtn=pv.querySelector('.pvsel'), cnt=pv.querySelector('.pvcount');
      function chkFor(name){ return card.querySelector('.gallery input[data-name="'+cssq(name)+'"]'); }
      function draw(){
        var f=files[idx]; img.src=PUB+f.name; cnt.textContent=(idx+1)+' / '+files.length;
        var on=chkFor(f.name).checked; selBtn.textContent=on?'✓ Selected':'Select';
        selBtn.className='pvsel '+(on?'on':'off');
      }
      function step(d){ idx=(idx+d+files.length)%files.length; draw(); }
      pv.querySelector('.pvprev').onclick=function(){ step(-1); };
      pv.querySelector('.pvnext').onclick=function(){ step(1); };
      selBtn.onclick=function(){ var ch=chkFor(files[idx].name); ch.checked=!ch.checked; sync(card); draw(); };
      pv.querySelector('.pvclose').onclick=closePreview;
      // swipe to navigate (Photos convention)
      var sx=null; pv.querySelector('.pvwrap').addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; }, {passive:true});
      pv.querySelector('.pvwrap').addEventListener('touchend', function(e){ if(sx==null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45) step(dx<0?1:-1); sx=null; }, {passive:true});
      draw();
    }
    function closePreview(){ if(pv&&pv.parentNode) pv.parentNode.removeChild(pv); pv=null; }
    function cssq(s){ return String(s).replace(/["\\]/g,'\\$&'); }

    function afterChange(c){
      // the active cluster just changed (assigned/refilled) — drop the stale bar + sheet
      if(sheet) closeSheet();
      if(activeCard && (!c || activeCard._cluster===c)){ activeCard=null; if(bar) bar.classList.add('hide'); }
    }

    return { wire:wire, sync:sync, afterChange:afterChange };
  })();
  window.MobileGallery = MobileGallery;
})();
</script>
</body>
</html>
