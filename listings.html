async function loadListings() {
  try {
    var res = await fetch(SUPABASE_URL + '/rest/v1/properties?or=(status.neq.draft,status.is.null)&order=is_featured.desc,created_at.desc&select=*,contacts(role,name),parties(type,name_en,photo_url),unit_types(id,sort_order,name_en,name_lo,name_zh,price_display,sale_price,rent_price,rent_period,price_amount,price_currency,price_frequency,rent_price_amount,rent_price_currency,rent_price_frequency,is_available,available_count,total_units,next_available_date)', {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('unexpected response');
    allProperties = rows;
    _listingsLoaded = true;
    populateProvinceOptions();
    populateDistrictOptions();
    renderPriceOptions();
    renderListings();
    // The populate/renderPriceOptions calls above may have reset a URL value
    // with no inventory (a stale province, a band from the other Rent/Sale
    // set); the address bar must show what is actually applied.
    _writeFiltersToUrl();
  } catch(e) {
    // A failed load must never leave the header on "Loading…", leave a
    // non-array in allProperties (every later filter click would throw), or
    // strand the visitor without a way to try again.
    allProperties = [];
    var countEl = document.getElementById('count-text');
    if (countEl) countEl.innerHTML =
      '<span class="lo-i">ໂຫຼດບໍ່ສຳເລັດ</span><span class="en-i">Could not load listings</span><span class="zh-i">加载失败</span>';
    var container = document.getElementById('listings-container');
    container.innerHTML = '<div style="grid-column:1/-1;" class="state-center"><p class="state-title lo-i">ເກີດຂໍ້ຜິດພາດ ກະລຸນາລອງໃໝ່</p><p class="state-title en-i">Something went wrong, please try again</p><p class="state-title zh-i">出现错误，请重试</p>'
      + '<p><button type="button" class="filter-btn" id="listings-retry" onclick="loadListings()"><span class="lo-i">ລອງໃໝ່</span><span class="en-i">Retry</span><span class="zh-i">重试</span></button></p></div>';
  }
}
var _listingsLoaded = false;

// ── FILTER STATE IN THE URL (QA 2026-09-02) ───────────────────────────────
// Filters used to live only in memory: refresh, back/forward and a shared
// link all lost them, and listing.html's Buy/Rent links (?filter=for_sale)
// landed on "All". The setters below mirror their state into the address bar
// with replaceState (no history entries, same as reflectLangInUrl), and this
// reads it back before the first load. Unknown values are ignored;
// province/district are validated against inventory by the populate* calls.
function _readFiltersFromUrl() {
  var q;
  try { q = new URLSearchParams(window.location.search); } catch (e) { return; }
  var tx = q.get('tx') || q.get('filter');
  if (tx === 'for_rent' || tx === 'for_sale') {
    currentTxFilter = tx;
    document.querySelectorAll('.tx-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-filter') === tx); });
    updateRentalFiltersVisibility();
  }
  var type = q.get('type');
  // Validated by comparing attribute values, never by interpolating the
  // query into a selector: `?type=a"b` made querySelector throw at top
  // level, which aborted the script before loadListings() ever ran.
  var typeBtns = Array.prototype.slice.call(document.querySelectorAll('.filter-btn'));
  if (type && typeBtns.some(function(b){ return b.getAttribute('data-filter') === type; })) {
    currentTypeFilter = type;
    typeBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-filter') === type); });
  }
  if (currentTxFilter === 'for_rent') {
    if (q.get('pet') === '1') { currentPetFriendly = true; var _pb = document.getElementById('rf-pet'); if (_pb) _pb.classList.add('active'); }
    if (q.get('smoking') === '1') { currentSmokingAllowed = true; var _sb = document.getElementById('rf-smoking-allowed'); if (_sb) _sb.classList.add('active'); }
  }
  if (q.get('avail') === 'available') {
    currentAvailOnly = true;
    document.querySelectorAll('.avail-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-avail') === 'available'); });
  }
  if (q.get('province')) currentProvinceFilter = q.get('province');
  if (q.get('district')) currentDistrictFilter = q.get('district');
  if (q.get('price')) currentPriceBand = q.get('price');
  var sort = q.get('sort');
  var sortSel = document.getElementById('sort-select');
  if (sort && sortSel && Array.from(sortSel.options).some(function(o){ return o.value === sort; })) {
    currentSort = sort;
    sortSel.value = sort;
  }
}
function _writeFiltersToUrl() {
  try {
    var url = new URL(window.location.href);
    var set = function (k, v, def) { if (v && v !== def) url.searchParams.set(k, v); else url.searchParams.delete(k); };
    set('tx', currentTxFilter, 'all');
    url.searchParams.delete('filter');           // legacy alias, normalised to tx
    set('type', currentTypeFilter, 'all');
    set('province', currentProvinceFilter, 'all');
    set('district', currentDistrictFilter, 'all');
    set('price', currentPriceBand, 'all');
    set('sort', currentSort, 'newest');
    set('avail', currentAvailOnly ? 'available' : '', '');
    set('pet', currentPetFriendly ? '1' : '', '');
    set('smoking', currentSmokingAllowed ? '1' : '', '');
    if (url.toString() !== window.location.href) history.replaceState(null, '', url.toString());
  } catch (e) {}
}

function setTxFilter(filter, btn) {
  currentTxFilter = filter;
  document.querySelectorAll('.tx-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  updateRentalFiltersVisibility();
  currentPriceBand = 'all';   // rent vs sale price scales differ -> reset the band
  renderPriceOptions();
  _applyFilterChange();
}

// Pet Friendly / Smoking Allowed only make sense once the visitor has
// actually narrowed to rentals -- showing them under "All" or "For Sale"
// would ask a sale-listing question with no possible answer. Also clears
// any active selection when hidden, so switching away from For Rent and
// back never leaves a stale filter silently applied.
function updateRentalFiltersVisibility() {
  var show = currentTxFilter === 'for_rent';
  var wrap = document.getElementById('rental-filters');
  var sep = document.getElementById('rental-filters-sep');
  if (wrap) wrap.style.display = show ? '' : 'none';
  if (sep) sep.style.display = show ? '' : 'none';
  if (!show && (currentPetFriendly || currentSmokingAllowed)) {
    currentPetFriendly = false;
    currentSmokingAllowed = false;
    var petBtn = document.getElementById('rf-pet');
    var smokeBtn = document.getElementById('rf-smoking-allowed');
    if (petBtn) petBtn.classList.remove('active');
    if (smokeBtn) smokeBtn.classList.remove('active');
  }
}

function toggleRentalFilter(kind, btn) {
  if (kind === 'pet') { currentPetFriendly = !currentPetFriendly; }
  else if (kind === 'smoking') { currentSmokingAllowed = !currentSmokingAllowed; }
  btn.classList.toggle('active');
  _applyFilterChange();
}

// Single source of truth: reads the exact same rental-terms.js registry/
// resolver Add Listing, Edit Listing, Admin, and the public listing page
// all read from -- no parallel pet/smoking filter logic. Building-level
// values only (no unit_types embed on this list query), matching how
// every other card-level fact on this page already works.
//
// Smoking Allowed, not "No Smoking": most rentals already prohibit
// smoking, so a No-Smoking toggle would match the majority of listings
// and add little value. Off (default) shows every rental; On narrows to
// smoking_policy==='allowed' only. The listing detail page still shows
// the actual policy either way -- this is a search-narrowing control.
function matchesRentalFilters(p) {
  if (!currentPetFriendly && !currentSmokingAllowed) return true;
  if (typeof resolveRentalTerms !== 'function') return true;
  var values = resolveRentalTerms(p, null).values;
  if (currentPetFriendly && values.pet_policy !== 'allowed') return false;
  if (currentSmokingAllowed && values.smoking_policy !== 'allowed') return false;
  return true;
}

// ── District + Price-range filters (Priority 3) ───────────────────────────
// Transaction-aware price bands: rent is $/month, sale is a total, so the two
// use different band sets and the band resets when Rent/Sale changes. Currency:
// bands are USD; a non-USD listing is never hidden by a price band (mixing
// currencies without conversion is the same pre-existing limitation the sort
// already accepts), so the filter narrows the USD majority and never wrongly
// drops a LAK/THB listing.
var PRICE_BANDS = {
  all: [ {key:'all', min:null, max:null, label:{lo:'ທຸກລາຄາ', en:'Any price', zh:'不限价格'}} ],
  for_rent: [
    {key:'all', min:null, max:null,  label:{lo:'ທຸກລາຄາ',        en:'Any price',    zh:'不限价格'}},
    {key:'r1',  min:null, max:300,   label:{lo:'ຕ່ຳກວ່າ $300',    en:'Under $300',   zh:'$300 以下'}},
    {key:'r2',  min:300,  max:600,   label:{lo:'$300–600',        en:'$300–600',     zh:'$300–600'}},
    {key:'r3',  min:600,  max:1000,  label:{lo:'$600–1,000',      en:'$600–1,000',   zh:'$600–1,000'}},
    {key:'r4',  min:1000, max:null,  label:{lo:'ຫຼາຍກວ່າ $1,000', en:'Over $1,000',  zh:'$1,000 以上'}}
  ],
  for_sale: [
    {key:'all', min:null,   max:null,   label:{lo:'ທຸກລາຄາ',           en:'Any price',  zh:'不限价格'}},
    {key:'s1',  min:null,   max:50000,  label:{lo:'ຕ່ຳກວ່າ $50,000',   en:'Under $50k', zh:'$5万以下'}},
    {key:'s2',  min:50000,  max:150000, label:{lo:'$50k–150k',         en:'$50k–150k',  zh:'$5万–15万'}},
    {key:'s3',  min:150000, max:300000, label:{lo:'$150k–300k',        en:'$150k–300k', zh:'$15万–30万'}},
    {key:'s4',  min:300000, max:null,   label:{lo:'ຫຼາຍກວ່າ $300,000', en:'Over $300k', zh:'$30万以上'}}
  ]
};
function currentPriceBands() { return PRICE_BANDS[currentTxFilter] || PRICE_BANDS.all; }
function currentPriceBandDef() {
  var bands = currentPriceBands();
  for (var i = 0; i < bands.length; i++) { if (bands[i].key === currentPriceBand) return bands[i]; }
  return bands[0];
}
function matchesPriceBand(p) {
  var band = currentPriceBandDef();
  if (band.min == null && band.max == null) return true;    // Any price
  // Currency comes from the SAME resolution step as the amount, so a
  // fully-occupied listing priced in LAK only on its unit types is still
  // recognised as non-USD instead of being banded against USD thresholds
  // (properties.price_currency is null on those rows alongside the amount).
  var resolved = _resolvedPriceForCurrentTx(p);
  var cur = resolved.currency || p.price_currency || 'USD';
  if (cur !== 'USD') return true;                           // never drop non-USD (no conversion)
  var v = resolved.amount;
  if (!v) return true;                                      // no price on file -> don't hide
  // Half-open [min, max), the same contract as budget-bands.js's
  // bandContains(): the bands above share their edges ($300 ends "Under
  // $300" and starts "$300-600"), so an inclusive max put a $300 rental in
  // both and a $50,000 sale in both "Under $50k" and "$50k-150k".
  if (band.min != null && v < band.min) return false;
  if (band.max != null && v >= band.max) return false;
  return true;
}
// A sale_or_rent listing under "For Rent" is priced on its RENT leg, not its
// sale price (which is what price_amount holds for that transaction). Shared
// by the band predicate and the map bubble so the marker can never show $250k
// for a villa that "Over $1,000" kept because it rents for $1,200.
function _resolvedPriceForCurrentTx(p) {
  if (currentTxFilter === 'for_rent' && p.transaction_type === 'sale_or_rent' && p.rent_price_amount != null) {
    return { amount: p.rent_price_amount, currency: p.rent_price_currency || null };
  }
  return _resolvedPrice(p);
}
// The ONE predicate BOTH views (grid + map) filter through, so a dimension can
// never apply to one view but not the other.
function matchesActiveFilters(p, opts) {
  // opts.ignoreProvince — used when BUILDING the province list. Counting a
  // province through its own filter would collapse the list to whatever is
  // already selected, so the axis being populated is excluded from its own
  // count. Every other filter still applies, which is what keeps the counts
  // honest.
  var _ignoreProvince = opts && opts.ignoreProvince;
  var _ignoreDistrict = opts && opts.ignoreDistrict;
  if (!(currentTxFilter === 'all' || p.transaction_type === currentTxFilter || p.transaction_type === 'sale_or_rent')) return false;
  if (!(currentTypeFilter === 'all' || p.property_type === currentTypeFilter)) return false;
  if (currentAvailOnly && !isAvailableStatus(p)) return false;
  if (!matchesRentalFilters(p)) return false;
  if (!_ignoreProvince && currentProvinceFilter !== 'all' && _listingProvince(p) !== currentProvinceFilter) return false;
  if (!_ignoreDistrict && currentDistrictFilter !== 'all' && (p.district_en || p.district || '') !== currentDistrictFilter) return false;
  if (!matchesPriceBand(p)) return false;
  return true;
}
function setDistrictFilter(val) {
  currentDistrictFilter = val;
  _applyFilterChange();
}
function setPriceFilter(val) {
  currentPriceBand = val;
  _applyFilterChange();
}
// Rebuild the Price dropdown for the current Rent/Sale bands, in the current
// language, preserving the selected band when it still exists.
function renderPriceOptions() {
  var sel = document.getElementById('price-select');
  if (!sel) return;
  var lang = getCurrentLang();
  var bands = currentPriceBands();
  if (!bands.some(function(b){ return b.key === currentPriceBand; })) currentPriceBand = 'all';
  sel.innerHTML = bands.map(function(b){ return '<option value="' + b.key + '">' + esc(b.label[lang] || b.label.en) + '</option>'; }).join('');
  sel.value = currentPriceBand;
}
// Populate the District dropdown from the districts actually present in the
// data, in the current language, preserving the current selection.
// The 7 Vientiane Capital districts. Used ONLY to resolve a legacy listing
// that predates properties.province_en; a backfilled row answers from its own
// column and never consults this.
var VIENTIANE_CAPITAL_DISTRICTS = ['Sisattanak','Saysettha','Chanthabouly',
  'Sikhottabong','Xaythany','Hadxaifong','Naxaithong'];

function _listingProvince(p) {
  return (typeof resolveListingProvince === 'function')
    ? resolveListingProvince(p, VIENTIANE_CAPITAL_DISTRICTS)
    : (p.province_en || null);
}

function setProvinceFilter(val) {
  currentProvinceFilter = val;
  // Changing province can strand a district selection from the old province.
  // populateDistrictOptions() re-derives the district list from what is
  // actually visible now and resets a stranded value, so the two selects can
  // never combine into a guaranteed-empty result.
  _applyFilterChange();
}

// THE CUSTOMER-FACING PROVINCE FILTER — inventory-driven and CONTEXTUAL.
//
// Built from the listings the page actually fetched, so it inherits the
// existing visibility rules verbatim: the REST query already excludes drafts
// (or=(status.neq.draft,status.is.null)) and RLS excludes everything else
// non-public. There is deliberately no second definition of "published" here.
//
// `matches` applies every OTHER active filter, so the province list can never
// promise inventory that disappears the moment the customer's existing
// Rent/Apartment selection is applied — and a province with zero visible
// matches is simply absent rather than offered and then empty.
function populateProvinceOptions() {
  var sel = document.getElementById('province-select');
  if (!sel || typeof resolveAvailableProvinces !== 'function') return;
  var lang = getCurrentLang();

  var available = resolveAvailableProvinces(allProperties, {
    vientianeDistricts: VIENTIANE_CAPITAL_DISTRICTS,
    matches: function (p) { return matchesActiveFilters(p, { ignoreProvince: true }); }
  });

  // A selection that no longer has inventory resets to "all" rather than
  // stranding the customer on an empty result set.
  var keys = available.map(function (a) { return a.key; });
  if (currentProvinceFilter !== 'all' && keys.indexOf(currentProvinceFilter) === -1) {
    currentProvinceFilter = 'all';
  }
  var anyLabel = ({lo:'ທຸກແຂວງ', en:'All provinces', zh:'所有省份'})[lang] || 'All provinces';
  sel.innerHTML = '<option value="all">' + esc(anyLabel) + '</option>' +
    available.map(function (a) {
      return '<option value="' + esc(a.key) + '">' +
             esc(provinceLabel(a.key, lang)) + ' (' + a.count + ')</option>';
    }).join('');
  sel.value = currentProvinceFilter;
  // One province and nothing to choose between is noise, not a filter.
  sel.parentNode && (sel.style.display = available.length > 1 ? '' : 'none');
}

function populateDistrictOptions() {
  var sel = document.getElementById('district-select');
  if (!sel) return;
  var lang = getCurrentLang();
  // Contextual, exactly like the province list above: only districts that
  // still have visible inventory under every OTHER active filter (including
  // the selected province). Otherwise picking a province could leave district
  // options that are guaranteed to return nothing.
  // Keyed by the English district (the value the filter predicate compares
  // against); the option TEXT is the current language's column, the same one
  // the cards and the map preview show, so a Lao visitor is not asked to
  // match "Sisattanak" against cards that all say "ສີສັດຕະນາກ".
  var seen = {}, labels = {}, counts = {};
  allProperties.forEach(function(p){
    if (!matchesActiveFilters(p, { ignoreDistrict: true })) return;
    var d = p.district_en || p.district; if (!d) return;
    seen[d] = true;
    counts[d] = (counts[d] || 0) + 1;
    if (!labels[d] && p['district_' + lang]) labels[d] = p['district_' + lang];
  });
  var districts = Object.keys(seen).sort();
  var anyLabel = ({lo:'ທຸກເມືອງ', en:'All districts', zh:'所有城区'})[lang] || 'All districts';
  if (currentDistrictFilter !== 'all' && districts.indexOf(currentDistrictFilter) === -1) currentDistrictFilter = 'all';
  sel.innerHTML = '<option value="all">' + esc(anyLabel) + '</option>' +
    districts.map(function(d){
      return '<option value="' + esc(d) + '">' + esc(labels[d] || d) + ' (' + counts[d] + ')</option>';
    }).join('');
  sel.value = currentDistrictFilter;
}

function setTypeFilter(filter, btn) {
  currentTypeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  _applyFilterChange();
}

function setSort(val) {
  currentSort = val;
  if (_viewMode === 'list') renderListings();
  _writeFiltersToUrl();
}

// ── BEHAVIORAL EVENT TRACKING (Intelligence layer) ────
// Pure instrumentation of the existing search/browse/click flow — no
// change to what's searchable or how results are filtered/sorted.
// Fire-and-forget: never blocks rendering or navigation.
function postEvent(table, body) {
  fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(body),
    keepalive: true
  }).catch(function(){});
}

var _searchEventTimer = null;
function scheduleBehavioralEvents(sorted) {
  // Debounced so adjusting several filters in a row logs one settled
  // search, not one per intermediate click.
  clearTimeout(_searchEventTimer);
  _searchEventTimer = setTimeout(function() {
    var sessionId = getOrCreateSessionId();
    var _band = currentPriceBandDef();
    postEvent('search_events', {
      session_id: sessionId,
      district: currentDistrictFilter === 'all' ? null : currentDistrictFilter,
      property_type: currentTypeFilter === 'all' ? null : currentTypeFilter,
      transaction_type: currentTxFilter === 'all' ? null : currentTxFilter,
      price_min: _band.min,
      price_max: _band.max,
      result_count: sorted.length
    });
    if (!sorted.length) return;
    var filtersSnapshot = { tx: currentTxFilter, type: currentTypeFilter, district: currentDistrictFilter, price: currentPriceBand, avail: currentAvailOnly, sort: currentSort };
    var rows = sorted.filter(function(p){ return p.id; }).map(function(p, idx){
      return {
        property_id: p.id,
        event_type: 'impression',
        session_id: sessionId,
        source: 'search',
        search_position: idx + 1,
        search_filters: filtersSnapshot
      };
    });
    if (rows.length) postEvent('listing_events', rows);
  }, 500);
}

// ── Open Graph / <title> / meta description — static today, structured
// for dynamic filtered previews later (per-filter social-preview cards
// are a real future goal — see the header comment on
// updateListingsMetaForFilters() below for exactly what would still need
// to be built and why this function alone doesn't get you there yet).
// Trilingual copy for the default (unfiltered) and per-filter title/
// description, keyed by getCurrentLang()'s three values -- the single
// source both the static <head> (Lao, the actual default resolved
// language on a plain request) and updateListingsMetaForFilters() below
// read, so nothing is ever translated separately in two places.
var LISTINGS_META_I18N = {
  lo: {
    defaultTitle: 'ຊັບສິນໃຫ້ເຊົ່າ ແລະ ຂາຍ ໃນລາວ | Pintag',
    defaultDescription: 'ຄົ້ນຫາອາພາດເມັນ, ເຮືອນ, ຄອນໂດ, ທີ່ດິນ ແລະ ອາຄານທຸລະກິດທີ່ຢືນຢັນແລ້ວທົ່ວປະເທດລາວ. ອັບເດດທຸກມື້ພ້ອມຮູບພາບ, ລາຄາ ແລະ ແຜນທີ່.',
    rent: 'ໃຫ້ເຊົ່າ', sale: 'ຂາຍ',
    subjectJoiner: ' ', subjectSuffix: ' ໃນລາວ | Pintag',
    descPrefix: 'ຄົ້ນຫາລາຍການ ', descSuffix: ' ທີ່ຢືນຢັນແລ້ວທົ່ວປະເທດລາວ. ອັບເດດທຸກມື້ພ້ອມຮູບພາບ, ລາຄາ ແລະ ແຜນທີ່.',
    locale: 'lo_LA'
  },
  en: {
    defaultTitle: 'Properties for Rent & Sale in Laos | Pintag',
    defaultDescription: 'Browse verified apartments, houses, condos, land and commercial properties across Laos. Updated daily with photos, prices and maps.',
    rent: 'For Rent', sale: 'For Sale',
    subjectJoiner: ' ', subjectSuffix: ' in Laos | Pintag',
    descPrefix: 'Browse verified ', descSuffix: ' listings across Laos. Updated daily with photos, prices and maps.',
    locale: 'en_US'
  },
  zh: {
    defaultTitle: '老挝出租出售房产 | Pintag',
    defaultDescription: '浏览老挝各地已核实的公寓、房屋、公寓大楼、土地和商业地产。每日更新，含照片、价格与地图。',
    rent: '租房', sale: '出售',
    subjectJoiner: '', subjectSuffix: ' | Pintag',
    descPrefix: '浏览老挝各地已核实的', descSuffix: '房源。每日更新，含照片、价格与地图。',
    locale: 'zh_CN'
  }
};

function _setListingsMeta(sel, val) {
  var el = document.querySelector(sel);
  if (el) el.setAttribute('content', val);
}

// Builds a filter-aware title/description from the current filter state
// (property type + transaction type — the two live filters this page has
// today; a future district/price filter slots in here the same way) and
// writes them to document.title plus every og:/twitter: meta tag, using
// the exact same PROPERTY_TYPES registry admin.html/listing.html already
// use for this vocabulary, so a label is never translated in two places.
//
// IMPORTANT — this updates the LIVE DOM only. It correctly changes what
// the visitor's own browser tab shows, and what any crawler that executes
// JavaScript sees (Google's renderer does). It does NOT change what
// WhatsApp/Facebook/Messenger/Telegram/Discord/LinkedIn/X show in a link
// preview: those services fetch the raw HTML once and never execute
// JavaScript, so they only ever see whatever is already baked into the
// initial <head> at request time — the static tags set in listings.html's
// <head>, unconditionally, regardless of any ?type=/?tx= in the shared
// URL. Making a *shared link* for "Houses for Sale" or "Sisattanak
// District" show its own distinct social-preview card requires one of:
//   (a) a small set of pre-rendered static pages per popular filter
//       combination (e.g. houses-for-sale.html), each with its own
//       hardcoded OG tags — the same pattern already used for
//       listing.html's per-property pages, or
//   (b) a server-side/edge prerendering layer that detects a crawler
//       user-agent and serves pre-built HTML with the right tags for
//       that specific filter combination.
// Neither exists yet. This function is the intended seam for whichever
// approach is chosen: it already contains the "which filters produce
// which title/description" logic in one place, so adding real per-filter
// previews later means feeding this same logic into a static-page
// generator or an edge function, not rewriting how titles/descriptions
// are derived.
function updateListingsMetaForFilters() {
  var lang = getCurrentLang();
  var t = LISTINGS_META_I18N[lang] || LISTINGS_META_I18N.lo;
  var typeLabel = (currentTypeFilter !== 'all' && typeof PROPERTY_TYPES !== 'undefined' && PROPERTY_TYPES[currentTypeFilter])
    ? PROPERTY_TYPES[currentTypeFilter][lang] : null;
  var txLabel = currentTxFilter === 'for_rent' ? t.rent : currentTxFilter === 'for_sale' ? t.sale : null;

  var title = t.defaultTitle;
  var description = t.defaultDescription;
  if (typeLabel || txLabel) {
    var subject = [typeLabel, txLabel].filter(Boolean).join(t.subjectJoiner);
    title = subject + t.subjectSuffix;
    description = t.descPrefix + subject + t.descSuffix;
  }

  document.documentElement.setAttribute('lang', lang);
  document.title = title;
  _setListingsMeta('meta[name="description"]', description);
  _setListingsMeta('meta[property="og:title"]', title);
  _setListingsMeta('meta[property="og:description"]', description);
  _setListingsMeta('meta[property="og:locale"]', t.locale);
  _setListingsMeta('meta[name="twitter:title"]', title);
  _setListingsMeta('meta[name="twitter:description"]', description);
  // og:url / canonical deliberately untouched here, and this isn't a gap
  // to close: filtering never changes the address bar (no ?type=/?tx= is
  // written to the URL today), so the canonical/og:url value that's
  // already correct — https://pintag.io/listings.html — stays correct
  // for every filter state. Repointing canonical at a URL the address bar
  // doesn't actually show would be the bug, not the fix. If filters ever
  // start writing to the URL (the same way listing.html's ?unit= deep-link
  // param does), update canonical/og:url here too, to that real URL.
}

function renderListings() {
  // Nothing has loaded yet (first paint, or the load failed and the Retry
  // state is showing): leave the skeleton / error state in place. Any
  // filter or language click before data lands used to replace it with a
  // misleading "No listings found" -- and, after a failure, removed Retry.
  if (!_listingsLoaded) return;
  var filtered = allProperties.filter(matchesActiveFilters);
  var sorted = sortProperties(filtered);
  updateListingsMetaForFilters();

  // Derive trending_score from views_week (stable average from full dataset)
  var _wTotal = 0, _wCount = 0;
  allProperties.forEach(function(p) { if ((p.views_week||0) > 0) { _wTotal += p.views_week; _wCount++; } });
  var _avgW = _wCount > 0 ? _wTotal / _wCount : 0;
  sorted.forEach(function(p) {
    if (!p.trending_score && _avgW > 0) {
      p.trending_score = Math.round((p.views_week||0) / _avgW * 100);
    }
  });

  // Derive Best Value: price > 15% below group average (same district + type + transaction, min 3 peers)
  // Same resolution as the sort key: a fully-occupied building priced only on
  // its unit types must still count toward (and be eligible for) Best Value.
  var _grp = {};
  allProperties.forEach(function(p) {
    var np = _resolvedPrice(p).amount || parseNumericPrice(p.price_display);
    if (!np || !p.district_en || !p.property_type || !p.transaction_type) return;
    var k = p.district_en + '|' + p.property_type + '|' + p.transaction_type;
    if (!_grp[k]) _grp[k] = [];
    _grp[k].push(np);
  });
  var _grpAvg = {};
  Object.keys(_grp).forEach(function(k) {
    var arr = _grp[k];
    if (arr.length >= 3) _grpAvg[k] = arr.reduce(function(a,b){return a+b;},0) / arr.length;
  });
  sorted.forEach(function(p) {
    var np = _resolvedPrice(p).amount || parseNumericPrice(p.price_display);
    var k = (p.district_en||'') + '|' + (p.property_type||'') + '|' + (p.transaction_type||'');
    p._isBestValue = !!(np && _grpAvg[k] && np < _grpAvg[k] * 0.85);
  });

  scheduleBehavioralEvents(sorted);

  var lang = getCurrentLang();
  var saved = ptGetSavedSet();
  var n = filtered.length;

  updateCountText(n);

  var container = document.getElementById('listings-container');

  if (!sorted.length) {
    container.innerHTML =
      '<div style="grid-column:1/-1;" class="state-center">' +
        '<p class="state-title lo-i">ບໍ່ມີລາຍການ</p>' +
        '<p class="state-title en-i">No listings found</p>' +
        '<p class="state-title zh-i">暂无房源</p>' +
        '<p class="lo-i">ລອງປ່ຽນໂຕກອງ</p>' +
        '<p class="en-i">Try a different filter</p>' +
        '<p class="zh-i">尝试其他筛选条件</p>' +
      '</div>';
    return;
  }

  var featuredUsed = false;
  container.innerHTML = '';

  // ── PROGRESSIVE RENDERING (cached-egress fix) ─────────────────────────────
  // This grid used to append a card for EVERY matching listing in one pass.
  // With ~59 active listings and no image transformation available on this
  // Supabase project (the render endpoint answers 403 FeatureNotEnabled), that
  // is ~59 full-resolution originals -- about 19 MB -- fetched before the
  // visitor has scrolled once. loading="lazy" does not save it: the cards sit
  // in one CSS grid, so a desktop viewport puts many of them in range
  // immediately and the rest follow on the first scroll.
  //
  // Cards are now appended a page at a time. The DOM (and therefore the image
  // requests) grows only as the visitor actually scrolls. Filtering, sorting,
  // the featured card, the count line and the map are all untouched -- this
  // changes WHEN a card is created, never WHICH cards or in what order.
  var PT_PAGE_SIZE = 12;
  var _ptCursor = 0;

  function buildCard(p, idx) {
    var isFeaturedCard = p.is_featured && !featuredUsed;
    if (isFeaturedCard) featuredUsed = true;

    var imgCount = (p.images && p.images.length > 1) ? p.images.length : 0;
    var photoCountHtml = imgCount
      ? '<span class="photo-count">' +
          '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' +
          imgCount +
          '<span class="lo-i"> ຮູບ</span><span class="en-i"> photos</span><span class="zh-i"> 张</span>' +
        '</span>'
      : '';
    var aiHtml = p.video_url
      ? '<span class="ai-badge">▶ AI <span class="lo-i">ພາຊົມຮອບ</span><span class="en-i">Walkthrough</span><span class="zh-i">带看</span></span>'
      : '';
    var newBadgeHtml = isNewListing(p)
      ? '<div style="margin-top:4px;"><span class="badge-new-listing">' +
          (daysOld(p) < 1
            ? ({lo:'ໃໝ່ວັນນີ້',en:'New Today',zh:'今天上架'})[lang]
            : ({lo:'ໃໝ່ອາທິດນີ້',en:'New This Week',zh:'本周新上'})[lang])
          + '</span></div>'
      : '';
    var actLineTxt = getActivityLine(p, lang);

    var card = renderPropertyCard(p, {
      lang: lang,
      isFeatured: isFeaturedCard,
      statusBadgeHtml: getBadgeHtml(p, lang, isFeaturedCard),
      extraOverlayHtml: newBadgeHtml,
      photoCountHtml: photoCountHtml,
      aiHtml: aiHtml,
      showCardTag: true,
      activityBadgesHtml: getActivityBadgesHtml(p, lang),
      showAmenities: true,
      isSaved: saved.has(p.slug),
      onHeartToggle: function(slug, e) { return ptToggleSave(slug, e, p.id); },
      footerHtml: actLineTxt ? '<p class="card-activity-line">' + esc(actLineTxt) + '</p>' : '',
      dataTrack: p.id ? {
        track: 'listing-card', type: 'card', propertyId: p.id, label: p['title_'+lang] || p.title_en || '',
        meta: JSON.stringify({ position: idx + 1, featured: !!isFeaturedCard })
      } : null,
      onClick: p.id ? function() {
        postEvent('listing_events', { property_id: p.id, event_type: 'click', session_id: getOrCreateSessionId(), source: 'search', search_position: idx + 1 });
      } : null
    });

    return card;
  }

  // Append one page, then arm a sentinel for the next. The sentinel is a real
  // grid child so it sits BELOW the last card; observing it means "the visitor
  // has scrolled to the end of what is rendered".
  function renderNextPage() {
    var sentinel = document.getElementById('pt-grid-sentinel');
    if (sentinel && sentinel.parentNode) sentinel.parentNode.removeChild(sentinel);

    var end = Math.min(_ptCursor + PT_PAGE_SIZE, sorted.length);
    for (var i = _ptCursor; i < end; i++) container.appendChild(buildCard(sorted[i], i));
    _ptCursor = end;

    if (_ptCursor >= sorted.length) return;   // everything rendered

    sentinel = document.createElement('div');
    sentinel.id = 'pt-grid-sentinel';
    sentinel.style.cssText = 'grid-column:1/-1;height:1px;';
    container.appendChild(sentinel);

    if (typeof IntersectionObserver === 'function') {
      var io = new IntersectionObserver(function (entries) {
        if (!entries.some(function (e) { return e.isIntersecting; })) return;
        io.disconnect();
        renderNextPage();
      }, { rootMargin: '200px 0px' });   // just ahead of the scroll, not a cascade
      io.observe(sentinel);
    } else {
      // No IntersectionObserver (very old browser): render everything rather
      // than stranding listings the visitor could never reach.
      while (_ptCursor < sorted.length) container.appendChild(buildCard(sorted[_ptCursor], _ptCursor++));
    }
  }

  renderNextPage();
}

function updateSortLabels() {
  var lang = getCurrentLang();
  var sel = document.getElementById('sort-select');
  if (!sel) return;
  Array.from(sel.options).forEach(function(opt){
    var label = opt.getAttribute('data-' + lang);
    if (label) opt.text = label;
  });
}

// applyPintagLang() -- the DOM-mutation portion of a language switch,
// shared by an explicit setLang() click and the page-init resolution
// below (see index.html for the same pattern). Always reflects the
// resolved language into the URL via lang.js's reflectLangInUrl() so a
// copied/shared listings.html URL reproduces the language being viewed.
function applyPintagLang(lang, btn) {
  document.body.className = lang === 'lo' ? '' : 'lang-' + lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.remove('active'); });
  var activeBtn = btn || document.querySelector('.lang-btn[data-lang="' + lang + '"]');
  if (activeBtn) activeBtn.classList.add('active');
  updateSortLabels();   // the <option> text is static Lao; relabel on every apply, not only on a toggle
  reflectLangInUrl(lang);
}

function setLang(lang, btn) {
  persistPintagLang(lang);
  applyPintagLang(lang, btn);
  updateSortLabels();
  populateProvinceOptions();
  populateDistrictOptions();
  renderPriceOptions();
  // The visible surface must be the one repainted: in Map view a grid
  // re-render left the "N of M listings have no exact location" notice, the
  // count and an open preview in the previous language.
  if (_viewMode === 'map') closeMapPreview();
  _renderCurrentView();
}

// Bug 2 fix: drives the right-edge fade on the horizontally-scrollable
// Property Type row. Shown only while there is real unscrolled content
// past the right edge (not just "content is scrollable in principle") so
// it correctly disappears once the user scrolls to the last chip.
function updateFiltersFade() {
  var scroller = document.getElementById('filters');
  var wrap = document.getElementById('filters-wrap');
  if (!scroller || !wrap) return;
  var hasMore = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft > 2;
  wrap.classList.toggle('has-more-filters', hasMore);
}
(function initFiltersFade() {
  var scroller = document.getElementById('filters');
  if (!scroller) return;
  scroller.addEventListener('scroll', updateFiltersFade, { passive: true });
  window.addEventListener('resize', updateFiltersFade);
  // Fonts/layout may still be settling on first paint -- recheck one tick
  // later so the initial fade state (shown when the row genuinely
  // overflows) is accurate rather than racing layout.
  updateFiltersFade();
  setTimeout(updateFiltersFade, 0);
})();

// Resolve once at init, before the first fetch/render -- deliberately no
// persistPintagLang() here (only an explicit setLang() click persists),
// so an inferred default is never written back as if the visitor chose
// it. updateListingsMetaForFilters() (called from inside renderListings())
// reads getCurrentLang() off the body class this sets, so metadata is
// correct from the very first render.
applyPintagLang(resolvePintagLang());
_readFiltersFromUrl();

loadListings();

</script>
